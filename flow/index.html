<style>
@font-face{font-family:"Fredoka";src:url("fredoka.woff2") format("woff2");font-weight:300 700;font-style:normal;font-display:swap}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<title>mFlow</title>
<style>
/* Layout: ein Bildschirm – Kopfzeile, dann Hauptmenü | Levelübersicht | Statistik | Spiel (Zähler, Canvas-Spielfeld, Hilfeleiste).
   Bewusst nur dunkel: Anthrazit + Gelb wie mZip. */
:root{
  --bg:#1F2125;
  --surface:#2A2D33;
  --surface-2:#353941;
  --line:#474C55;
  --fg:#F4F1E8;
  --muted:#A4A9B1;
  --accent:#FFC629;
  --accent-ink:#1F2125;
  --warn:#FF7A6B;
  --display:"Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --body:-apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%;margin:0;overflow:hidden;
  background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
.app{height:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px 12px}
button{font:inherit}

.top{display:flex;align-items:center;gap:12px;min-height:40px}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em}
.brand .mark{display:block;width:32px;height:32px;border-radius:9px;overflow:hidden;flex:none}
.lvl{font-family:var(--display);font-weight:600;color:var(--fg);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.spacer{flex:1}
.stars{display:flex;gap:2px}
.stars svg{width:22px;height:22px}
.total{display:flex;align-items:center;gap:5px;font-family:var(--display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.total svg{width:20px;height:20px}
.icon-btn{appearance:none;border:0;background:var(--surface);color:var(--fg);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;flex:none}
.icon-btn svg{width:22px;height:22px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Hauptmenü */
.daily{appearance:none;border:0;cursor:pointer;touch-action:manipulation;position:relative;flex:none;padding:0;
  width:56px;height:58px;border-radius:14px;margin:10px 6px 0 0;background:var(--fg);color:var(--accent-ink);display:flex;flex-direction:column;overflow:visible;
  box-shadow:0 6px 22px rgba(255,198,41,.25)}
.daily .dtop{display:block;height:19px;border-radius:14px 14px 0 0;background:var(--accent);font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;line-height:21px;text-align:center}
.daily .dnum{flex:1;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:25px;line-height:1;font-variant-numeric:tabular-nums;padding-bottom:2px}
.daily .ring{position:absolute;top:-5px;width:6px;height:11px;border-radius:3px;background:var(--accent-ink);border:2px solid var(--bg)}
.daily .ring.l{left:13px}.daily .ring.r{right:13px}
.daily .badge{position:absolute;top:-9px;right:-10px;width:21px;height:21px;border-radius:50%;background:var(--warn);border:3px solid var(--bg);display:grid;place-items:center}
.daily .badge svg{width:11px;height:11px;color:var(--bg)}
.daily.open .badge{animation:ping 1.8s ease-in-out infinite}
.daily.open{animation:nudge 3.2s ease-in-out infinite}
.daily.solved .badge{background:var(--fg)}
@keyframes ping{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes nudge{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-7deg)}94%{transform:rotate(6deg)}97%{transform:rotate(-3deg)}}
.mbtn svg{width:21px;height:21px;flex:none}
.continue svg{width:22px;height:22px}
.main{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:26px;width:100%;max-width:440px;margin:0 auto;padding-bottom:16px}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.hero .logo{width:96px;height:96px;border-radius:24px;overflow:hidden;margin-bottom:8px;box-shadow:0 10px 40px rgba(255,198,41,.18)}
.hero .logo svg,.brand .mark svg{display:block;width:100%;height:100%}
.hero h1{margin:0;font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:.01em}
.hero p{margin:0;color:var(--muted);font-size:16px}
.main-btns{display:flex;flex-direction:column;gap:10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtn{appearance:none;border:0;cursor:pointer;touch-action:manipulation;border-radius:14px;min-height:52px;padding:10px 16px;
  font-family:var(--display);font-weight:600;font-size:17px;background:var(--surface-2);color:var(--fg);display:flex;align-items:center;justify-content:center;gap:8px}
.mbtn.primary{background:var(--accent);color:var(--accent-ink)}
.mbtn.row{justify-content:space-between}
.mbtn.row .r{font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted)}
.mbtn.row .r.ok{color:var(--accent)}
.mbtn.quiet{background:none;color:var(--muted);font-size:15px;min-height:44px}
.mbtn small{font-family:var(--body);font-weight:600;font-size:12px;opacity:.75}
.mbtn[disabled]{opacity:.4;cursor:default}
.continue{min-height:62px;font-size:21px;border-radius:18px}

/* Levelübersicht + Statistik */
.page{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.page h1{margin:0;font-family:var(--display);font-weight:700;font-size:26px}
.page h2{margin:6px 0 0;font-family:var(--display);font-weight:600;font-size:18px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:14px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;border-radius:11px;min-height:40px;background:none;color:var(--muted);font-family:var(--display);font-weight:600;font-size:16px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface-2);color:var(--fg)}
.lvinfo{margin:-4px 0 0;color:var(--muted);font-size:14px;font-weight:600;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.tile{appearance:none;cursor:pointer;touch-action:manipulation;aspect-ratio:1/1.05;max-width:100%;position:relative;
  background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:var(--display)}
.tile .no{font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile .mini{display:flex;gap:1px}
.tile .mini svg{width:14px;height:14px}
.tile .crown{position:absolute;top:5px;right:6px;width:16px;height:16px}
.tile .check{width:18px;height:18px;color:var(--accent)}
.tile.current{border-color:var(--accent);background:var(--surface-2)}
.tile.current .tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.tile[disabled]{opacity:.35;cursor:default}
.tile[disabled] svg{width:16px;height:16px;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:15px;color:var(--muted);font-weight:600}
.stat .k{font-size:13px;color:var(--muted);font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-variant-numeric:tabular-nums;min-width:0}
.day .d{font-size:12px;color:var(--muted);font-weight:600}
.day .n{font-family:var(--display);font-weight:700;font-size:20px}
.day .s{font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap}
.day.today{outline:2px solid var(--line)}

/* Spiel */
.play{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.meter{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.count{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:2px solid var(--line);border-radius:14px;
  padding:4px 14px 5px;font-family:var(--display);
}
.count .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.count .num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.count svg{width:18px;height:18px}
.count.full{border-color:var(--warn)}
.count.full .num{color:var(--warn)}
.count.over .num{color:var(--muted)}
.count.bump{animation:bump .35s ease}
@keyframes bump{30%{transform:scale(1.08)}}
.board{flex:1;min-height:0;position:relative}
.board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.status{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);color:var(--muted);font-size:18px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tool{
  appearance:none;border:0;cursor:pointer;touch-action:manipulation;position:relative;
  background:var(--surface);color:var(--fg);border-radius:16px;min-height:62px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:var(--display);font-weight:600;font-size:13px;padding:8px 4px;
}
.tool svg{width:24px;height:24px;color:var(--accent)}
.tool:active{transform:scale(.97)}
.tool[disabled]{opacity:.4;cursor:default}
.tool .cost{position:absolute;top:-7px;right:6px;font-size:11px;line-height:1;padding:3px 6px;border-radius:8px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tool .cost.pay{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool[aria-pressed="true"] svg{color:var(--accent-ink)}

.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;
  padding:10px 14px;border-radius:12px;max-width:min(92vw,420px);text-align:center;z-index:50;
  box-shadow:0 8px 24px rgba(0,0,0,.35)
}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(12,13,15,.66);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:2px solid var(--line);border-radius:22px;width:min(100%,430px);max-height:100%;overflow:auto;padding:22px 20px 18px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-family:var(--display);font-weight:700;font-size:26px;text-wrap:balance}
.sheet p{margin:0;color:var(--muted);line-height:1.45;font-size:15px}
.sheet ul{margin:0;padding-left:18px;color:var(--fg);line-height:1.45;font-size:15px;display:flex;flex-direction:column;gap:6px}
.sheet h3{margin:4px 0 0;font-family:var(--display);font-weight:600;font-size:17px;color:var(--accent)}
.sheet .bigstars{display:flex;gap:6px;justify-content:center;padding:4px 0}
.sheet .bigstars svg{width:46px;height:46px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.fact .k{font-size:12px;color:var(--muted);font-weight:600}
.fact .v{font-family:var(--display);font-weight:700;font-size:20px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.fact .v svg{width:18px;height:18px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface-2);border-radius:14px;padding:12px 14px}
.toggle .t{display:flex;flex-direction:column;gap:2px}
.toggle .t b{font-family:var(--display);font-weight:600;font-size:16px}
.toggle .t span{font-size:13px;color:var(--muted)}
.switch{appearance:none;border:0;cursor:pointer;width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--fg);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:24px;background:var(--accent-ink)}

@media (prefers-reduced-motion:reduce){.daily.open,.daily.open .badge{animation:none}.count.bump{animation:none}.tool:active{transform:none}.switch::after{transition:none}}
@media (max-width:420px){
  .brand{font-size:19px}.brand .mark{width:28px;height:28px}
  .tool{font-size:12px;min-height:56px}
  .count .num{font-size:19px}.count{padding:3px 10px 4px}
}
</style>

</head>

  </header>

<script>
// ENGINE START
const COLORS=['#E5484D','#3D7BF5','#2EAF62','#F2862B','#9A63F0','#EE5DA6','#1DB9C8','#9B5E33','#A6D23A','#F2E3C6','#F7D33C','#24398F','#7E1E40','#AEB4BD'];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,rng){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

// Logische Maße – das Spielfeld wird als Ganzes skaliert.
const LG={CELL:80,GW:46,GH:124,SIDE:54,LANEGAP:28,ROWH:192,TOP:22,TW:14,XOL:10,XL:36,SEG:44};

// Streckenformen: 'serp' (Serpentine, Rücklauf außen) oder 'pockets' (volle Reihe oben, darunter Taschen in H-Form),
// jeweils optional gespiegelt (mirror) und mit umgekehrter Fließrichtung (reverse).
function buildLayout(spec){
  const CW=LG.CELL, ys=spec.rows.map((_,k)=>LG.TOP+k*LG.ROWH), R=spec.rows.length;
  let W,H,pts; const groups=[];
  if(spec.kind==='pockets'){
    const half=Math.max(2,...spec.rows.slice(1).flatMap(r=>[r.left.length,r.right.length])), GAP=64;
    W=Math.max(2*LG.SIDE+Math.max(4,spec.rows[0].length)*CW,2*LG.SIDE+2*half*CW+GAP);
    const xL=LG.XL,xR=W-LG.XL,xCm=W/2-16,xCp=W/2+16;
    pts=[[xL,ys[0]],[xR,ys[0]]];
    for(let k=1;k<R;k++){const a=k%2?xR:xCp,b=k%2?xCp:xR;pts.push([a,ys[k]],[b,ys[k]]);}
    const endR=(R-1)%2?xCp:xR, startL=(R-1)%2?xCm:xL, yb=ys[R-1]+LG.ROWH-14;
    pts.push([endR,yb],[startL,yb]);
    for(let k=R-1;k>=1;k--){const a=k%2?xCm:xL,b=k%2?xL:xCm;pts.push([a,ys[k]],[b,ys[k]]);}
    H=yb+LG.TW;
    const lc=(LG.SIDE+W/2-GAP/2)/2, rc=(W/2+GAP/2+W-LG.SIDE)/2;
    groups.push({y:ys[0],cx0:W/2,g:spec.rows[0]});
    for(let k=1;k<R;k++){groups.push({y:ys[k],cx0:lc,g:spec.rows[k].left});groups.push({y:ys[k],cx0:rc,g:spec.rows[k].right});}
  } else {
    const cols=Math.max(4,...spec.rows.map(r=>r.length));
    W=LG.SIDE*2+cols*CW; const xL=LG.XL,xR=W-LG.XL,xOL=LG.XOL;
    pts=[[xL,ys[0]],[xR,ys[0]]];
    for(let k=1;k<R;k++){ if(k%2) pts.push([xR,ys[k]],[xL,ys[k]]); else pts.push([xL,ys[k]],[xR,ys[k]]); }
    const last=ys[R-1];
    if(R%2){ const yb=last+LG.ROWH-14; pts.push([xR,yb],[xOL,yb],[xOL,ys[0]]); H=yb+LG.TW; }
    else { pts.push([xOL,last],[xOL,ys[0]]); H=last+LG.LANEGAP+LG.GH+24; }
    spec.rows.forEach((row,k)=>groups.push({y:ys[k],cx0:W/2,g:row}));
  }
  const pos=[];
  for(const gr of groups){const x0=gr.cx0-gr.g.length*CW/2;gr.g.forEach((gi,i)=>{pos[gi]={cx:x0+CW*(i+.5),top:gr.y+LG.LANEGAP,laneY:gr.y};});}
  if(spec.mirror){pts=pts.map(p=>[W-p[0],p[1]]);pos.forEach(p=>{if(p)p.cx=W-p.cx;});}
  if(spec.reverse) pts.reverse();
  const segs=[]; let P=0;
  for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];const len=Math.hypot(b[0]-a[0],b[1]-a[1]);if(len<.01)continue;segs.push({a,b,len,s:P});P+=len;}
  const N=Math.round(P/LG.SEG), cl=P/N;
  pos.forEach(p=>{if(!p)return;const sg=segs.find(s=>Math.abs(s.a[1]-p.laneY)<.5&&Math.abs(s.b[1]-p.laneY)<.5&&p.cx>=Math.min(s.a[0],s.b[0])-.5&&p.cx<=Math.max(s.a[0],s.b[0])+.5);
    p.inlet=Math.floor((sg.s+Math.abs(p.cx-sg.a[0]))/cl)%N;});
  return {W,H,pts,segs,P,N,cl,pos};
}

// Glas: {type:'normal'|'metal'|'locked'|'done', items:[{c,h}], pend, cap(4|3), only(Farbe|null), valve, closed}
function mkGlass(type,items){return {type,items,pend:0,cap:4,only:null,valve:false,closed:false};}
function newState(glasses,N,lockQ){return {g:glasses,slots:new Array(N).fill(null),off:0,tick:0,inTrack:0,idle:0,done:0,lockQ};}
function cloneState(st){return {g:st.g.map(x=>({type:x.type,items:x.items.map(i=>({c:i.c,h:i.h,t:0})),pend:x.pend,cap:x.cap,only:x.only,valve:x.valve,closed:x.closed})),
  slots:st.slots.map(u=>u?{c:u.c,o:u.o,b:u.b}:null),off:st.off,tick:st.tick,inTrack:st.inTrack,idle:st.idle,done:st.done,lockQ:st.lockQ.slice()};}
const topItem=gl=>gl.items[gl.items.length-1];
function accepts(gl,c){
  return (gl.type==='normal'||gl.type==='metal')&&gl.pend===0&&!gl.closed&&gl.items.length<gl.cap
    &&(gl.only===null||gl.only===c)&&(gl.items.length===0||topItem(gl).c===c);
}
// Angefangenes einfarbiges Glas dieser Farbe mit Platz? Dann werden leere Gläser übersprungen.
function monoWaiting(st,c){for(const o of st.g){if(o.items.length>0&&accepts(o,c)&&o.items.every(i=>i.c===c&&!i.h))return true;}return false;}
function totalPend(st){let s=0;for(const g of st.g)s+=g.pend;return s;}
function loopCount(st){return st.inTrack+totalPend(st);}
function slotAt(st,N,p){return ((p-st.off)%N+N)%N;}
function revealTop(gl){const t=topItem(gl);if(t)t.h=false;}
function topRun(gl){const n=gl.items.length;if(!n)return 0;const c=gl.items[n-1].c;let k=0;for(let i=n-1;i>=0&&gl.items[i].c===c&&!gl.items[i].h;i--)k++;return k;}

function step(st,cfg,ev){
  const N=cfg.N; st.off=(st.off+1)%N; st.tick++; st.idle++;
  for(let gi=0;gi<st.g.length;gi++){
    const gl=st.g[gi], j=slotAt(st,N,cfg.inlet[gi]), u=st.slots[j];
    if(!u||!accepts(gl,u.c)) continue;
    if(u.o===gi&&st.tick-u.b<N) continue;            // erst nach einer Runde zurück ins eigene Glas
    if(!gl.items.length&&monoWaiting(st,u.c)) continue; // einfarbige Gläser haben Vorrang
    gl.items.push({c:u.c,h:false,t:ev?ev.now:0}); st.slots[j]=null; st.inTrack--; st.idle=0;
    if(ev) ev.absorb(gi,u.c);
    if(gl.items.length===4&&gl.items.every(i=>i.c===u.c)){
      gl.type='done'; gl.closed=false; st.done++;
      if(st.lockQ.length){const li=st.lockQ.shift(),L=st.g[li];L.type='normal';revealTop(L);if(ev)ev.unlock(li);}
      if(ev) ev.done(gi,u.c);
    }
  }
  for(let gi=0;gi<st.g.length;gi++){
    const gl=st.g[gi]; if(gl.pend<=0) continue;
    const j=slotAt(st,N,cfg.inlet[gi]); if(st.slots[j]) continue;
    const it=gl.items.pop(); gl.pend--; st.slots[j]={c:it.c,o:gi,b:st.tick}; st.inTrack++; st.idle=0; revealTop(gl);
  }
}
function tapGlass(st,cfg,gi){
  const gl=st.g[gi]; if(gl.type!=='normal'||gl.pend>0||!gl.items.length) return 0;
  const k=Math.min(topRun(gl),cfg.limit-loopCount(st)); if(k<=0) return -1;
  gl.pend=k; st.idle=0; return k;
}
function quiet(st,cfg){return totalPend(st)===0&&(st.inTrack===0||st.idle>cfg.N+1);}
function anyTappable(st){return st.g.some(g=>g.type==='normal'&&g.items.length>0);}
function isStuck(st,cfg){if(st.done>=cfg.C||!quiet(st,cfg))return false;return loopCount(st)>=cfg.limit||!anyTappable(st);}

// Probespiele: liefern die Zahl der Züge bis zum Sieg oder -1.
function settle(st,cfg){for(let i=0;i<60000;i++){step(st,cfg,null);if(quiet(st,cfg))return;}}
function playout(st0,cfg,rng){
  const st=cloneState(st0);
  for(let t=0;t<300;t++){
    if(st.done>=cfg.C) return t;
    const room=cfg.limit-loopCount(st); if(room<=0) return -1;
    let best=-1,bs=-1e9;
    for(let gi=0;gi<st.g.length;gi++){
      const gl=st.g[gi]; if(gl.type!=='normal'||!gl.items.length) continue;
      const c=topItem(gl).c,k=topRun(gl); let s=rng()*2.2,match=false,empty=false;
      for(let h=0;h<st.g.length;h++){if(h===gi)continue;const o=st.g[h];if(!accepts(o,c))continue;if(!o.items.length)empty=true;else match=true;}
      if(match)s+=3; else if(empty)s+=1; else s-=1;
      if(k>room)s-=1;
      if(gl.items.length===k)s+=.5;
      if(s>bs){bs=s;best=gi;}
    }
    if(best<0) return -1;
    tapGlass(st,cfg,best); settle(st,cfg);
  }
  return -1;
}

// Schwierigkeit je Modus
// 300 feste Level. Schwierigkeit durchmischt statt ansteigend:
// ca. 10 % mittel, 55 % schwer, 35 % sehr schwer – je Levelnummer fest ausgewürfelt.
const MAXL=300;
const TIERS=['Mittel','Schwer','Sehr schwer'];
function params(mode,key){
  const r=mulberry32(hashStr('tier-'+key)), pick=(a,b)=>a+Math.floor(r()*(b-a+1));
  if(mode==='easy') return {tier:-1,C:pick(3,6),nLock:0,hp:0,nMetal:1,filter:false,small:false,valves:0,limit:6};
  const x=r(), tier=x<.10?0:x<.65?1:2;
  if(tier===0) return {tier,C:pick(7,8),nLock:pick(0,1),hp:.3,nMetal:pick(1,2),filter:r()<.3,small:false,valves:pick(0,1),limit:5};
  if(tier===1) return {tier,C:pick(9,11),nLock:pick(1,3),hp:.45+r()*.15,nMetal:2,filter:r()<.6,small:r()<.5,valves:1,limit:5};
  return {tier,C:pick(11,12),nLock:pick(2,4),hp:.6+r()*.15,nMetal:2,filter:true,small:r()<.7,valves:pick(1,2),limit:4};
}

function randomLevel(P,n,rng){
  const C=P.C, G=C+1;
  const pal=shuffle(COLORS.map((_,i)=>i),rng).slice(0,C);
  let contents;
  for(let tries=0;tries<200;tries++){
    const sizes=Array(G).fill(4); let rem=4;
    while(rem>0){const i=Math.floor(rng()*G);if(sizes[i]>0){sizes[i]--;rem--;}}
    const units=shuffle(pal.flatMap(c=>[c,c,c,c]),rng); let p=0;
    contents=sizes.map(sz=>units.slice(p,p+=sz));
    if(!contents.some(a=>a.length===4&&a.every(c=>c===a[0]))) break;
  }
  const lockedIdx=new Set(shuffle([...Array(G).keys()],rng).slice(0,P.nLock));
  const glasses=contents.map((a,i)=>mkGlass(lockedIdx.has(i)?'locked':'normal',a.map((c,j)=>({c,h:j<a.length-1&&rng()<P.hp,t:0}))));
  for(let m=0;m<P.nMetal;m++) glasses.push(mkGlass('metal',[]));
  const metalList=[...Array(P.nMetal).keys()].map(m=>G+m);
  const free=[...Array(G).keys()].filter(i=>!lockedIdx.has(i));
  if(P.small){const cand=free.filter(i=>glasses[i].items.length<=3);if(cand.length)glasses[cand[Math.floor(rng()*cand.length)]].cap=3;}
  if(P.filter) glasses[metalList[0]].only=pal[Math.floor(rng()*pal.length)];
  if(P.valves){shuffle([...free,...metalList],rng).slice(0,P.valves).forEach(i=>glasses[i].valve=true);}
  // Anordnung
  const lockedList=[...lockedIdx].sort((a,b)=>a-b);
  const metalTop=!lockedList.length||rng()<.5;
  const half=Math.ceil(lockedList.length/2);
  const topRow=metalTop?[...lockedList.slice(0,half),...metalList,...lockedList.slice(half)]:lockedList.slice();
  const pool=free.slice();
  if(!metalTop) metalList.forEach(m=>pool.splice(Math.floor(rng()*(pool.length+1)),0,m));
  const spec={kind:(n>=2&&pool.length>=4&&n%3!==1)?'pockets':'serp',mirror:n%2===0,reverse:Math.floor((n-1)/2)%2===1,rows:[topRow]};
  if(spec.kind==='pockets'){
    let cap=2; if(Math.ceil(pool.length/(2*cap))>4) cap=3;
    for(let i=0;i<pool.length;i+=2*cap){const part=pool.slice(i,i+2*cap),l=Math.ceil(part.length/2);spec.rows.push(rng()<.5?{left:part.slice(0,l),right:part.slice(l)}:{left:part.slice(l),right:part.slice(0,l)});}
  } else {
    const maxPer=3+Math.floor(rng()*2), nRows=Math.ceil(pool.length/maxPer), per=Math.ceil(pool.length/nRows);
    for(let r=0;r<nRows;r++) spec.rows.push(pool.slice(r*per,(r+1)*per));
  }
  return {glasses,spec,lockQ:topRow.filter(i=>lockedIdx.has(i)),C};
}

function makeLevel(mode,n,rng,key){
  const P=params(mode,key); let fb=null;
  const build=lv=>{const lay=buildLayout(lv.spec);return {spec:lv.spec,lay,cfg:{N:lay.N,inlet:lv.glasses.map((_,i)=>lay.pos[i].inlet),C:lv.C,limit:P.limit},st:newState(lv.glasses,lay.N,lv.lockQ.slice())};};
  const bestOf=(L,tries)=>{let b=-1;for(let p=0;p<tries;p++){const r=playout(L.st,L.cfg,rng);if(r>=0&&(b<0||r<b))b=r;}return b;};
  for(let a=0;a<25;a++){
    const L=build(randomLevel(P,n,rng));
    let first=-1; for(let p=0;p<40&&first<0;p++) first=playout(L.st,L.cfg,rng);
    if(first>=0){const b=bestOf(L,30);L.target=b>=0?Math.min(b,first):first;L.tier=P.tier;return L;}
    fb=L;
  }
  fb.tier=P.tier; fb.cfg.limit++; const b=bestOf(fb,60); fb.target=b>=0?b+1:Math.round(fb.cfg.C*2.5); return fb;
}

function drawSym(i,x,y,r){
  const ink=lum(COLORS[i])>.5?'rgba(31,33,37,.78)':'rgba(255,255,255,.9)';
  ctx.save();ctx.fillStyle=ink;ctx.strokeStyle=ink;ctx.lineWidth=Math.max(1.4,r*.36);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  const poly=(n,rot,rr)=>{for(let k=0;k<n;k++){const a=rot+k*2*Math.PI/n;k?ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):ctx.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();};
  switch(i%14){
    case 0: ctx.arc(x,y,r*.72,0,7);ctx.fill();break;
    case 1: ctx.rect(x-r*.62,y-r*.62,r*1.24,r*1.24);ctx.fill();break;
    case 2: poly(3,-Math.PI/2,r*.85);ctx.fill();break;
    case 3: poly(4,0,r*.85);ctx.fill();break;
    case 4: ctx.moveTo(x-r*.7,y);ctx.lineTo(x+r*.7,y);ctx.moveTo(x,y-r*.7);ctx.lineTo(x,y+r*.7);ctx.stroke();break;
    case 5: ctx.moveTo(x-r*.55,y-r*.55);ctx.lineTo(x+r*.55,y+r*.55);ctx.moveTo(x+r*.55,y-r*.55);ctx.lineTo(x-r*.55,y+r*.55);ctx.stroke();break;
    case 6: ctx.arc(x,y,r*.6,0,7);ctx.stroke();break;
    case 7: poly(3,Math.PI/2,r*.85);ctx.fill();break;
    case 8: poly(6,0,r*.78);ctx.fill();break;
    case 9: for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?r*.4:r*.9;k?ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):ctx.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();ctx.fill();break;
    case 10: ctx.moveTo(x-r*.7,y);ctx.lineTo(x+r*.7,y);ctx.stroke();break;
    case 11: ctx.arc(x-r*.42,y,r*.3,0,7);ctx.arc(x+r*.42,y,r*.3,0,7);ctx.fill();break;
    case 12: ctx.moveTo(x,y-r*.7);ctx.lineTo(x,y+r*.7);ctx.stroke();break;
    case 13: ctx.rect(x-r*.55,y-r*.55,r*1.1,r*1.1);ctx.stroke();break;
  }
  ctx.restore();
}

document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});

// ---------- HUD ----------
let lastCount='',lastMoves='';
function hud(){
  $('stars').innerHTML=starsHTML(game.stars);
  $('stars').setAttribute('aria-label',game.stars+' von 3 Sternen');
  const pay=game.uses%2===1;
  document.querySelectorAll('.tool .cost').forEach(el=>{const g=el.parentElement.id==='tGlass',p=g||pay;el.textContent=p?'★ −1':'gratis';el.classList.toggle('pay',p);});
  $('tGlass').disabled=game.added>=2;
  lastMoves='';
}
function updateCount(){
  if(!game.st)return;
  const n=loopCount(game.st), t=n+' / '+game.cfg.limit;
  if(t!==lastCount){lastCount=t;$('countNum').textContent=t;$('count').classList.toggle('full',n>=game.cfg.limit);}
  const m=game.moves+' / '+game.target;
  if(m!==lastMoves){lastMoves=m;$('movesNum').textContent=m;const ok=game.moves<=game.target;$('moves').classList.toggle('over',!ok);$('movesCrown').innerHTML=crown(ok);
    $('moves').setAttribute('aria-label','Züge '+game.moves+', Ziel '+game.target);}
}
function bumpCount(){const c=$('count');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump');}
let toastTimer=0;
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,1900);}

// ---------- Dialoge ----------
function showModal({title,html,stars,buttons,onRender}){
  const sh=$('sheet'); sh.innerHTML='';
  const h=document.createElement('h2');h.textContent=title;sh.appendChild(h);
  if(stars!==undefined){const d=document.createElement('div');d.className='bigstars';d.innerHTML=starsHTML(stars);sh.appendChild(d);}
  if(html){const d=document.createElement('div');d.innerHTML=html;d.style.display='flex';d.style.flexDirection='column';d.style.gap='10px';sh.appendChild(d);}
  const bw=document.createElement('div');bw.className='btns';
  buttons.forEach((b,i)=>{const e=document.createElement('button');e.className='mbtn'+(b.primary?' primary':'')+(b.quiet?' quiet':'');e.id='mb'+i;e.innerHTML=b.label+(b.sub?' <small>'+b.sub+'</small>':'');if(b.disabled)e.disabled=true;e.onclick=b.onClick;bw.appendChild(e);});
  sh.appendChild(bw);
  $('modal').hidden=false; game.modal=true;
  if(onRender)onRender(sh);
  const f=bw.querySelector('button:not([disabled])'); if(f) f.focus({preventScroll:true});
}
function closeModal(){$('modal').hidden=true;game.modal=false;}

function showRules(){
  showModal({title:'So geht mFlow',html:
    '<ul>'+
    '<li>Tippe auf ein Glas: alle gleichen Farben ganz oben fließen in den Kreislauf.</li>'+
    '<li>Die Farbe fließt ins nächste passende Glas: ein leeres oder eines, dessen oberste Farbe gleich ist. In ein Glas passen 4 Farben.</li>'+
    '<li>Gibt es schon ein Glas, das nur diese Farbe enthält, fließt sie dorthin und lässt leere Gläser aus.</li>'+
    '<li>4 gleiche Farben in einem Glas: fertig. Dann wird ein gesperrtes Glas frei.</li>'+
    '<li>Die Zahl „Kreislauf“ zeigt, wie viele Portionen unterwegs sind und wie viele hineinpassen.</li>'+
    '</ul>'+
    '<h3>Besondere Gläser</h3><ul>'+
    '<li><b>Metallsockel:</b> nimmt nur auf, nichts fließt heraus.</li>'+
    '<li><b>Farbfilter</b> (farbiger Rand): nimmt nur diese eine Farbe an.</li>'+
    '<li><b>Ventil</b> (Knopf an der Zuleitung): antippen zum Öffnen oder Schließen. Ein geschlossenes Glas nimmt nichts auf. Kostet keinen Zug.</li>'+
    '<li><b>Kleines Glas:</b> nur 3 Plätze, eignet sich als Zwischenlager.</li>'+
    '</ul>'+
    '<h3>Sterne und Krone</h3><ul>'+
    '<li>Ein Platz mehr im Kreislauf und jedes Extra-Glas kosten sofort einen Stern. Bei „Zurück“ und „Mischen“ kostet jede zweite Nutzung einen Stern.</li>'+
    '<li>Schaffst du das Level in höchstens so vielen Zügen wie das Ziel, gibt es die Krone.</li>'+
    '<li>Im einfachen Modus gibt es keine versteckten Farben und keine besonderen Gläser. Sterne und Krone werden genauso vergeben wie im normalen Modus.</li>'+
    '</ul>',buttons:[{label:ICON('check')+'Verstanden',primary:true,onClick:closeModal}]});
}
function showSettings(){
  showModal({title:'Einstellungen',html:
    '<div class="toggle"><div class="t"><b>Farbsymbole</b><span>Zeigt auf jeder Farbe ein eigenes Zeichen, damit sich ähnliche Farben sicher unterscheiden lassen.</span></div>'+
    '<button class="switch" id="symSwitch" role="switch" aria-checked="'+data.symbols+'" aria-label="Farbsymbole"></button></div>',
    buttons:[{label:ICON('check')+'Fertig',primary:true,onClick:closeModal},{label:ICON('trash')+'Fortschritt zurücksetzen',quiet:true,onClick:confirmReset}],
    onRender:sh=>{const s=sh.querySelector('#symSwitch');s.onclick=()=>{data.symbols=!data.symbols;s.setAttribute('aria-checked',String(data.symbols));save();};}});
}
function confirmReset(){
  showModal({title:'Fortschritt zurücksetzen?',html:'<p>Alle Level in beiden Modi, Sterne, Kronen, Tagesrätsel und die Statistik werden gelöscht. Das lässt sich nicht rückgängig machen.</p>',buttons:[
    {label:ICON('trash')+'Alles zurücksetzen',primary:true,onClick:()=>{const s=data.symbols;data=freshData();data.symbols=s;save();showMain();toast('Fortschritt zurückgesetzt.');}},
    {label:ICON('close')+'Abbrechen',onClick:closeModal}]});
}
function showMenu(){
  const b=[{label:ICON('play')+'Weiterspielen',primary:true,onClick:closeModal},{label:ICON('restart')+'Level neu starten',onClick:()=>{closeModal();restart();}}];
  if(game.mode!=='daily') b.push({label:ICON('grid')+'Zur Levelübersicht',onClick:()=>showLevels(game.mode)});
  b.push({label:ICON('home')+'Zum Hauptmenü',onClick:showMain},{label:ICON('help')+'Spielregeln',onClick:showRules});
  showModal({title:levelLabel(),buttons:b});
}
function showStuck(){
  game.stuckShown=true; const valve=game.st.g.some(g=>g.closed&&g.type!=='done');
  const extra=valve?[{label:ICON('valve')+'Selbst ein Ventil öffnen',onClick:closeModal}]:[];
  showModal({title:'Der Kreislauf hängt fest',html:'<p>Keine Farbe findet mehr ein passendes Glas. Mit einem Platz mehr im Kreislauf kannst du weiterspielen'+(valve?', oder du öffnest ein geschlossenes Ventil.':'.')+'</p>',buttons:[...extra,
    {label:ICON('plus')+'Platz +1',sub:'★ −1',primary:true,onClick:()=>{game.stars=Math.max(0,game.stars-1);game.cfg.limit++;game.stuckShown=false;closeModal();hud();bumpCount();}},
    {label:ICON('undo')+'Zurück',sub:game.uses%2===0?'gratis':'★ −1',disabled:!game.undo.length,onClick:()=>{closeModal();doUndo();}},
    {label:ICON('restart')+'Level neu starten',onClick:()=>{closeModal();restart();}},
  ]});
}
function recordWin(){
  const t=game.elapsed, k=dateKey(), day=data.days[k]||(data.days[k]={levels:0,stars:0}), n=game.n;
  day.levels++;
  const crownOk=game.moves<=game.target;
  if(game.mode==='normal'){const r=data.normal;r.best[n]=Math.max(r.best[n]||0,game.stars);if(crownOk)r.crown[n]=1;r.time[n]=Math.min(r.time[n]||1e12,t);r.max=Math.min(MAXL+1,Math.max(r.max,n+1));day.stars+=game.stars;}
  else if(game.mode==='easy'){const r=data.easy;r.done[n]=1;r.best[n]=Math.max(r.best[n]||0,game.stars);if(crownOk)r.crown[n]=1;r.time[n]=Math.min(r.time[n]||1e12,t);r.max=Math.min(MAXL+1,Math.max(r.max,n+1));day.stars+=game.stars;}
  else {const p=data.daily[game.day];data.daily[game.day]={stars:Math.max(p?p.stars:0,game.stars),moves:Math.min(p?p.moves:1e9,game.moves),crown:!!(crownOk||(p&&p.crown)),time:Math.min(p?p.time:1e12,t)};day.stars+=game.stars;}
  save();
}
function showWin(){
  const ok=game.moves<=game.target;
  const facts='<div class="facts">'+
    '<div class="fact"><span class="k">Züge · Ziel '+game.target+'</span><span class="v">'+game.moves+' '+crown(ok)+'</span></div>'+
    '<div class="fact"><span class="k">Zeit</span><span class="v">'+fmtTime(game.elapsed)+'</span></div></div>'+
    '<p style="text-align:center">'+(ok?'Zielzüge erreicht – die Krone gehört dir.':'Für die Krone brauchst du höchstens '+game.target+' Züge.')+'</p>';
  const b=[];
  if(game.mode==='daily'){b.push({label:ICON('chart')+'Statistik ansehen',primary:true,onClick:showStats},{label:ICON('home')+'Zum Hauptmenü',onClick:showMain});}
  else {if(game.n<MAXL)b.push({label:ICON('next')+'Nächstes Level',primary:true,onClick:()=>play(game.mode,game.n+1)});else b.push({label:ICON('home')+'Zum Hauptmenü',primary:true,onClick:showMain});b.push({label:ICON('restart')+'Nochmal spielen',onClick:()=>{closeModal();restart();}},{label:ICON('grid')+'Zur Levelübersicht',onClick:()=>showLevels(game.mode)});}
  showModal({title:(game.mode==='daily'?'Tagesrätsel':levelLabel())+' geschafft',stars:game.stars,html:facts,buttons:b});
}

// ---------- Hilfen ----------
function useHelper(){game.uses++;if(game.uses%2===0)game.stars=Math.max(0,game.stars-1);hud();}
function doUndo(){
  if(!game.st)return;
  if(!game.undo.length){toast('Es gibt noch nichts zum Zurücknehmen.');return;}
  useHelper(); const u=game.undo.pop(); game.st=u.st; game.moves=u.moves; game.stuckShown=false; game.fx.pours=[];
}
function doShuffle(){
  const st=game.st; if(!st)return;
  if(totalPend(st)>0){toast('Warte kurz, bis die Farbe ausgeflossen ist.');return;}
  const gl=st.g.filter(g=>g.type==='normal'&&g.items.length);
  const cols=gl.flatMap(g=>g.items.map(i=>i.c));
  if(cols.length<2||new Set(cols).size<2){toast('Hier gibt es nichts zu mischen.');return;}
  game.undo.push({st:cloneState(st),moves:game.moves}); useHelper();
  for(let t=0;t<50;t++){
    const c=shuffle(cols.slice(),Math.random); let k=0;
    gl.forEach(g=>g.items.forEach(i=>{i.c=c[k++];i.t=now;}));
    if(!gl.some(g=>g.items.length===4&&g.items.every(i=>i.c===g.items[0].c)))break;
  }
}
function doGlass(){
  const st=game.st; if(!st)return;
  if(game.added>=2){toast('In diesem Level gibt es keine weiteren Extra-Gläser.');return;}
  if(totalPend(st)>0){toast('Warte kurz, bis die Farbe ausgeflossen ist.');return;}
  game.stars=Math.max(0,game.stars-1); game.added++; // Extra-Glas kostet sofort einen Stern
  const gi=st.g.length; st.g.push(mkGlass('normal',[]));
  const sp=game.spec;
  if(sp.kind==='pockets'){
    let best=null;
    for(let k=1;k<sp.rows.length;k++)for(const side of ['left','right']){const a=sp.rows[k][side];if(a.length<3&&(!best||a.length<best.length))best=a;}
    if(best) best.push(gi); else sp.rows.push({left:[gi],right:[]});
  } else {
    const lr=sp.rows[sp.rows.length-1];
    if(sp.rows.length>1&&lr.length<5) lr.push(gi); else sp.rows.push([gi]);
  }
  relayout(); game.undo=[]; hud();
}
$('tUndo').onclick=doUndo; $('tShuffle').onclick=doShuffle; $('tGlass').onclick=doGlass;
$('tSpeed').onclick=()=>{const on=game.tickMs>80;game.tickMs=on?52:105;$('tSpeed').setAttribute('aria-pressed',String(on));};

// ---------- Eingabe ----------
const glassH=g=>g.cap===3?(LG.GH-10)/4*3+10:LG.GH;
cv.addEventListener('pointerdown',e=>{
  if(game.modal||!game.lay||game.won)return;
  const r=cv.getBoundingClientRect(), lx=(e.clientX-r.left-view.ox)/view.s, ly=(e.clientY-r.top-view.oy)/view.s;
  const st=game.st, P=game.lay.pos;
  // Ventile zuerst
  for(let i=0;i<P.length;i++){const p=P[i],g=st.g[i];if(!p||!g.valve||g.type==='done')continue;
    const vy=(p.laneY+p.top)/2+3; if(Math.abs(lx-p.cx)<=20&&Math.abs(ly-vy)<=16){g.closed=!g.closed;game.stuckShown=false;return;}}
  let gi=-1;
  for(let i=0;i<P.length;i++){const p=P[i];if(!p)continue;if(Math.abs(lx-p.cx)<=LG.GW/2+14&&ly>=p.top-(st.g[i].valve?6:22)&&ly<=p.top+glassH(st.g[i])+18){gi=i;break;}}
  if(gi<0)return;
  const gl=st.g[gi];
  if(gl.type==='metal'){toast('Gläser mit Metallsockel nehmen nur Farbe auf.');game.fx.shake[gi]=now;return;}
  if(gl.type==='locked'){toast('Gesperrt. Es wird frei, sobald ein Glas fertig ist.');game.fx.shake[gi]=now;return;}
  if(gl.type==='done')return;
  if(!gl.items.length||gl.pend>0){game.fx.shake[gi]=now;return;}
  const snap=cloneState(st), r2=tapGlass(st,game.cfg,gi);
  if(r2===-1){toast('Der Kreislauf ist voll ('+game.cfg.limit+' von '+game.cfg.limit+').');game.fx.shake[gi]=now;bumpCount();return;}
  if(r2>0){game.undo.push({st:snap,moves:game.moves});if(game.undo.length>60)game.undo.shift();game.moves++;}
});

// ---------- Zeichnen ----------
function resize(){
  const r=board.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr));
  view.dpr=dpr; view.w=r.width; view.h=r.height; fit();
}
function fit(){
  if(!game.lay)return; const L=game.lay;
  const s=Math.min(view.w/L.W,view.h/L.H,1.7); view.s=s;
  view.ox=(view.w-L.W*s)/2; view.oy=Math.max(0,(view.h-L.H*s)/2);
}
new ResizeObserver(resize).observe(board);

function rr(x,y,w,h,r){const [a,b,c,d]=Array.isArray(r)?r:[r,r,r,r];ctx.beginPath();ctx.moveTo(x+a,y);ctx.lineTo(x+w-b,y);ctx.quadraticCurveTo(x+w,y,x+w,y+b);ctx.lineTo(x+w,y+h-c);ctx.quadraticCurveTo(x+w,y+h,x+w-c,y+h);ctx.lineTo(x+d,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-d);ctx.lineTo(x,y+a);ctx.quadraticCurveTo(x,y,x+a,y);ctx.closePath();}
function segPoint(sg,d){const t=d/sg.len;return [sg.a[0]+(sg.b[0]-sg.a[0])*t,sg.a[1]+(sg.b[1]-sg.a[1])*t];}
function rangePath(L,a,b){
  ctx.beginPath(); let started=false;
  for(const sg of L.segs){const s0=sg.s,s1=sg.s+sg.len;if(s1<=a||s0>=b)continue;
    const p0=segPoint(sg,Math.max(a,s0)-s0),p1=segPoint(sg,Math.min(b,s1)-s0);
    if(!started){ctx.moveTo(p0[0],p0[1]);started=true;} ctx.lineTo(p1[0],p1[1]);}
  if(started)ctx.stroke();
}
function strokeRange(L,s,len){if(len<=0)return;const P=L.P;const a=((s%P)+P)%P;if(a+len<=P)rangePath(L,a,a+len);else{rangePath(L,a,P);rangePath(L,0,a+len-P);}}
function pointAt(L,s){const P=L.P;s=((s%P)+P)%P;for(const sg of L.segs){if(s<=sg.s+sg.len){const p=segPoint(sg,s-sg.s);return {x:p[0],y:p[1],dx:(sg.b[0]-sg.a[0])/sg.len,dy:(sg.b[1]-sg.a[1])/sg.len};}}return {x:0,y:0,dx:1,dy:0};}

function draw(frac,dt){
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  if(!game.lay||!game.st)return;
  const {dpr,s,ox,oy}=view, L=game.lay, st=game.st, N=L.N, cl=L.cl;
  ctx.setTransform(dpr*s,0,0,dpr*s,ox*dpr,oy*dpr);
  // sanfter Lichtschein hinter dem Spielfeld
  const glow=ctx.createRadialGradient(L.W/2,L.H*.42,20,L.W/2,L.H*.42,Math.max(L.W,L.H)*.65);
  glow.addColorStop(0,'rgba(255,198,41,.07)');glow.addColorStop(1,'rgba(255,198,41,0)');
  ctx.fillStyle=glow;ctx.fillRect(-40,-40,L.W+80,L.H+80);
  ctx.lineJoin='round';
  // Kanal
  ctx.beginPath(); L.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
  ctx.lineCap='round'; ctx.strokeStyle=PAL.edge; ctx.lineWidth=LG.TW+8; ctx.stroke();
  ctx.strokeStyle=PAL.bed; ctx.lineWidth=LG.TW+1; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.035)'; ctx.lineWidth=3; ctx.stroke();
  // Richtungspfeile wandern langsam in Fließrichtung; an Ecken blenden sie aus
  const CHS=92, drift=RM?0:(now*.016)%CHS;
  for(let sp=drift;sp<L.P;sp+=CHS){
    const sg=L.segs.find(q=>sp<=q.s+q.len); if(!sg)continue;
    const d=sp-sg.s, edge=Math.min(d,sg.len-d); if(edge<14)continue;
    const p=pointAt(L,sp); ctx.globalAlpha=Math.min(1,(edge-14)/22); ctx.fillStyle=PAL.chev;
    ctx.beginPath();ctx.moveTo(p.x+p.dx*4.5,p.y+p.dy*4.5);ctx.lineTo(p.x-p.dx*3-p.dy*4.5,p.y-p.dy*3+p.dx*4.5);ctx.lineTo(p.x-p.dx*3+p.dy*4.5,p.y-p.dy*3-p.dx*4.5);ctx.closePath();ctx.fill();
  }
  ctx.globalAlpha=1;
  // Zuleitungen und Ventile
  L.pos.forEach((p,i)=>{if(!p)return;const g=st.g[i];
    ctx.fillStyle=PAL.nozzle;rr(p.cx-5,p.laneY+LG.TW/2+2,10,p.top-p.laneY-LG.TW/2-6,2);ctx.fill();
    if(g.type==='metal'||g.type==='normal'){ctx.fillStyle=g.pend>0?PAL.accent:'#4A4F58';rr(p.cx-8,p.top-8,16,5,2);ctx.fill();}
    if(g.valve&&g.type!=='done'){const vy=(p.laneY+p.top)/2+3;
      ctx.beginPath();ctx.arc(p.cx,vy,9,0,7);ctx.fillStyle=g.closed?PAL.warn:PAL.accent;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=PAL.ink;ctx.stroke();
      ctx.strokeStyle=PAL.ink;ctx.lineWidth=2.6;ctx.lineCap='round';ctx.beginPath();
      if(g.closed){ctx.moveTo(p.cx-4.5,vy);ctx.lineTo(p.cx+4.5,vy);}else{ctx.moveTo(p.cx,vy-4.5);ctx.lineTo(p.cx,vy+4.5);}ctx.stroke();}
  });
  // Flüssigkeit im Kreislauf
  const runs=[]; let cur=null;
  for(let p=0;p<N;p++){const u=st.slots[slotAt(st,N,p)];
    if(u&&cur&&cur.c===u.c&&cur.end===p-1)cur.end=p; else if(u){cur={c:u.c,start:p,end:p};runs.push(cur);} else cur=null;}
  if(runs.length>1){const f=runs[0],l=runs[runs.length-1];if(f.start===0&&l.end===N-1&&f.c===l.c){l.end=N+f.end;runs.shift();}}
  ctx.lineCap='round';
  // Flüssigkeitsstrang: runder, etwas vollerer Kopf vorn, schmal auslaufendes Ende hinten,
  // darin ein leise mitlaufender Glanz – wirkt fließend, bleibt aber flächig.
  const lw=LG.TW-3;
  for(const r of runs){
    const a=(r.start+frac)*cl+3, b=(r.end+1+frac)*cl-3, col=COLORS[r.c];
    ctx.strokeStyle=col;
    ctx.lineCap='round'; ctx.lineWidth=lw*.45; strokeRange(L,a+3,5);
    ctx.lineWidth=lw*.72; strokeRange(L,a+6,6);
    ctx.lineCap='butt'; ctx.lineWidth=lw; strokeRange(L,a+11,b-lw/2-(a+11));
    const hp=pointAt(L,b-lw/2); ctx.fillStyle=col; ctx.beginPath(); ctx.arc(hp.x,hp.y,lw/2+1.6,0,7); ctx.fill();
    if(b-a>30){
      ctx.lineCap='round'; ctx.setLineDash([9,13]); ctx.lineDashOffset=RM?0:-((now*.035)%22);
      ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=2.2; strokeRange(L,a+12,b-a-22);
      ctx.setLineDash([]); ctx.lineDashOffset=0;
    }
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(hp.x-hp.dy*1.8+hp.dx*1.5,hp.y+hp.dx*1.8+hp.dy*1.5,1.6,0,7); ctx.fill();
    if(data.symbols) for(let i=r.start;i<=r.end;i++){const q=pointAt(L,(i+.5+frac)*cl);drawSym(r.c,q.x,q.y,4.6);}
  }
  // Einfüllstrahlen
  const unitH=(LG.GH-10)/4;
  game.fx.pours=game.fx.pours.filter(f=>now-f.t<240);
  for(const f of game.fx.pours){const p=L.pos[f.g],g=st.g[f.g];if(!p||!g)continue;const k=1-(now-f.t)/240;
    ctx.strokeStyle=COLORS[f.c];ctx.lineWidth=6*k+1;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.cx,p.laneY+LG.TW/2);ctx.lineTo(p.cx,p.top+glassH(g)-5-(g.items.length-1)*unitH);ctx.stroke();}
  st.g.forEach((g,i)=>{if(g.pend>0&&g.items.length){const p=L.pos[i];ctx.strokeStyle=COLORS[topItem(g).c];ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.cx,p.top+glassH(g)-5-g.items.length*unitH+3);ctx.lineTo(p.cx,p.laneY+LG.TW/2);ctx.stroke();}});
  // Gläser
  st.g.forEach((g,i)=>drawGlass(g,i,L.pos[i]));
  // Partikel
  if(game.fx.parts.length){
    game.fx.parts=game.fx.parts.filter(q=>now-q.t<q.life);
    for(const q of game.fx.parts){const k=dt/16;q.x+=q.vx*k;q.y+=q.vy*k;q.vy+=.08*k;q.vx*=.99;
      ctx.globalAlpha=Math.max(0,1-(now-q.t)/q.life);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill();}
    ctx.globalAlpha=1;
  }
}

function drawGlass(g,i,p){
  if(!p)return;
  const w=LG.GW,h=glassH(g),unitH=(LG.GH-10)/4; let x=p.cx; const y=p.top;
  const sh=game.fx.shake[i]; if(sh&&now-sh<320){const k=(now-sh)/320;x+=Math.sin(k*Math.PI*6)*4*(1-k);}
  const R=[5,5,w*.42,w*.42];
  if(g.type==='locked'){
    rr(x-w/2,y,w,h,R);ctx.fillStyle=PAL.lockBody;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=PAL.lockLine;ctx.stroke();
    const t=topItem(g);rr(x-13,y+h*.5-8,26,26,6);
    if(t){ctx.fillStyle=COLORS[t.c];ctx.fill();if(data.symbols)drawSym(t.c,x,y+h*.5+5,7);}
    else{ctx.setLineDash([3,3]);ctx.strokeStyle='#7D838D';ctx.lineWidth=1.5;ctx.stroke();ctx.setLineDash([]);}
    rr(x-w/2-4,y-8,w+8,22,6);ctx.fillStyle=PAL.accent;ctx.fill();
    ctx.strokeStyle=PAL.ink;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y+1,3.6,Math.PI,0);ctx.stroke();
    ctx.fillStyle=PAL.ink;rr(x-5.5,y+1,11,8,2);ctx.fill();
    return;
  }
  // Glaskörper
  rr(x-w/2,y,w,h,R);ctx.fillStyle=PAL.glassFill;ctx.fill();
  ctx.save();rr(x-w/2+4,y+4,w-8,h-8,[2,2,w*.42-4,w*.42-4]);ctx.clip();
  g.items.forEach((it,k)=>{
    const a=it.t?Math.min(1,(now-it.t)/200):1, yb=y+h-5-k*unitH, hh=unitH*a;
    ctx.fillStyle=it.h?PAL.hidden:COLORS[it.c]; ctx.fillRect(x-w/2,yb-hh-(k===g.items.length-1?0:.6),w,hh+.6);
    if(it.h){ctx.fillStyle=PAL.q;ctx.font='600 19px Fredoka, system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('?',x,yb-unitH/2+1);}
  });
  const n=g.items.length;
  if(n){
    const tt=topItem(g), ta=tt.t?Math.min(1,(now-tt.t)/200):1, topY=y+h-5-(n-1)*unitH-unitH*ta;
    // Rundung der Flüssigkeit: links Licht, rechts Schatten
    const gr=ctx.createLinearGradient(x-w/2,0,x+w/2,0);
    gr.addColorStop(0,'rgba(255,255,255,.10)');gr.addColorStop(.3,'rgba(255,255,255,.16)');gr.addColorStop(.55,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(0,0,0,.22)');
    ctx.fillStyle=gr;ctx.fillRect(x-w/2,topY,w,n*unitH+5);
    if(!tt.h){ // Oberfläche: schwappt nach dem Einfüllen kurz nach
      const age=tt.t?now-tt.t:1e9, A=(!RM&&age<700)?3.2*(1-age/700):0;
      ctx.strokeStyle='rgba(255,255,255,.38)';ctx.lineWidth=2.5;ctx.beginPath();
      for(let k=0;k<=14;k++){const xx=x-w/2+w*k/14, yy=topY+1.3+A*Math.sin(k/14*Math.PI*2+age/70);k?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}
      ctx.stroke();
    }
    if(data.symbols) g.items.forEach((it,k)=>{if(!it.h)drawSym(it.c,x,y+h-5-k*unitH-unitH/2,7.5);});
  }
  ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(x-w/2+8,y+10,3.5,h-34);
  ctx.restore();
  // Umriss
  const edge=g.pend>0?PAL.accent:g.only!==null?COLORS[g.only]:PAL.glass;
  rr(x-w/2,y,w,h,R);ctx.lineWidth=g.pend>0||g.only!==null?3.5:2.5;ctx.strokeStyle=edge;ctx.stroke();
  rr(x-w/2-3,y-3,w+6,6,3);ctx.fillStyle=edge;ctx.fill();
  if(g.only!==null){ // Filterplakette
    ctx.beginPath();ctx.arc(x+w/2-2,y+12,8.5,0,7);ctx.fillStyle=COLORS[g.only];ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=PAL.ink;ctx.stroke();
    if(data.symbols)drawSym(g.only,x+w/2-2,y+12,5);
  }
  if(g.closed){ctx.save();rr(x-w/2,y,w,h,R);ctx.fillStyle='rgba(31,33,37,.35)';ctx.fill();ctx.restore();}
  if(g.type==='metal'){
    const gm=ctx.createLinearGradient(x-w/2,0,x+w/2,0);gm.addColorStop(0,'#8D949E');gm.addColorStop(.35,'#E2E6EC');gm.addColorStop(1,'#737A84');
    rr(x-w/2-5,y+h-14,w+10,22,[6,6,9,9]);ctx.fillStyle=gm;ctx.fill();
    ctx.fillStyle='rgba(31,33,37,.45)';[-12,0,12].forEach(d=>{ctx.beginPath();ctx.arc(x+d,y+h-3,1.8,0,7);ctx.fill();});
  }
  if(g.type==='done'){
    const t0=game.fx.done[i]||0, k=t0?Math.min(1,(now-t0)/260):1, ly=y-8-(1-k)*26;
    rr(x-w/2-4,ly,w+8,16,5);ctx.fillStyle=PAL.accent;ctx.fill();
    ctx.strokeStyle=PAL.ink;ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x-5,ly+8);ctx.lineTo(x-1,ly+11.5);ctx.lineTo(x+6,ly+4.5);ctx.stroke();
  }
}

// ---------- Hauptschleife ----------
function frame(t){
  const dt=Math.min(120,t-last); last=t; now=t; ev.now=t;
  const st=game.st;
  if(game.screen==='play'&&st&&game.lay&&!game.modal){
    acc+=dt;
    while(acc>=game.tickMs){acc-=game.tickMs;step(st,game.cfg,ev);}
    if(!game.won){game.elapsed+=dt;data.playMs+=dt;}
    if(!game.won&&st.done>=game.cfg.C){game.won=true;game.winAt=t;recordWin();
      const L=game.lay,cols=[...new Set(st.g.flatMap(g=>g.items.map(i=>COLORS[i.c])))];for(let k=0;k<6;k++)spawn(L.W*(k+.5)/6,L.H*.2,cols,12,3.2,2.5);}
    if(game.won&&game.winAt&&t-game.winAt>1000){game.winAt=0;showWin();}
    if(!game.won&&!game.stuckShown&&isStuck(st,game.cfg))showStuck();
  }
  if(game.screen==='play'){updateCount();draw(game.modal?0:Math.min(1,acc/game.tickMs),dt);}
  requestAnimationFrame(frame);
}
showMain();
requestAnimationFrame(t=>{last=t;frame(t);});
</script>

<script>
// Offline: App beim ersten Start auf dem Gerät speichern
if("serviceWorker" in navigator){
  // Neue Version automatisch laden: beim Öffnen und beim Zurückkehren in die App nach Updates schauen
  const had=!!navigator.serviceWorker.controller; let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(had&&!reloaded){ reloaded=true; location.reload(); } });
  window.addEventListener("load",()=>navigator.serviceWorker.register("../sw.js",{updateViaCache:"none"}).then(reg=>{
    reg.update().catch(()=>{});
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") reg.update().catch(()=>{}); });
  }).catch(()=>{}));
}
</script>
