<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>mCalc</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="mCalc">
<meta name="theme-color" content="#262625">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--y:#FDD602;--d:#262625;--bg:#FFFBEA;--line:#E7E1C8;--sel:#2E7DF6;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--d);font-family:Nunito,system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--d);color:#fff}
.logo{width:40px;height:40px;border-radius:11px;background:var(--y);display:grid;place-items:center;flex:none}
.brand{font-weight:900;font-size:24px;letter-spacing:-.5px;margin-right:auto}
.brand b{color:var(--y)}
.hb{background:#3a3a38;border-radius:12px;padding:9px 13px;font-weight:800;font-size:16px;display:flex;gap:6px;align-items:center}
.hb.y{background:var(--y);color:var(--d)}
.hb:active{transform:scale(.95)}
.fbar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#fff;border-bottom:2px solid var(--line)}
.ref{background:var(--y);font-weight:900;font-size:20px;border-radius:10px;padding:6px 12px;min-width:64px;text-align:center}
#inp{flex:1;font:800 22px Nunito,sans-serif;border:2px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--d);background:#fffef7;min-width:0;user-select:text;-webkit-user-select:text}
#inp:focus{outline:none;border-color:var(--sel)}
.hint{padding:6px 14px;font-size:15px;font-weight:700;min-height:30px;color:#6b6655}
.hint.err{color:#c0392b}
main{flex:1;display:flex;gap:12px;padding:0 12px 12px;min-height:0}
.gridwrap{flex:1;overflow:auto;min-width:0;background:#fff;border-radius:16px;border:2px solid var(--line)}
table{border-collapse:collapse;touch-action:none;width:100%;table-layout:fixed}
th{background:#F6F0D6;font-weight:900;font-size:16px;color:#8a836a;height:34px;position:sticky;top:0;z-index:1}
th.rh,col.rh{width:42px}th.rh{position:sticky;left:0}
td{border:1.5px solid var(--line);height:52px;min-width:92px;font-weight:800;font-size:20px;padding:0 8px;white-space:nowrap;overflow:hidden;max-width:160px;text-overflow:ellipsis;position:relative}
td.num{text-align:right}
td.err{color:#c0392b;text-align:center}
td.fx::after{content:"";position:absolute;left:3px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--sel);opacity:.5}
td.in{background-image:linear-gradient(rgba(46,125,246,.13),rgba(46,125,246,.13))}
td.act{outline:3px solid var(--sel);outline-offset:-3px}
td.refd{outline:3px dashed #E67E22;outline-offset:-4px}
td.b{font-weight:900}
.thd.on{background:var(--y);color:var(--d)}
aside{width:336px;display:flex;flex-direction:column;gap:10px;flex:none;overflow:auto}
.card{background:#fff;border-radius:16px;border:2px solid var(--line);padding:10px}
.card h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:#8a836a}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.k{background:#F6F0D6;border-radius:12px;height:50px;font-weight:900;font-size:22px}
.k.op{background:#FFF2A8}
.k.ok{background:var(--y);grid-column:span 2}
.k.dark{background:var(--d);color:#fff;font-size:17px}
.k:active,.fn:active,.sw:active{transform:scale(.93)}
.fns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fn{background:#EAF2FF;border-radius:12px;padding:6px 4px;font-weight:900;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px;justify-content:center;line-height:1.1}
.fn span{font-size:20px}
/* Tastatur: Tabs ABC / 123 */
.kbtabs{display:flex;gap:6px;margin-bottom:8px}
.kbtabs button{flex:1;border-radius:10px;padding:7px;font-weight:900;font-size:16px;background:#F6F0D6;color:#8a836a}
.kbtabs button.on{background:var(--d);color:#fff}
.pad.abc{grid-template-columns:repeat(6,1fr);gap:6px}
.pad.abc .k{height:46px;font-size:22px}
.k.lt{background:#fff;border:2px solid var(--line)}
.k.vow{background:#FFF7CC;border-color:#F3DE7A}
.k.uml{background:#EAF2FF;border-color:#C9DDF7}
.k.s2{grid-column:span 2}
.case{display:flex;padding:3px;gap:3px;background:#F6F0D6}
.case b{flex:1;display:grid;place-items:center;border-radius:9px;font-size:20px;color:#8a836a}
.case b.on{background:var(--d);color:#fff}
.sws{display:flex;gap:6px;flex-wrap:nowrap;align-items:center;margin-top:10px}
.sw{width:32px;height:32px;flex:none;border-radius:50%;border:2.5px solid var(--line)}
.sw.bold{border-radius:10px;background:#fff;font-weight:900;font-size:17px;width:38px}
.sw.bold.on{background:var(--d);color:#fff}
.modal{position:fixed;inset:0;background:rgba(38,38,37,.55);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal.on{display:flex}
.box{background:#fff;border-radius:22px;padding:20px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
.box h2{margin:0 0 14px;font-size:24px}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tpl{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:16px;text-align:left;font-weight:800;font-size:18px}
.tpl i{font-style:normal;font-size:34px;display:block;margin-bottom:4px}
.tpl small{display:block;font-size:14px;color:#8a836a;font-weight:700}
.close{margin-top:14px;background:var(--d);color:#fff;border-radius:12px;padding:10px 18px;font-weight:800}
.proj{display:flex;flex-direction:column;align-items:flex-start;background:#3a3a38;border-radius:12px;padding:5px 12px;max-width:220px;text-align:left}
.proj b{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:196px}
.proj small{font-size:11px;font-weight:700;color:#cfc8ad}.proj small.dirty{color:var(--y)}
.newp{display:flex;gap:8px;margin-bottom:14px}
.newp input{flex:1;font:800 18px Nunito,sans-serif;border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;user-select:text;-webkit-user-select:text}
.newp button,.pl button{background:var(--y);border-radius:12px;padding:10px 14px;font-weight:900}
.pl{display:flex;flex-direction:column;gap:8px}
.pl div{display:flex;align-items:center;gap:8px;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px}
.pl div.cur{border-color:var(--d)}
.pl span{flex:1;font-weight:800;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl span small{display:block;font-size:12px;color:#8a836a}
.pl button.del{background:#fff;border:2px solid var(--line)}.pl button.del.sure{background:#c0392b;color:#fff;border-color:#c0392b}
/* Strichliste */
td.tal{text-align:left}
.tally{display:inline-flex;align-items:center;gap:7px;vertical-align:middle;flex-wrap:nowrap}
.tg{display:inline-block;position:relative;height:26px;background:repeating-linear-gradient(90deg,var(--d) 0 3px,transparent 3px 7px)}
.tg.f{width:25px}
.tg.f::after{content:"";position:absolute;left:-4px;right:-4px;top:11px;height:3px;border-radius:2px;background:#d35400;transform:rotate(-28deg)}
.tally small{font-size:12px;color:#8a836a;font-weight:900;margin-left:2px}
.fn.tl{background:#FFF2A8}
.fn.tl.big{grid-column:span 2;flex-direction:row;font-size:15px;gap:6px}
@keyframes pop{50%{transform:scale(1.12)}}
td.pop .tally{animation:pop .25s}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--d);color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;opacity:0;transition:.3s;pointer-events:none;z-index:10}
.toast.on{opacity:1}
@media (orientation:portrait),(max-width:820px),(max-height:600px){
  body{height:auto;min-height:100dvh}
  main{flex-direction:column;flex:none}
  .gridwrap{flex:none;overflow-x:auto}
  aside{width:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}
  aside .card{flex:1 1 280px}
  .k{height:44px}
  td{height:46px;min-width:70px;font-size:18px}
  .hb .t{display:none}
}
@media (max-width:520px){
  header{padding:8px 10px;gap:6px}
  .brand{font-size:20px}.logo{width:34px;height:34px}
  .brand,.logo{display:none}.proj{margin-right:auto}
  .hb{padding:7px 8px;font-size:15px}
  .proj{max-width:110px;padding:4px 8px}.proj b{font-size:13px;max-width:104px}.proj small{font-size:10px}
  .hb{padding:8px 10px}
  .fbar{padding:6px 8px}.ref{font-size:16px;min-width:48px;padding:6px 8px}#inp{font-size:18px;padding:6px 10px}
  .hint{font-size:13px;padding:4px 10px}
  main{padding:0 8px 8px;gap:8px}
  th{font-size:13px;height:28px}th.rh,col.rh{width:28px}
  td{height:40px;min-width:0;font-size:15px;padding:0 5px}
  .k{height:42px;font-size:19px}
}
</style>
</head>
<body>
<header>
  <a class="hb" href="../" aria-label="Zurück zu mLogic" style="text-decoration:none;padding:9px 10px">‹</a>
  <div class="logo"><svg width="26" height="26" viewBox="0 0 26 26"><g fill="#262625"><rect x="2" y="2" width="10" height="10" rx="2.5"/><rect x="14" y="2" width="10" height="10" rx="2.5" opacity=".45"/><rect x="2" y="14" width="10" height="10" rx="2.5" opacity=".45"/><rect x="14" y="14" width="10" height="10" rx="2.5"/></g></svg></div>
  <div class="brand">m<b>Calc</b></div>
  <button class="proj" id="bProj" title="Projekte"><b id="pName">–</b><small id="pState">gespeichert</small></button>
  <button class="hb y" id="bSave" title="Speichern">💾<span class="t">Speichern</span></button>
  <button class="hb" id="bUndo" title="Rückgängig">↶<span class="t">Zurück</span></button>
  <button class="hb" id="bTpl">📋<span class="t">Vorlagen</span></button>
  <button class="hb" id="bChart">📊<span class="t">Diagramm</span></button>
  <button class="hb y" id="bExp">⬇<span class="t">Excel</span></button>
</header>
<div class="fbar"><div class="ref" id="ref">A1</div><input id="inp" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Tippe etwas …"></div>
<div class="hint" id="hint">Tippe auf ein Kästchen und schreib eine Zahl oder ein Wort hinein.</div>
<main>
  <div class="gridwrap"><table id="grid"></table></div>
  <aside>
    <div class="card"><div class="kbtabs"><button data-kb="abc">ABC</button><button data-kb="123">123</button></div><div class="pad" id="pad"></div></div>
    <div class="card"><h3>Rechnen</h3><div class="fns">
      <button class="fn" data-fn="SUMME"><span>Σ</span>Summe</button>
      <button class="fn" data-fn="MITTELWERT"><span>⌀</span>Mittelwert</button>
      <button class="fn" data-fn="MAX"><span>⬆</span>Größte</button>
      <button class="fn" data-fn="MIN"><span>⬇</span>Kleinste</button>
      <button class="fn tl big" id="tPlus"><span>𝍸</span>Strich dazu</button>
      <button class="fn tl" id="tMinus"><span>⌫</span>Strich weg</button>
      <button class="fn tl" id="tSwap"><span>🔢</span>Striche ↔ Zahl</button>
    </div><div class="sws" id="sws" title="Farbe &amp; Fett"></div></div>
  </aside>
</main>
<div class="modal" id="mProj"><div class="box"><h2>📁 Meine Projekte</h2>
<div class="newp"><input id="newName" placeholder="Name für neues Projekt" maxlength="40" autocomplete="off"><button id="bNew">＋ Neu</button></div>
<div class="pl" id="plist"></div><button class="close" data-close>Schließen</button></div></div>
<div class="modal" id="mTpl"><div class="box"><h2>Womit willst du anfangen?</h2><div class="tpls" id="tpls"></div><button class="close" data-close>Schließen</button></div></div>
<div class="modal" id="mChart"><div class="box"><h2 id="chTitle">Diagramm</h2><div id="chart"></div><button class="close" data-close>Schließen</button></div></div>
<div class="toast" id="toast"></div>
<script>
const COLS=6, ROWS=10, L='ABCDEF';
const FILLS=['','#FDD602','#FFB8B8','#B8DCFF','#BDF0C4','#E3CCFF'];
const BARCOL=['#FDD602','#FF9F9F','#7FC3FF','#8FE0A0','#C9A6FF','#FFC27A'];
let cells={}, undo=[];
let act={r:0,c:0}, anchor={r:0,c:0}, sel={r1:0,c1:0,r2:0,c2:0};
let editing=false, dragging=false, refIns=null;
const $=id=>document.getElementById(id);
const inp=$('inp');
const key=(r,c)=>L[c]+(r+1);
const cell=k=>cells[k]||(cells[k]={v:'',f:0,b:false});

/* ---------- Speicher ---------- */
/* Projekte: Speichern per Knopf + automatisch alle 10 Minuten */
const AUTOSAVE_MS=10*60*1000;
let store={list:{},cur:null},dirty=false,lastSaved=null;
function readStore(){try{const s=JSON.parse(localStorage.getItem('mcalc-projekte')||'null');if(s&&s.list)store=s}catch(e){}
  if(!Object.keys(store.list).length){let old={};try{old=JSON.parse(localStorage.getItem('mcalc')||'{}')}catch(e){}
    const id=newProject('Meine Tabelle',old);store.cur=id;writeStore()}}
function writeStore(){try{localStorage.setItem('mcalc-projekte',JSON.stringify(store));return true}catch(e){return false}}
function newProject(name,c){const id='p'+Date.now().toString(36);store.list[id]={name,cells:c||{},t:Date.now()};return id}
const hm=t=>new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
function save(){dirty=true;showProj()} // jede Änderung: als „nicht gespeichert“ markieren
function persist(auto){
  const p=store.list[store.cur];if(!p)return;commit();
  p.cells=JSON.parse(JSON.stringify(cells));p.t=Date.now();
  if(writeStore()){dirty=false;lastSaved=p.t;showProj();toast(auto?'💾 Automatisch gespeichert':'💾 Gespeichert!')}
  else toast('Speichern hat nicht geklappt.');
}
function showProj(){const p=store.list[store.cur];$('pName').textContent=p?p.name:'–';const st=$('pState');
  st.textContent=dirty?'● nicht gespeichert':'✓ gespeichert'+(lastSaved?' '+hm(lastSaved):'');st.classList.toggle('dirty',dirty)}
function openProject(id){
  if(dirty)persist(true);
  store.cur=id;writeStore();cells=JSON.parse(JSON.stringify(store.list[id].cells||{}));undo=[];dirty=false;lastSaved=store.list[id].t;
  select(0,0);showProj();
}
function listProjects(){
  const ids=Object.keys(store.list).sort((a,b)=>store.list[b].t-store.list[a].t);
  $('plist').innerHTML=ids.map(id=>{const p=store.list[id];return `<div class="${id===store.cur?'cur':''}"><span>${p.name.replace(/[<&]/g,'')}<small>${id===store.cur?'offen · ':''}zuletzt ${new Date(p.t).toLocaleDateString('de-DE')} ${hm(p.t)}</small></span>${id===store.cur?'':`<button data-open="${id}">Öffnen</button>`}<button class="del" data-del="${id}">🗑</button></div>`}).join('');
}
function load(){readStore();cells=JSON.parse(JSON.stringify(store.list[store.cur].cells||{}));lastSaved=store.list[store.cur].t}
function snap(){undo.push(JSON.stringify(cells));if(undo.length>60)undo.shift()}

/* ---------- Formeln ---------- */
const FN={SUMME:'SUM',SUM:'SUM',MITTELWERT:'AVERAGE',AVERAGE:'AVERAGE',MIN:'MIN',MAX:'MAX',ANZAHL:'COUNT',COUNT:'COUNT'};
function tokenize(s){
  const t=[];let i=0;
  while(i<s.length){
    const ch=s[i];
    if(/\s/.test(ch)){i++;continue}
    let m;
    if(m=/^\d+(?:[.,]\d+)?/.exec(s.slice(i))){t.push({t:'n',v:parseFloat(m[0].replace(',','.')),s:m[0]});i+=m[0].length;continue}
    if(m=/^[A-Za-zÄÖÜäöü]+(?=\s*\()/.exec(s.slice(i))){t.push({t:'f',v:m[0].toUpperCase()});i+=m[0].length;continue}
    if(m=/^([A-Za-z])(\d+)/.exec(s.slice(i))){t.push({t:'r',v:m[1].toUpperCase()+m[2]});i+=m[0].length;continue}
    if('+-−'.includes(ch)){t.push({t:'o',v:ch==='+'?'+':'-'});i++;continue}
    if('*×xX·'.includes(ch)){t.push({t:'o',v:'*'});i++;continue}
    if('/÷:'.includes(ch)&&!(ch===':'&&t.length&&t[t.length-1].t==='r')){t.push({t:'o',v:'/'});i++;continue}
    if(ch===':'){t.push({t:':'});i++;continue}
    if(ch==='('||ch===')'){t.push({t:ch});i++;continue}
    if(ch===';'||ch===','){t.push({t:';'});i++;continue}
    throw 'Das Zeichen „'+ch+'“ kenne ich nicht.';
  }
  return t;
}
function parse(tokens){
  let p=0;const peek=()=>tokens[p],next=()=>tokens[p++];
  function expr(){let n=term();while(peek()&&peek().t==='o'&&(peek().v==='+'||peek().v==='-')){const o=next().v;n={op:o,a:n,b:term()}}return n}
  function term(){let n=unary();while(peek()&&peek().t==='o'&&(peek().v==='*'||peek().v==='/')){const o=next().v;n={op:o,a:n,b:unary()}}return n}
  function unary(){if(peek()&&peek().t==='o'&&peek().v==='-'){next();return{op:'neg',a:unary()}}if(peek()&&peek().t==='o'&&peek().v==='+'){next();return unary()}return prim()}
  function prim(){
    const t=next();if(!t)throw 'Die Formel ist noch nicht fertig.';
    if(t.t==='n')return{num:t.v};
    if(t.t==='r'){if(peek()&&peek().t===':'){next();const e=next();if(!e||e.t!=='r')throw 'Nach „:“ fehlt ein Kästchen.';return{range:[t.v,e.v]}}return{ref:t.v}}
    if(t.t==='f'){
      if(!FN[t.v])throw 'Die Rechnung „'+t.v+'“ kenne ich nicht.';
      next();const args=[];
      if(peek()&&peek().t!==')'){args.push(expr());while(peek()&&peek().t===';'){next();args.push(expr())}}
      if(!peek()||peek().t!==')')throw 'Es fehlt eine Klammer „)“.';next();
      return{fn:FN[t.v],args};
    }
    if(t.t==='('){const n=expr();if(!peek()||peek().t!==')')throw 'Es fehlt eine Klammer „)“.';next();return n}
    throw 'Da passt etwas nicht zusammen.';
  }
  const n=expr();if(p<tokens.length)throw 'Da passt etwas nicht zusammen.';return n;
}
function rc(ref){const c=L.indexOf(ref[0]),r=parseInt(ref.slice(1))-1;if(c<0||r<0||r>=ROWS)throw 'Das Kästchen '+ref+' gibt es nicht.';return{r,c}}
function rangeKeys(a,b){const A=rc(a),B=rc(b),o=[];for(let r=Math.min(A.r,B.r);r<=Math.max(A.r,B.r);r++)for(let c=Math.min(A.c,B.c);c<=Math.max(A.c,B.c);c++)o.push(key(r,c));return o}
let cache={},stack=new Set();
function val(k){
  if(k in cache)return cache[k];
  if(stack.has(k))throw 'Die Formel zeigt auf sich selbst – das geht im Kreis.';
  stack.add(k);let v;
  try{v=computeRaw((cells[k]||{}).v||'')}catch(e){v={err:typeof e==='string'?e:'Fehler'}}
  stack.delete(k);cache[k]=v;return v;
}
function computeRaw(raw){
  raw=String(raw).trim();
  if(raw==='')return null;
  if(raw[0]==='='){const s=raw.slice(1);if(!s.trim())throw 'Die Formel ist noch leer.';return ev(parse(tokenize(s)))}
  if(/^-?\d+(?:[.,]\d+)?$/.test(raw))return parseFloat(raw.replace(',','.'));
  return raw;
}
function num(v,k){
  if(v&&v.err)throw v.err;
  if(v===null)return 0;
  if(typeof v==='number')return v;
  throw (k?'In '+k+' steht ein Wort – mit Wörtern kann man nicht rechnen.':'Mit Wörtern kann man nicht rechnen.');
}
function ev(n){
  if('num' in n)return n.num;
  if(n.ref){rc(n.ref);return num(val(n.ref),n.ref)}
  if(n.range)throw 'Ein Bereich wie '+n.range.join(':')+' braucht eine Rechnung, z. B. SUMME.';
  if(n.op==='neg')return -ev(n.a);
  if(n.op){const a=ev(n.a),b=ev(n.b);
    if(n.op==='+')return a+b;if(n.op==='-')return a-b;if(n.op==='*')return a*b;
    if(b===0)throw 'Durch 0 teilen geht nicht.';return a/b}
  if(n.fn){
    const xs=[];
    for(const a of n.args){
      if(a.range){for(const k of rangeKeys(a.range[0],a.range[1])){const v=val(k);if(v&&v.err)throw v.err;if(typeof v==='number')xs.push(v)}}
      else if(a.ref){rc(a.ref);const v=val(a.ref);if(v&&v.err)throw v.err;if(typeof v==='number')xs.push(v)}
      else xs.push(ev(a));
    }
    if(n.fn==='SUM')return xs.reduce((s,x)=>s+x,0);
    if(n.fn==='COUNT')return xs.length;
    if(!xs.length)return 0;
    if(n.fn==='AVERAGE')return xs.reduce((s,x)=>s+x,0)/xs.length;
    if(n.fn==='MIN')return Math.min(...xs);
    if(n.fn==='MAX')return Math.max(...xs);
  }
  throw 'Fehler';
}

function chartData(){

  if(r1===r2&&c1===c2){ // eine Zelle: zusammenhängende Spalte nehmen
    let a=r1,z=r1;while(a>0&&cache[key(a-1,c1)]!==null)a--;while(z<ROWS-1&&cache[key(z+1,c1)]!==null)z++;r1=a;r2=z;
    c2=c1;
  }
  const agg=k=>/^=\s*(SUMME|SUM|MITTELWERT|AVERAGE|MIN|MAX|ANZAHL|COUNT)\(/i.test((cells[k]||{}).v||'');
  const items=[];let vc=c2;
  if(c2>c1){ // mehrere Spalten: links Namen, rechts Zahlen
    for(let r=r1;r<=r2;r++){const v=cache[key(r,vc)],l=cache[key(r,c1)];if(typeof v==='number'&&!agg(key(r,vc)))items.push({l:l==null?String(r+1):(typeof l==='number'?fmt(l):l),v})}
  }else{
    for(let r=r1;r<=r2;r++){const v=cache[key(r,c1)];if(typeof v==='number'&&!agg(key(r,c1))){const l=c1>0?cache[key(r,c1-1)]:null;items.push({l:l==null?key(r,c1):(typeof l==='number'?fmt(l):l),v})}}
  }
  const head=r1>0?cache[key(r1-1,vc)]:cache[key(r1,vc)];
  return{items,title:typeof head==='string'?head:'Diagramm'};
}

function buildXlsx(){

  const st=d=>{const k=(d.f||0)+'|'+(d.b?1:0);if(!(k in xfMap)){xfMap[k]=xf.length;xf.push(`<xf numFmtId="0" fontId="${d.b?1:0}" fillId="${d.f?d.f+1:0}" borderId="0" xfId="0" applyFont="1" applyFill="1"/>`)}return xfMap[k]};

    for(let c=0;c<COLS;c++){const k=key(r,c),d=cells[k];if(!d||(!d.v&&!d.f&&!d.b))continue;
      const s=st(d),raw=String(d.v||'').trim(),v=cache[k];
      if(!raw){cs+=`<c r="${k}" s="${s}"/>`;continue}
      if(raw[0]==='='){let f;try{f=xlFormula(raw)}catch(e){f=null}
        if(f===null)cs+=`<c r="${k}" s="${s}" t="inlineStr"><is><t>${esc(raw)}</t></is></c>`;
        else if(typeof v==='number')cs+=`<c r="${k}" s="${s}"><f>${esc(f)}</f><v>${v}</v></c>`;
        else cs+=`<c r="${k}" s="${s}"><f>${esc(f)}</f></c>`;}
      else if(typeof v==='number')cs+=`<c r="${k}" s="${s}"><v>${v}</v></c>`;
      else cs+=`<c r="${k}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${esc(raw)}</t></is></c>`;
    }
    if(cs)rows+=`<row r="${r+1}">${cs}</row>`}
  const fills=FILLS.slice(1).map(f=>`<fill><patternFill patternType="solid"><fgColor rgb="FF${f.slice(1)}"/><bgColor indexed="64"/></patternFill></fill>`).join('');
  const files={
   '[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>',
   '_rels/.rels':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
   'xl/workbook.xml':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="mCalc" sheetId="1" r:id="rId1"/></sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>',
   'xl/_rels/workbook.xml.rels':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
   'xl/styles.xml':`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="12"/><name val="Calibri"/></font><font><b/><sz val="12"/><name val="Calibri"/></font></fonts><fills count="${2+FILLS.length-1}"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>${fills}</fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${xf.length}">${xf.join('')}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`,
   'xl/worksheets/sheet1.xml':`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="${COLS}" width="16" customWidth="1"/></cols><sheetData>${rows}</sheetData></worksheet>`
  };
  return zip(files);
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  for(const [name,txt] of Object.entries(files)){
    const nb=enc.encode(name),data=enc.encode(txt),crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nb.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nb,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),nb);
    off+=30+nb.length+data.length;
  }
  const cdSize=central.reduce((s,a)=>s+a.length,0),n=Object.keys(files).length;
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,n,true);e.setUint16(10,n,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  const all=[...parts,...central,new Uint8Array(e.buffer)],out=new Uint8Array(all.reduce((s,a)=>s+a.length,0));let p=0;for(const a of all){out.set(a,p);p+=a.length}
  return out;
}
let dl=null;
try{if(window.claude&&claude.use)claude.use('downloads').then(d=>{dl=d}).catch(()=>{})}catch(e){}
$('bExp').onclick=async()=>{
  commit();const data=buildXlsx();
  if(dl){try{await dl.save({filename:'mCalc.xlsx',data});toast('✅ Excel-Datei gespeichert');}catch(e){if(e&&e.code!=='declined')toast('Speichern klappt hier gerade nicht.')}return}
  try{const f=new File([data],'mCalc.xlsx',{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'mCalc'});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download='mCalc.xlsx';document.body.appendChild(a);a.click();a.remove();toast('✅ Excel-Datei erstellt')}catch(e){toast('Speichern klappt hier gerade nicht.')}
};

/* ---------- Sonstiges ---------- */
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('on'))}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeAll);
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeAll()}));
$('bTpl').onclick=()=>{commit();$('mTpl').classList.add('on')};
$('bUndo').onclick=()=>{if(!undo.length){toast('Nichts mehr zum Zurücknehmen.');return}cells=JSON.parse(undo.pop());editing=false;save();select(act.r,act.c)};
$('tPlus').onclick=()=>tally(1);
$('tMinus').onclick=()=>tally(-1);
$('tSwap').onclick=()=>{commit();snap();const on=!(cells[key(act.r,act.c)]||{}).t;
  for(let r=sel.r1;r<=sel.r2;r++)for(let c=sel.c1;c<=sel.c2;c++){const d=cells[key(r,c)];if(d&&/^\d+$/.test(String(d.v).trim()))d.t=on}
  save();render();toast(on?'✏️ Jetzt als Striche':'🔢 Jetzt als Zahl')};
load();showProj();
if(!Object.keys(cells).length)$('mTpl').classList.add('on');
$('bSave').onclick=()=>persist(false);
$('bProj').onclick=()=>{commit();listProjects();$('newName').value='';$('mProj').classList.add('on')};
$('bNew').onclick=()=>{
  const n=$('newName').value.trim()||('Projekt '+(Object.keys(store.list).length+1));
  if(dirty)persist(true);
  const id=newProject(n,{});store.cur=id;writeStore();cells={};undo=[];dirty=false;lastSaved=store.list[id].t;
  closeAll();select(0,0);showProj();$('mTpl').classList.add('on');toast('📁 Projekt „'+n+'“ angelegt');
};
$('newName').addEventListener('keydown',e=>{if(e.key==='Enter')$('bNew').click()});
$('plist').addEventListener('click',e=>{
  const o=e.target.closest('[data-open]'),d=e.target.closest('[data-del]');
  if(o){openProject(o.dataset.open);closeAll();toast('📁 '+store.list[store.cur].name+' geöffnet');return}
  if(d){ // zweimal tippen zum Löschen
    if(!d.classList.contains('sure')){d.classList.add('sure');d.textContent='Wirklich?';return}
    const id=d.dataset.del;delete store.list[id];
    if(!Object.keys(store.list).length)newProject('Meine Tabelle',{});
    if(id===store.cur){store.cur=Object.keys(store.list)[0];writeStore();openProject(store.cur)}else writeStore();
    listProjects();
  }
});
setInterval(()=>{if(dirty)persist(true)},AUTOSAVE_MS);
// Beim Verlassen der App nichts verlieren
addEventListener('pagehide',()=>{if(dirty)persist(true)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dirty)persist(true)});
select(0,0);
