<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="mCode">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1026">
<title>mCode</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Press+Start+2P&family=Space+Grotesk:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background-color:#0B1026;color:#C9D3FF;font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;image-rendering:pixelated}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;min-height:44px;min-width:44px;touch-action:manipulation}
button:disabled{cursor:default}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.off{color:#2E3878}

/* Start */
.startWrap{margin:auto;text-align:center;padding:24px}
.logo{width:116px;height:116px;margin:0 auto 16px}.logo svg{width:100%;height:100%;display:block}
.logo i{position:absolute;right:13px;bottom:11px;font-style:normal;font-size:15px;font-family:'JetBrains Mono',monospace;font-weight:700}
h1{font-size:42px;margin:0;color:#fff;letter-spacing:-.5px}
.sub{color:#9AA6E0;margin:4px 0 28px;font-size:17px}
.modes{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.modeCard{width:240px;padding:24px 18px;border-radius:20px;background:#1B2250;border:2px solid #2E3878;display:flex;flex-direction:column;gap:10px;align-items:center}
.modeCard.sel{border-color:#FFD166}
.modeCard b{font-size:21px;color:#fff}
.modeCard code{font-family:'JetBrains Mono',monospace;color:#FFB86B;font-size:22px}
.modeCard span{color:#9AA6E0;font-size:14px}

/* Header */
.top{display:flex;align-items:center;gap:8px;padding:4px 10px;height:58px;flex:none;border-bottom:1px solid #1F2752;background:rgba(11,16,38,.92)}
.top .ttl{flex:1;font-weight:700;font-size:18px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{font-size:30px;line-height:1;color:#7FDBFF}
.hstars{color:#FFD166;letter-spacing:2px;font-size:19px}
.modeBtn{border:1.5px solid #2E3878;border-radius:22px;padding:0 14px;font-size:14px;color:#C9D3FF}

/* Map */
.missionHead{text-align:center;padding:26px 16px 4px}
.missionHead h2{margin:0;color:#fff;font-size:26px}
.missionHead p{margin:6px 0 0;color:#9AA6E0}
.levelList{flex:1;overflow:auto;display:flex;flex-wrap:wrap;gap:16px;align-content:flex-start;justify-content:center;padding:22px}
.lv{width:150px;height:156px;border-radius:20px;background:#1B2250;border:2px solid #2E3878;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.lv b{font-size:40px;color:#fff;line-height:1.1}
.lv small{color:#9AA6E0;font-size:13px}
.lv.done{border-color:#7FDBFF}
.lv.lock{opacity:.35}
.lv.bit{border-color:#FFD166;border-style:dashed}
.lv.bit span{font-family:'Press Start 2P',monospace;font-size:11px;color:#FFD166}
.lv.bit svg{height:66px}

/* Game */
#split{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
@media (orientation:landscape){#split{flex-direction:row}}
.pane{flex:1 1 0;min-width:0;min-height:0;position:relative;transition:flex-grow .35s ease;display:flex;flex-direction:column;overflow:hidden}
#split.drag .pane{transition:none}
#paneCode{background:#121735}
#divider{flex:0 0 18px;display:flex;align-items:center;justify-content:center;background:#0E1330;cursor:row-resize;touch-action:none}
#divider i{width:52px;height:5px;border-radius:3px;background:#2E3878}
@media (orientation:landscape){#divider{cursor:col-resize}#divider i{width:5px;height:52px}}
#world{flex:1;min-height:0;width:100%;display:block}
.hud{position:absolute;top:10px;left:12px;font-size:15px;color:#FFD166;font-weight:600}
.hint{margin:0 12px;padding:9px 14px;border-radius:12px;background:rgba(27,34,80,.9);font-size:15px;line-height:1.3;min-height:40px;flex:none}
.hint.err{background:rgba(255,92,138,.16);color:#FFC2D3}
.hint.ok{color:#FFD166}
.cmdRow{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;flex-wrap:wrap;flex:none}
.cmdBar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.play{background:#FFD166;color:#0B1026;font-weight:700;border-radius:14px;padding:0 20px;min-height:54px;font-size:17px}
.card.fail{border-color:#FF5C8A;box-shadow:0 0 34px rgba(255,92,138,.25)}
.cmd{background:#1B2250;border:2px solid #2E3878;border-radius:14px;padding:4px 16px;display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;color:#FFB86B;font-size:16px;min-height:54px;transition:transform .1s,border-color .15s,box-shadow .15s}
.cmd .ic{font-size:20px;color:#7FDBFF;font-family:'Space Grotesk',sans-serif}
.cmd:active{transform:scale(.95)}
.cmd.lit{border-color:#FFD166;box-shadow:0 0 0 4px rgba(255,209,102,.3);background:#252D63}
.codeHead{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid #1F2752;gap:8px;flex-wrap:wrap;flex:none}
#lineInfo{font-size:13px;color:#5C6699;font-family:'JetBrains Mono',monospace}
.ctrls{display:flex;align-items:center;gap:6px}
.cbtn{background:#1F2752;border-radius:12px;padding:0 13px;color:#C9D3FF;font-size:16px}
.cbtn.run{background:#FFD166;color:#0B1026;font-weight:700;padding:0 16px}
.busy .cbtn{opacity:.45}
input[type=range]{width:84px;accent-color:#7FDBFF}
.code{list-style:none;margin:0;padding:8px 0;overflow:auto;flex:1;font-family:'JetBrains Mono',monospace;font-size:18px;line-height:1.75}
.code li{display:flex;padding:0 12px;cursor:pointer}
.code .n{width:2.4em;color:#5C6699;text-align:right;padding-right:1em;flex:none}
.code .c{color:#FFB86B}
.code li.act{background:#1F2752}
.code li.act .n{color:#C9D3FF}
.code li.err{background:rgba(255,92,138,.2)}
.code li.err .c,.code li.err .n{color:#FF5C8A}
.code .ph{color:#5C6699;cursor:default}
.overlay{position:absolute;inset:0;background:rgba(11,16,38,.8);display:none;align-items:center;justify-content:center;z-index:5;padding:20px}
.overlay.on{display:flex}
.card{background:#121735;border:2px solid #7FDBFF;border-radius:22px;padding:26px 28px;text-align:center;max-width:360px;box-shadow:0 0 34px rgba(127,219,255,.25)}
.card h3{margin:0 0 6px;color:#fff;font-size:24px}
.bigstars{font-size:46px;color:#FFD166;letter-spacing:6px}
.card p{margin:8px 0 0;color:#9AA6E0}
.btnrow{display:flex;gap:10px;justify-content:center;margin-top:18px}
.pbtn{background:#FFD166;color:#0B1026;font-weight:700;border-radius:12px;padding:0 22px}
.sbtn{background:#1F2752;border-radius:12px;padding:0 22px}


.cmdRow{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px 8px;flex-wrap:wrap;flex:none}
.cmdBar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.cmd{background:#1B2250;border:1.5px solid #2E3878;border-radius:10px;padding:2px 10px;display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;color:#FFB86B;font-size:13px;min-height:40px;min-width:0;transition:transform .1s,border-color .15s,box-shadow .15s}
.cmd .ic{font-size:15px;color:#7FDBFF;font-family:'Space Grotesk',sans-serif}
.play{background:#FFD166;color:#0B1026;font-weight:700;border-radius:10px;padding:0 14px;min-height:40px;font-size:15px}
.hint{margin:0 10px;padding:6px 12px;border-radius:10px;background:rgba(27,34,80,.9);font-size:14px;line-height:1.3;flex:none}
.rotHint{position:absolute;top:10px;right:12px;font-size:12px;color:#5C6699;transition:opacity .4s;pointer-events:none}
#world{touch-action:none}
.cbtn.edit{background:#2E3878;color:#fff}
.code li .t{white-space:pre}
.code .k{color:#7FDBFF}.code .d{color:#FFD166}.code .cm{color:#5C6699}
.ta{display:none;flex:1;width:100%;resize:none;border:0;outline:0;background:#121735;color:#C9D3FF;caret-color:#FFD166;font-family:'JetBrains Mono',monospace;font-size:18px;line-height:1.75;padding:8px 14px;tab-size:4;user-select:text;-webkit-user-select:text}
.nobtn .cmdRow{display:none}
.crown{width:.95em;height:.72em;margin-left:5px;vertical-align:-.02em}
.bigstars .crown{width:44px;height:33px}
.winC{font-size:14px;color:#FFD166!important}
/* Zwischensequenz */
.cut{font-family:'VT323',monospace;color:#C9D3FF;cursor:pointer}
.infoBox{position:absolute;top:calc(16px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));padding:10px 16px 14px;border-left:6px solid #C9D3FF;border-bottom:6px solid #C9D3FF;background:#0B1026;min-width:236px}
.infoBox::after{content:'';position:absolute;left:-6px;bottom:-12px;width:12px;height:6px;background:#6B7BC4}
.nm{font-family:'Press Start 2P',monospace;font-size:16px;color:#fff}
.role{font-family:'Press Start 2P',monospace;font-size:9px;color:#6B7BC4;margin:8px 0 12px}
.bar{display:flex;align-items:center;gap:8px}
.bar span{font-family:'Press Start 2P',monospace;font-size:8px;color:#FFD166}
.segs{display:flex;gap:3px}
.segs i{width:18px;height:10px;background:#2E3878}
.segs i.on{background:#FFD166}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:0;padding-top:120px}
#figBig{height:min(36vh,300px);animation:hop 1.2s steps(1) infinite}
@keyframes hop{50%{transform:translateY(-6px)}}
.plat{width:min(28vh,230px);height:14px;margin-top:2px;background:#2E3878;box-shadow:0 -4px 0 #6B7BC4,0 6px 0 #1B2250}
.chat{margin:22px 16px 16px;position:relative;background:#0B1026;border:4px solid #fff;box-shadow:inset 0 0 0 4px #0B1026,inset 0 0 0 7px #6B7BC4;padding:20px 22px 26px;min-height:190px;flex:none}
.spk{font-family:'Press Start 2P',monospace;font-size:12px;color:#FFD166;margin-bottom:10px}
#cutTxt{font-size:27px;line-height:1.1;color:#fff;min-height:60px}
#cutCode{font-family:'VT323',monospace;font-size:25px;color:#C9D3FF;background:#1B2250;padding:8px 14px;margin:12px 0 0;white-space:pre;overflow:auto}
#cutNext{position:absolute;right:12px;bottom:4px;color:#FFD166;font-size:26px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (orientation:landscape) and (max-height:600px){.stage{padding-top:20px}#figBig{height:28vh}.chat{min-height:150px}}

.homeLink{position:absolute;top:calc(12px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));color:#7FDBFF;text-decoration:none;font-weight:600;font-size:15px;padding:10px 6px}
.missionList{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:14px 14px 40px;display:flex;flex-direction:column;gap:18px;max-width:900px;width:100%;margin:0 auto}
.mis{background:rgba(18,23,53,.85);border:1.5px solid #1F2752;border-radius:20px;padding:14px 14px 16px}
.mis.lock{opacity:.4}
.misHead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.misNum{width:42px;height:42px;border-radius:12px;background:#1B2250;border:2px solid #2E3878;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;color:#fff;flex:none}
.mis.done .misNum{border-color:#7FDBFF}
.mis.badge .misNum{background:#FFD166;color:#0B1026;border-color:#FFD166}
.misHead h2{margin:0;font-size:19px;color:#fff}.misHead p{margin:2px 0 0;font-size:13px;color:#9AA6E0}
.misHead .bonus{font-size:11px;color:#0B1026;background:#7FDBFF;border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.lvRow{display:flex;flex-wrap:wrap;gap:10px}
.lv{width:84px;height:92px;border-radius:16px;background:#1B2250;border:2px solid #2E3878;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.lv b{font-size:26px;color:#fff;line-height:1.1}
.lv small{color:#9AA6E0;font-size:11px}
.lv .hstars{font-size:13px;letter-spacing:1px}
.lv.done{border-color:#7FDBFF}
.lv.lock{opacity:.35}
.lv.cutn{border-color:#FFD166;border-style:dashed}
.lv.cutn svg{height:44px}
.lv.cutn span{font-family:'Press Start 2P',monospace;font-size:8px;color:#FFD166}
.lv .ty{font-size:12px;color:#7FDBFF}
.ws .lv{width:auto;min-width:120px;padding:0 14px}
.vtabs{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.vtabs button{min-height:32px;min-width:38px;border-radius:10px;background:#1B2250;border:1.5px solid #2E3878;font-size:13px;font-weight:700;color:#9AA6E0}
.vtabs button.on{border-color:#7FDBFF;color:#fff}
.vtabs button.ok{background:#1E4B4A;color:#7FDBFF}
.vtabs button.bad{background:#4A1E37;color:#FF8AAD}
.cmd.blk{color:#7FDBFF}.cmd.fn{color:#0B1026;background:#7FDBFF;border-color:#7FDBFF}
.cmd.fn .ic{color:#0B1026}
.cmd.end{color:#C9D3FF}
.chip{background:#252D63;border:1.5px solid #6B7BC4;border-radius:10px;padding:2px 12px;min-height:40px;font-family:'JetBrains Mono',monospace;font-size:14px;color:#FFB86B}
.chip.sel{background:#FFD166;color:#0B1026;border-color:#FFD166}
.chip.x{color:#C9D3FF;font-family:'Space Grotesk',sans-serif}
.cmdRow .lbl{font-size:13px;color:#9AA6E0}
.code .ig{display:inline-block;width:4ch;border-left:1.5px solid #2E3878;height:1.5em;vertical-align:middle}
.code li.ro{cursor:default}
.edWrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;min-height:0}
#eworld{flex:1;min-height:0;width:100%;touch-action:none}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tool{min-height:42px;border-radius:12px;background:#1B2250;border:1.5px solid #2E3878;padding:0 12px;font-size:14px}
.tool.on{border-color:#FFD166;color:#FFD166}
.edInfo{font-size:14px;color:#9AA6E0;text-align:center;min-height:20px}
.btnrow.wrap{flex-wrap:wrap;margin-top:0}
.modal .card{max-width:520px;width:100%}
.mta{width:100%;height:160px;margin-top:10px;background:#0B1026;color:#C9D3FF;border:1.5px solid #2E3878;border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:12px;padding:8px;user-select:text;-webkit-user-select:text}
.mta[hidden]{display:none}
.ctrls{flex-wrap:wrap;justify-content:flex-end}
.cbtn{white-space:nowrap}
@media (orientation:landscape){.codeHead #lineInfo{width:100%}input[type=range]{width:64px}}
.code li.ghost{cursor:default}.code .gc{color:#FFD166;opacity:.75;font-size:14px;animation:blink 1.2s steps(1) infinite}
.voiceBtn{font-size:20px;border-radius:22px;border:1.5px solid #2E3878;min-width:46px}
.voiceBtn.off{opacity:.5}
.cutVoice{position:absolute;top:calc(16px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));background:#0B1026;z-index:2}
.hint.talk{cursor:pointer}
</style>
</head>
<body>
<section id="sStart" class="screen">
  <a class="homeLink" id="homeLink" href="../" aria-label="Zurück zu mLogic">← mLogic</a>
  <div class="startWrap">
    <div class="logo"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" rx="24" fill="#FDD602"/><g fill="none" stroke="#262625" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M26 37 13 50l13 13"/><path d="M74 37 87 50 74 63"/></g><g fill="#262625"><path d="M50 16c10 9 13 24 11 46H39c-2-22 1-37 11-46z"/><path d="M39 47 31 60l1 6 8-4zM61 47l8 13-1 6-8-4z"/><path d="M44 66h12l-6 14z"/></g><circle cx="50" cy="38" r="5.5" fill="#FDD602"/></svg></div>
    <h1>mCode</h1>
    <p class="sub">Spielerisch Python lernen</p>
    <div class="modes">
      <button class="modeCard" data-mode="kid"><b>Kinder-Modus</b><code>vor()</code><span>kurz, verspielt, deutsch</span></button>
      <button class="modeCard" data-mode="adult"><b>Erwachsenen-Modus</b><code>move()</code><span>sachlich, mehr Erklärung</span></button>
    </div>
  </div>
</section>

<section id="sMap" class="screen">
  <header class="top"><button class="back" id="mapBack" aria-label="Zurück">‹</button><div class="ttl">mCode</div><div class="hstars" id="mapTotal"></div><button class="voiceBtn" aria-label="Sprecher an/aus"></button><button class="modeBtn"></button></header>
  <div id="missionList" class="missionList"></div>
</section>

<section id="sGame" class="screen">
  <header class="top"><button class="back" id="gBack" aria-label="Zurück">‹</button><div class="ttl" id="gTitle"></div><div id="gStars" class="hstars"></div><button class="voiceBtn" aria-label="Sprecher an/aus"></button><button class="modeBtn"></button></header>
  <main id="split">
    <div id="paneGame" class="pane">
      <svg id="world" viewBox="14 32 396 258" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="hud" id="hud"></div><div class="rotHint" id="rotHint">↔ Wischen zum Drehen</div>
      <div class="vtabs" id="vtabs"></div>
      <div id="hint" class="hint"></div>
      <div class="cmdRow" id="cmdRow"></div>
    </div>
    <div id="divider"><i></i></div>
    <div id="paneCode" class="pane">
      <div class="codeHead" id="codeHead">
        <span id="lineInfo"></span>
        <div class="ctrls">
          <button class="cbtn edit" id="bEdit">✎ Tippen</button>
          <button class="cbtn run" id="bRun">▶ Play</button>
          <button class="cbtn" id="bStep" title="Schritt">⏭</button>
          <input type="range" id="speed" min="1" max="5" value="3" aria-label="Tempo">
          <button class="cbtn" id="bUndo" title="Letzte Zeile löschen">⌫</button>
          <button class="cbtn" id="bClear" title="Zurücksetzen">↺</button>
        </div>
      </div>
      <ol id="code" class="code"></ol>
      <textarea id="ta" class="ta" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
    </div>
  </main>
  <div id="fail" class="overlay"><div class="card fail">
    <h3 id="failT"></h3><p id="failS"></p>
    <div class="btnrow"><button class="sbtn" id="failClear">Code löschen</button><button class="pbtn" id="failRestart">Neu starten</button></div>
  </div></div>
  <div id="win" class="overlay"><div class="card">
    <h3 id="winT"></h3><div class="bigstars" id="winStars"></div><p id="winS"></p><p id="winC" class="winC"></p>
    <div class="btnrow"><button class="sbtn" id="winAgain">Nochmal</button><button class="sbtn" id="winSave" hidden>Bild speichern</button><button class="pbtn" id="winNext">Weiter</button></div>
  </div></div>
</section>

<section id="sCut" class="screen cut">
  <button class="voiceBtn cutVoice" aria-label="Sprecher an/aus"></button>
  <div class="infoBox"><div class="nm" id="cutName">BIT</div><div class="role" id="cutRole">:MENTOR</div><div class="bar"><span id="cutBar">WISSEN</span><div class="segs" id="segs"></div></div></div>
  <div class="stage"><div id="figWrap"></div><div class="plat"></div></div>
  <div class="chat"><div class="spk" id="cutSpk">BIT</div><div id="cutTxt"></div><pre id="cutCode"></pre><button id="cutNext" aria-label="Weiter">▼</button></div>
</section>

<section id="sEdit" class="screen">
  <header class="top"><button class="back" id="eBack" aria-label="Zurück">‹</button><div class="ttl">Level-Editor</div><button class="modeBtn"></button></header>
  <div class="edWrap">
    <svg id="eworld" viewBox="14 32 396 258" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="tools" id="tools"></div>
    <div class="edInfo" id="edInfo"></div>
    <div class="btnrow wrap">
      <button class="sbtn" id="eNew">Neu</button><button class="sbtn" id="eSize">6×6</button><button class="sbtn" id="eCopy">Kopieren</button><button class="sbtn" id="ePaste">Einfügen</button><button class="sbtn" id="eSave">Speichern</button><button class="pbtn" id="eTest">▶ Testen</button>
    </div>
  </div>
</section>

const DIRS={N:[0,-1],E:[1,0],S:[0,1],W:[-1,0]},ORD='NESW';

function gridWorld(V,opt={}){

   if(droneAt(st.x,st.y,st.t)||(st.x!==ox||st.y!==oy)&&V.gegner.some(b=>{const a=dronePos(b,st.t-1),c=dronePos(b,st.t);return a[0]===st.x&&a[1]===st.y&&c[0]===ox&&c[1]===oy})){

  const n1=()=>{if(args.length>1)throw{line,k:'args',n:nm};const v=args.length?args[0]:1;if(typeof v!=='number')throw{line,k:'type'};return v};
  switch(id){

   case 'turn':{const d=n1();act('turn',line,()=>{st.a=(st.a+d)%360});return{v:null}}
   case 'right':{const d=args.length?n1():90;act('turn',line,()=>{st.a=(st.a+d)%360});return{v:null}}
   case 'left':{const d=args.length?n1():90;act('turn',line,()=>{st.a=(st.a-d)%360});return{v:null}}
   case 'color':{if(args.length!==1||typeof args[0]!=='string')throw{line,k:'colorarg'};const c=COLORS[args[0].toLowerCase()];if(!c)throw{line,k:'color',n:args[0]};

   case 'pendown':act('pen',line,()=>{st.pen=true});return{v:null};

function segDist(px,py,s){const dx=s.x2-s.x1,dy=s.y2-s.y1,L=dx*dx+dy*dy;let t=L?((px-s.x1)*dx+(py-s.y1)*dy)/L:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(s.x1+t*dx),py-(s.y1+t*dy))}
function covers(A,B,tol=.22){for(const s of A){const L=Math.hypot(s.x2-s.x1,s.y2-s.y1),k=Math.max(1,Math.ceil(L/.25));
 for(let i=0;i<=k;i++){const px=s.x1+(s.x2-s.x1)*i/k,py=s.y1+(s.y2-s.y1)*i/k;if(!B.some(b=>segDist(px,py,b)<tol))return false}}return true}

let cutId=null,cutP=0,cutDone=null,typing=null;
function openCut(id,after){cutId=id;cutDone=after;cutP=0;show('sCut');showPage()}
function showPage(instant){const pages=CUTS[cutId].pages,pg=pages[cutP],ch=CHARS[pg.s];
 $('#figWrap').innerHTML=FIG[pg.s]('figBig');$('#cutName').textContent=ch.name;$('#cutRole').textContent=ch.role;$('#cutBar').textContent=ch.bar;$('#cutSpk').textContent=ch.name;
 const fill=Math.round((cutP+1)/pages.length*5);$('#segs').innerHTML=[0,1,2,3,4].map(i=>`<i class="${i<fill?'on':''}"></i>`).join('');
 const code=fillT(pg.c,M());$('#cutCode').textContent=code;$('#cutCode').style.display=code?'':'none';
 const el=$('#cutTxt'),t=pg[M()];clearInterval(typing);typing=null;if(instant){el.textContent=t;return}
 speak(pg.kid,pg.s);
 let k=0;el.textContent='';typing=setInterval(()=>{k+=2;el.textContent=t.slice(0,k);if(k>=t.length){clearInterval(typing);typing=null}},26)}
$('#sCut').onclick=e=>{if(e.target.closest('.modeBtn')||e.target.closest('.voiceBtn'))return;if(typing){clearInterval(typing);typing=null;showPage(true);return}
 cutP++;if(cutP>=CUTS[cutId].pages.length){S.seen[cutId]=true;save();cutDone?cutDone():(renderMap(),show('sMap'))}else showPage()};

/* ---------- Löser (Breitensuche) für Editor & Tagesrätsel ---------- */
function solve(V){const n=V.n,k=V.sterne.length,full=(1<<k)-1,wall=(x,y)=>has(V.waende,x,y)>=0||V.gegner.some(b=>b[0][0]===x&&b[0][1]===y),hole=(x,y)=>has(V.loecher,x,y)>=0,inB=(x,y)=>x>=0&&y>=0&&x<n&&y<n;
 const key=(x,y,d,m)=>((x*n+y)*4+ORD.indexOf(d))*(1<<k)+m,seen=new Set();let q=[[V.start[0],V.start[1],V.start[2],0]],dist=0;seen.add(key(...q[0]));
 while(q.length&&dist<60){const nq=[];for(const[x,y,d,m]of q){if(x===V.ziel[0]&&y===V.ziel[1]&&m===full)return dist;
   const[dx,dy]=DIRS[d],nx=[];const add=s=>{const kk=key(...s);if(!seen.has(kk)){seen.add(kk);nq.push(s)}};
   if(inB(x+dx,y+dy)&&!wall(x+dx,y+dy)&&!hole(x+dx,y+dy))add([x+dx,y+dy,d,m]);
   if(inB(x+2*dx,y+2*dy)&&!(inB(x+dx,y+dy)&&wall(x+dx,y+dy))&&!wall(x+2*dx,y+2*dy)&&!hole(x+2*dx,y+2*dy)&&V.loecher.length)add([x+2*dx,y+2*dy,d,m]);
   add([x,y,ORD[(ORD.indexOf(d)+3)%4],m]);add([x,y,ORD[(ORD.indexOf(d)+1)%4],m]);
   const si=has(V.sterne,x,y);if(si>=0&&!(m>>si&1))add([x,y,d,m|1<<si])}q=nq;dist++}
 return-1}
const ALLK=['move','left','right','pick','jump','loop','if','else','while','def'];
function customLevel(d){const l=Object.assign({n:6,waende:[],sterne:[],loecher:[],gegner:[]},JSON.parse(JSON.stringify(d)));l.typ='bauen';l.gegner=l.gegner.map(g=>Array.isArray(g[0])?g:[g]);
 const o=solve(l);l.max=o>0?o:20;l.knoepfe=l.loecher.length?ALLK:ALLK.filter(k=>k!=='jump');l.sens=['wall','star','hole','goal'];return l}
function dayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dailyLevel(key){let seed=0;for(const c of key)seed=seed*31+c.charCodeAt(0)|0;const r=rng(seed),ri=n=>Math.floor(r()*n);
 for(let tries=0;tries<800;tries++){const used=new Set(),cell=()=>{for(;;){const x=ri(6),y=ri(6);if(!used.has(x+','+y)){used.add(x+','+y);return[x,y]}}};
  const s=cell(),z=cell(),l={n:6,start:[s[0],s[1],'NESW'[ri(4)]],ziel:z,waende:[],sterne:[],loecher:[],gegner:[]};
  for(let i=0,w=6+ri(4);i<w;i++)l.waende.push(cell());for(let i=0,w=1+ri(2);i<w;i++)l.sterne.push(cell());for(let i=0,w=ri(3);i<w;i++)l.loecher.push(cell());if(r()<.5)l.gegner.push([cell()]);
  const o=solve(l);if(o>=8&&o<=16){const c=customLevel(l);c.hint={kid:`Tagesrätsel! Kürzester Weg ohne Schleifen: ${o} Zeilen.`,adult:`Tagesrätsel. Optimum ohne Schleifen: ${o} Anweisungen.`};return c}}
 return customLevel({start:[0,5,'N'],ziel:[5,0],sterne:[[0,0]]})}

/* ---------- Level-Editor ---------- */
let E=null,eIdx=null,tool='wall';
const TOOLS=[['wall','Asteroid'],['star','Stern'],['hole','Krater'],['drone','Drohne'],['start','Start ↻'],['goal','Planet'],['erase','Radierer']];
function openEditor(i,keep){eIdx=i;if(!keep||!E)E=i!=null?JSON.parse(JSON.stringify(S.custom[i].data)):{n:6,start:[0,5,'N'],ziel:[5,0],waende:[],sterne:[],loecher:[],gegner:[]};
 rotT=rotA=0;setBoard(E.n);renderTools();edInfo();show('sEdit')}
function renderTools(){$('#tools').innerHTML=TOOLS.map(([k,l])=>`<button class="tool ${tool===k?'on':''}" data-t="${k}">${l}</button>`).join('');$('#eSize').textContent=E?E.n+'×'+E.n:'6×6'}
$('#tools').onclick=e=>{const b=e.target.closest('button');if(!b)return;tool=b.dataset.t;renderTools()};
function edLevel(){const l=Object.assign({waende:[],sterne:[],loecher:[],gegner:[]},E);l.gegner=(E.gegner||[]).map(g=>[g]);return l}
function edInfo(){const o=solve(edLevel());$('#edInfo').textContent=o<0?(kid()?'⚠ So ist das Level nicht lösbar.':'⚠ Nicht lösbar.'):(kid()?`Lösbar! Kürzester Weg: ${o} Zeilen (= 3 Sterne).`:`Lösbar. Optimum ohne Schleifen: ${o} Anweisungen.`)}
function renderEditor(t){setBoard(E.n);const l=edLevel();const st={x:E.start[0],y:E.start[1],d:E.start[2],got:[],path:[[E.start[0],E.start[1]]],t:0,said:null};
 $('#eworld').innerHTML=renderGrid(l,{a:st,b:st,e:1},t).svg}
swipeTap($('#eworld'),e=>{const c=cellAt($('#eworld'),e);if(!c)return;const[x,y]=c,same=p=>p[0]===x&&p[1]===y,rm=()=>{for(const k of['waende','sterne','loecher','gegner'])E[k]=(E[k]||[]).filter(p=>!same(p))};
 const isS=same(E.start),isZ=same(E.ziel);
 if(tool==='start'){if(isS)E.start[2]=ORD[(ORD.indexOf(E.start[2])+1)%4];else if(!isZ){rm();E.start=[x,y,E.start[2]]}}
 else if(tool==='goal'){if(!isS){rm();E.ziel=[x,y]}}
 else if(tool==='erase')rm();
 else if(!isS&&!(isZ&&tool!=='star')){const k={wall:'waende',star:'sterne',hole:'loecher',drone:'gegner'}[tool],had=(E[k]||[]).some(same);rm();if(!had)E[k].push([x,y])}
 edInfo()});
$('#eBack').onclick=()=>{renderMap();show('sMap')};
$('#eNew').onclick=()=>{E=null;openEditor(null)};
$('#eSize').onclick=()=>{const n=E.n===6?8:6,cl=p=>p[0]<n&&p[1]<n;E.n=n;for(const k of['waende','sterne','loecher','gegner'])E[k]=E[k].filter(cl);if(!cl(E.start))E.start=[0,n-1,'N'];if(!cl(E.ziel))E.ziel=[n-1,0];setBoard(n);renderTools();edInfo()};
$('#eTest').onclick=()=>{if(solve(edLevel())<0){edInfo();return}const l=customLevel(E);startLevel(l,{kind:'custom',edit:eIdx==null?'new':eIdx})};
$('#eSave').onclick=()=>{if(eIdx==null||eIdx==='new'){S.custom.push({name:(kid()?'Mein Level ':'Level ')+(S.custom.length+1),data:JSON.parse(JSON.stringify(E))});eIdx=S.custom.length-1}else S.custom[eIdx].data=JSON.parse(JSON.stringify(E));save();
 $('#edInfo').textContent=kid()?'Gespeichert! Du findest es in der Werkstatt.':'Gespeichert (Werkstatt).'};
function modal(title,text,val,ok){$('#mT').textContent=title;$('#mS').textContent=text;const ta=$('#mTa');ta.hidden=val==null;ta.value=val||'';$('#modal').classList.add('on');
 $('#mOk').onclick=()=>{$('#modal').classList.remove('on');ok&&ok(ta.value)};$('#mNo').onclick=()=>$('#modal').classList.remove('on');if(val!=null)setTimeout(()=>{ta.focus();ta.select()},50)}
$('#eCopy').onclick=()=>{const j=JSON.stringify(E);try{navigator.clipboard.writeText(j).then(()=>$('#edInfo').textContent=kid()?'Kopiert! Schick es jemandem.':'In die Zwischenablage kopiert.',()=>modal('Level-Code',kid()?'Markieren und kopieren:':'Code kopieren:',j))}catch(e){modal('Level-Code','',j)}};
$('#ePaste').onclick=()=>modal(kid()?'Level einfügen':'Level importieren',kid()?'Füge hier einen Level-Code ein.':'JSON einfügen:','',v=>{try{const d=JSON.parse(v);if(!d.start||!d.ziel)throw 0;d.n=d.n===8?8:6;
 for(const k of['waende','sterne','loecher','gegner'])d[k]=(d[k]||[]).map(p=>Array.isArray(p[0])?p[0]:p);E=d;eIdx=null;openEditor(null,true)}catch(e){$('#edInfo').textContent=kid()?'Das war kein gültiger Level-Code.':'Ungültiges Format.'}});

/* ---------- Start ---------- */
refreshMode();
if(S.mode){renderMap();show('sMap')}else show('sStart');
if('serviceWorker' in navigator&&/\/code\/?/.test(location.pathname))navigator.serviceWorker.register('../sw.js',{updateViaCache:'none'}).catch(()=>{});

</script>
