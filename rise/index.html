<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F7F5F0">
<title>mRise</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="mRise">
<style>
:root{--y:#FDD602;--d:#262625;--bg:#F7F5F0;--line:#E4DFD3;--mut:#8A877F;--barh:104px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--d);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
body.kids{--barh:128px}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#top{position:fixed;top:0;left:0;right:0;height:calc(58px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;gap:10px;pointer-events:none}
#top>*{pointer-events:auto}
.logo{width:34px;height:34px;flex:none;display:block}
.title{font-weight:800;font-size:20px;letter-spacing:-.4px}
.chip{font-size:12px;font-weight:600;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.stats{display:flex;gap:16px;margin-left:4px}
.stat{line-height:1.1;white-space:nowrap}
.stat span{display:block;color:var(--mut);font-size:10.5px}
.stat b{font-size:16px;font-variant-numeric:tabular-nums}
.stat b.dim{color:var(--mut);font-weight:600}
.sp{flex:1}
.btn{border:0;background:var(--d);color:#fff;font:inherit;font-weight:650;font-size:14px;padding:9px 14px;border-radius:12px;cursor:pointer;white-space:nowrap}
.btn.y{background:var(--y);color:var(--d)}
.btn.g{background:#fff;color:var(--d);border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--barh) + env(safe-area-inset-bottom));padding:8px 10px env(safe-area-inset-bottom);background:rgba(255,255,255,.94);border-top:1px solid var(--line);display:flex;align-items:center;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.grp{display:flex;align-items:center;gap:4px;flex:none}
.sep{width:1px;height:58px;background:var(--line);flex:none;margin:0 3px}
.tile{width:56px;height:76px;border-radius:14px;background:#fff;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--mut);cursor:grab;flex:none;position:relative;touch-action:none}
.tile.on{border:2px solid var(--d);color:var(--d)}
.tile.off{opacity:.35}
.tile svg{width:40px;height:40px;display:block}
.tile .cnt{position:absolute;top:3px;right:6px;font-weight:750;color:var(--d);font-size:12px}
.mat{width:48px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:10.5px;color:var(--mut);cursor:pointer;flex:none}
.mat i{width:30px;height:30px;border-radius:50%;border:2px solid transparent;display:block}
.mat.on i{border-color:var(--d)}
.mat.on{color:var(--d);font-weight:650}
.knobw{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mut);flex:none;width:66px}
.knob{width:56px;height:56px;border-radius:50%;background:#fff;border:1.5px solid var(--line);position:relative;touch-action:none;cursor:pointer}
.knob svg{position:absolute;inset:0;width:100%;height:100%}
.bud{display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:var(--mut);width:56px;flex:none}
.bud b{font-size:22px;color:var(--d)}
.tbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:58px;height:76px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font:inherit;font-size:10.5px;color:var(--d);gap:3px;cursor:pointer;flex:none}
.tbtn:disabled{opacity:.35}
.tbtn svg{width:30px;height:30px}
.tbtn .ok{font-size:11px;font-weight:700}
body.kids .tile{width:84px;height:96px;border-radius:20px}
body.kids .tile svg{width:58px;height:58px}
body.kids .mat{width:58px}
body.kids .mat i{width:44px;height:44px}
.kbtn{width:76px;height:96px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-size:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.kbtn.on{border:2px solid var(--d)}
.kbtn svg{width:50px;height:50px}
.wob{display:flex;gap:4px;flex:none}
#top .wob button{width:38px;height:46px;border-radius:12px}
#top .wob svg{width:22px;height:34px}
.back{text-decoration:none;padding:7px 12px;font-size:17px}
.khome{font-size:20px;padding:6px 12px}
.wob button{width:44px;height:96px;border-radius:14px;background:#fff;border:1.5px solid var(--line);padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.wob button.on{border:2px solid var(--d);background:#FFF8D1}
.wob svg{width:34px;height:52px}
.wob .dots{display:flex;gap:2px}.wob .dots i{width:4px;height:4px;border-radius:50%;background:var(--d)}
#overlay{position:fixed;inset:0;background:rgba(247,245,240,.93);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;width:min(440px,100%);max-height:100%;overflow:auto;touch-action:pan-y}
.mhead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.mhead .logo{width:64px;height:64px}
.mt{font-size:30px;font-weight:850;letter-spacing:-.8px}
.ms{color:var(--mut);font-size:14px}
.card h2{margin:0 0 6px;font-size:26px;letter-spacing:-.5px}
.card p{color:var(--mut);font-size:14px;line-height:1.45;margin:8px 0}
.btn.wide{display:block;width:100%;margin:8px 0;padding:13px;font-size:16px;text-align:center}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.big3{display:flex;gap:18px;margin:14px 0}
.big3 div{line-height:1.15}.big3 span{display:block;color:var(--mut);font-size:12px}.big3 b{font-size:24px}
.badge{display:inline-block;background:var(--y);color:var(--d);font-weight:750;font-size:12px;border-radius:999px;padding:3px 10px;margin-left:6px;vertical-align:middle}
input.name{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);margin:6px 0;outline:none;user-select:text;-webkit-user-select:text}
input.name:focus{border-color:var(--d)}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;font:inherit;font-size:13px;font-weight:650;padding:8px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
.tabs button.on{background:var(--d);color:#fff;border-color:var(--d)}
.list{margin:6px 0 10px}
.li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #F0ECE3}
.li .rk{width:22px;color:var(--mut);font-weight:700;font-size:13px}
.li .nm{flex:1;min-width:0}.li .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .nm span{color:var(--mut);font-size:12px}
.li .pt{font-weight:800;font-size:17px}
.mini{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 9px;font-size:13px;cursor:pointer;font-family:inherit}
.empty{color:var(--mut);text-align:center;padding:20px 0;font-size:14px}
.hidden{display:none!important}
.tile .wt{position:absolute;top:3px;left:6px;font-size:10px;font-weight:650;color:var(--mut)}
.tbtn.act{background:#FFF3B0;border:2px solid var(--d)}
#fab{position:fixed;right:12px;display:flex;gap:8px;z-index:5}
#fab .btn{font-size:16px;padding:13px 18px;border-radius:14px}
#fab #fDrop:disabled{opacity:.4}
#toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--d);color:#fff;padding:9px 15px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;white-space:nowrap}
#bar{touch-action:pan-x}.tile{touch-action:pan-x}body.kids .tile{touch-action:none}
.tbtn{width:58px;font-size:9.5px;padding:0}.mat{width:42px}
@media (max-width:900px){.tile{width:54px}.stats{gap:10px}.stat b{font-size:14px}.hidew{display:none}}
@media (max-width:640px){.stat span{display:none}.chip{display:none}.title{font-size:17px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top"></div>
<div id="bar"></div>
<div id="overlay" class="hidden"></div>
<div id="fab" class="hidden"><button class="btn g" id="fPrep">❄ Vorbereiten</button><button class="btn g" id="fCancel">✕</button><button class="btn y" id="fDrop">✓ Fallen lassen</button></div>
<div id="toast"></div>

  const v=shapeVerts(s,1),sh=SHAPES[s];const k=32/Math.max(sh.w,sh.h);

}
const ICON={
  glue:'<svg viewBox="0 0 40 40"><path d="M20 6C26 15 30 20 30 25a10 10 0 0 1-20 0c0-5 4-10 10-19z" fill="#FDD602" stroke="#262625" stroke-width="2"/></svg>',
  pin:'<svg viewBox="0 0 40 40"><rect x="5" y="15" width="22" height="10" rx="2" fill="#EAD6B0" stroke="#C8AB7C" transform="rotate(-20 16 20)"/><rect x="13" y="15" width="22" height="10" rx="2" fill="#D9DBDF" stroke="#AEB3BA" transform="rotate(20 24 20)"/><circle cx="20" cy="20" r="5.5" fill="#262625"/><circle cx="20" cy="20" r="2" fill="#fff"/></svg>',

const GLUE_V=12;

  for(const p of ev.pairs){
    const a=p.bodyA,b=p.bodyB,A=a.parent,B=b.parent,n=p.collision.normal;

    }
  }

  const M=MATS[mat],lv=shapeVerts(shape,1);

}
function pAng(b){const v=b.vertices;return Math.atan2(v[1].y-v[0].y,v[1].x-v[0].x)-b.plugin.m.a0}
function toWorld(b,l){return Vector.add(b.position,Vector.rotate(l,pAng(b)))}

function byId(id){for(const p of parts)if(p.plugin.m.id===id)return p;return null}
function addPart(shape,mat,k,x,y,a,d){

}
function unitPieces(U){return U.parts.length>1?U.parts.slice(1):[U]}
function pointVel(U,p){return {x:U.velocity.x-U.angularVelocity*(p.y-U.position.y),y:U.velocity.y+U.angularVelocity*(p.x-U.position.x)}}
function regroupUnits(units){
  const oldU=new Set(units),ids=new Set(),st=new Map();
  for(const U of oldU)for(const p of unitPieces(U))if(parts.includes(p))ids.add(p.plugin.m.id);
  for(const p of parts)if(ids.has(p.plugin.m.id))st.set(p.plugin.m.id,{p,x:p.position.x,y:p.position.y,a:pAng(p),v:pointVel(p.parent,p.position),w:p.parent.angularVelocity,u:p.parent});
  for(const U of oldU)Composite.remove(world,U);
  const par={},f=x=>par[x]===x?x:(par[x]=f(par[x]));ids.forEach(i=>par[i]=i);
  for(const j of joints)if(j.t==='glue'&&ids.has(j.a)&&ids.has(j.b))par[f(j.a)]=f(j.b);
  const groups={};ids.forEach(i=>{const r=f(i);(groups[r]=groups[r]||[]).push(i)});
  for(const g of Object.values(groups))buildUnit(g.map(i=>st.get(i)));

}
function buildUnit(list){
  const fresh=list.map(s=>{const m=s.p.plugin.m,b=makeBody(m.shape,m.mat,m.k,s.x,s.y,s.a);b.plugin.m=m;parts[parts.indexOf(s.p)]=b;return b;});
  let U;
  if(fresh.length===1)U=fresh[0];
  else{let M=0,f=0;fresh.forEach(b=>{M+=b.mass;f+=b.friction*b.mass});U=Body.create({parts:fresh.slice(),friction:f/M,frictionStatic:Math.min(2.5,f/M*1.3),restitution:0.02,frictionAir:0.012,slop:0.04});U.plugin={unit:true};
    let I=0;fresh.forEach(b=>{const dx=b.position.x-U.position.x,dy=b.position.y-U.position.y;I+=b.inertia+4*b.mass*(dx*dx+dy*dy);});Body.setInertia(U,I);}
  let vx=0,vy=0,M=0;list.forEach((s,i)=>{const m=fresh[i].mass;vx+=s.v.x*m;vy+=s.v.y*m;M+=m;});
  if(fresh.some(b=>b.plugin.m.prep)){Body.setStatic(U,true);Composite.add(world,U);return U;}
  Composite.add(world,U);Body.setVelocity(U,{x:vx/M,y:vy/M});
  if(list.every(s=>s.u===list[0].u))Body.setAngularVelocity(U,list[0].w);
  return U;
}
function createCons(j){
  j.cons.forEach(c=>Composite.remove(world,c));j.cons=[];
  const A=byId(j.a),B=byId(j.b);if(!A||!B)return;
  const UA=A.parent,UB=B.parent;if(UA===UB)return;
  const mk=(P,Q,L,st,dm)=>Constraint.create({bodyA:UA,bodyB:UB,pointA:Vector.sub(P,UA.position),pointB:Vector.sub(Q,UB.position),length:L,stiffness:st,damping:dm});
  if(j.t==='pin'){const P=toWorld(A,j.la);j.cons=[mk(P,toWorld(B,Vector.add(j.lb,{x:0,y:16})),16,0.9,0.05),mk(P,toWorld(B,Vector.add(j.lb,{x:16,y:0})),16,0.9,0.05)];}
  else if(j.t==='rope')j.cons=[mk(toWorld(A,j.la),toWorld(B,j.lb),j.len,0.8,0)];
  j.cons.forEach(c=>Composite.add(world,c));

}
function removeJoint(j){j.cons.forEach(c=>Composite.remove(world,c));j.cons=[];const i=joints.indexOf(j);if(i>=0)joints.splice(i,1);}
function removePart(b,refund){
  const id=b.plugin.m.id;
  for(const j of joints.slice())if(j.a===id||j.b===id){removeJoint(j);if(refund)connUsed=Math.max(0,connUsed-1);}
  const U=b.parent,i=parts.indexOf(b);if(i>=0)parts.splice(i,1);
  if(U===b)Composite.remove(world,b);else regroupUnits([U]);
  wakeAll();
}
function applyPhys(){engine.enableSleeping=!cfg.real;if(cfg.real)wakeAll();}
function wakeAll(){for(const b of parts)Sleeping.set(b.parent,false)}
const wpA=c=>({x:c.bodyA.position.x+c.pointA.x,y:c.bodyA.position.y+c.pointA.y});
const wpB=c=>({x:c.bodyB.position.x+c.pointB.x,y:c.bodyB.position.y+c.pointB.y});
const vdist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function makeWeld(A,B,P,type){
  const j={t:type,a:A.plugin.m.id,b:B.plugin.m.id,la:toLocal(A,P),lb:toLocal(B,P),len:0,cons:[]};
  joints.push(j);connUsed++;

}
function makeRope(A,PA,B,PB){
  const j={t:'rope',a:A.plugin.m.id,b:B.plugin.m.id,la:toLocal(A,PA),lb:toLocal(B,PB),len:Math.max(10,vdist(PA,PB)),cons:[]};
  joints.push(j);connUsed++;createCons(j);
}
function snapshot(){
  const idx=new Map();parts.forEach((b,i)=>idx.set(b.plugin.m.id,i));
  const r=v=>({x:+v.x.toFixed(2),y:+v.y.toFixed(2)});
  return {
    parts:parts.map(b=>({s:b.plugin.m.shape,m:b.plugin.m.mat,k:b.plugin.m.k,x:+b.position.x.toFixed(2),y:+b.position.y.toFixed(2),a:+pAng(b).toFixed(5),d:b.plugin.m.d,p:b.plugin.m.prep?1:undefined})),
    joints:joints.filter(j=>idx.has(j.a)&&idx.has(j.b)).map(j=>({t:j.t,a:idx.get(j.a),b:idx.get(j.b),la:r(j.la),lb:r(j.lb),len:+j.len.toFixed(2)}))
  };
}
function clearProjs(){for(const p of projs){Composite.remove(world,p.b);if(p.c)Composite.remove(world,p.c);}projs=[];}
function clearWorld(){frozen.clear();for(const j of joints)j.cons.forEach(c=>Composite.remove(world,c));joints=[];const us=new Set(parts.map(b=>b.parent));for(const U of us)Composite.remove(world,U);parts=[];clearProjs();fx=[];}
function rebuild(plan){
  clearWorld();
  plan.parts.forEach(p=>{const b=addPart(p.s,p.m,p.k,p.x,p.y,p.a,p.d);if(p.p)b.plugin.m.prep=true;});
  const ids=parts.map(b=>b.plugin.m.id);
  plan.joints.forEach(j=>{if(ids[j.a]==null||ids[j.b]==null)return;joints.push({t:j.t,a:ids[j.a],b:ids[j.b],la:j.la,lb:j.lb,len:j.len,cons:[]});});
  if(joints.some(j=>j.t==='glue'))regroupUnits(parts.slice());else{parts.forEach(b=>{if(b.plugin.m.prep)Body.setStatic(b,true)});joints.forEach(createCons);}

// ---------- Messen
function isCalm(b){const U=b.parent;return U.isSleeping||(Math.hypot(U.velocity.x,U.velocity.y)<0.12&&Math.abs(U.angularVelocity)<0.004)}
function curH(){let m=0;for(const b of parts){if(b.plugin.m.prep)continue;const t=-b.bounds.min.y;if(t>m)m=t;}return m/100}
function curFP(){let mn=Infinity,mx=-Infinity;for(const b of parts){if(b.bounds.max.y<-3||b.plugin.m.prep)continue;for(const v of b.vertices)if(v.y>-3){if(v.x<mn)mn=v.x;if(v.x>mx)mx=v.x;}}return mn===Infinity?0:Math.max(10,mx-mn)/100}
function points(h,fp){return fp>0?Math.round(10*h*h/fp):0}
function towerBB(){if(!parts.length)return {minX:-50,maxX:50,h:0,w:100};let a=Infinity,b=-Infinity,t=0;for(const p of parts){a=Math.min(a,p.bounds.min.x);b=Math.max(b,p.bounds.max.x);t=Math.max(t,-p.bounds.min.y);}return {minX:a,maxX:b,h:t,w:b-a}}
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let t=l?((p.x-a.x)*dx+(p.y-a.y)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
function distToBody(p,b){if(Vertices.contains(b.vertices,p))return 0;let m=Infinity;const vs=b.vertices;for(let i=0;i<vs.length;i++)m=Math.min(m,segDist(p,vs[i],vs[(i+1)%vs.length]));return m}

// ---------- Tagesturm
function dkey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dlabel(){const d=new Date();return d.getDate()+'.'+(d.getMonth()+1)+'.'}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function makeDaily(){
  const key=dkey(),r=rng(hashStr('mrise-'+key)),groups={},ms=['wood','wood','wood','stone','stone','glass'];
  for(let i=0;i<12;i++){const g=DAILY_SHAPES[Math.floor(r()*5)]+'-'+ms[Math.floor(r()*ms.length)];groups[g]=(groups[g]||0)+1;}
  const order=Object.keys(groups).sort((a,b)=>{const[sa,ma]=a.split('-'),[sb,mb]=b.split('-');return SHAPE_ORDER.indexOf(sa)-SHAPE_ORDER.indexOf(sb)||MAT_ORDER.indexOf(ma)-MAT_ORDER.indexOf(mb)});
  return {key,groups,order,budget:4+Math.floor(r()*3),lost:{}};
}
function dailyLeft(g){let u=daily.lost[g]||0;for(const b of parts)if(b.plugin.m.d===g)u++;if(ghost&&ghost.d===g)u++;return daily.groups[g]-u}
function loseCount(b){if(variant==='daily'&&daily&&b.plugin.m.d&&!test)daily.lost[b.plugin.m.d]=(daily.lost[b.plugin.m.d]||0)+1}

// ---------- Simulationsschritt
function step(){
  for(const j of joints)if(j.t==='rope'&&j.cons[0]){const c=j.cons[0],d=vdist(wpA(c),wpB(c));c.length=d<j.len?d:j.len;}
  if(test)testStep();
  if(mode==='destroy'&&dz&&dz.waterOn)emitWater();
  Engine.update(engine,DT);
  glassLoad();
  if(toBreak.size){for(const b of toBreak)if(parts.includes(b))shatter(b);toBreak.clear();}
  if(unglue.size){for(const b of unglue)if(parts.includes(b))unglueP(b);unglue.clear();}
  jointCheck();wakeNeighbors();
  for(const b of parts.slice())if(b.position.y>400||Math.abs(b.position.x)>9000){loseCount(b);removePart(b,false);}
  projStep();fxStep();logicStep();
}
function glassLoad(){
  if(!cfg.glassBreaks)return;
  const load=new Map();
  for(const p of engine.pairs.list){
    if(!p.isActive)continue;
    const a=p.bodyA,b=p.bodyB;let s=0;const n=p.contactCount!=null?p.contactCount:p.contacts.length;
    for(let i=0;i<n;i++)s+=Math.abs(p.contacts[i].normalImpulse||0);
    if(!s)continue;
    for(const [X,O] of [[a,b],[b,a]]){const m=X.plugin&&X.plugin.m;if(!m||m.mat!=='glass'||X.parent.isStatic||O.label==='ground')continue;if(O.position.y>=X.position.y-2)continue;load.set(X,(load.get(X)||0)+s);}
  }
  for(const X of parts){const m=X.plugin.m;if(m.mat!=='glass')continue;const L=(load.get(X)||0)/G;m.load=L;
    if(L>GLASS_LOAD*m.k*m.k){m.lt=(m.lt||0)+DT;if(m.lt>1000)toBreak.add(X);}else m.lt=Math.max(0,(m.lt||0)-2*DT);}
}
function unglueP(b){
  const id=b.plugin.m.id;let any=false;
  for(const j of joints.slice())if(j.t==='glue'&&(j.a===id||j.b===id)){const P=toWorld(byId(j.a)||b,j.la);removeJoint(j);spark(P.x,P.y,'#E0BC00');any=true;}
  if(any)regroupUnits([b.parent]);
}
function wakeNeighbors(){
  const us=new Set();for(const b of parts)us.add(b.parent);for(const p of projs)us.add(p.b);
  const mv=[],sl=[];
  for(const U of us){if(U.isSleeping)sl.push(U);else if(Math.hypot(U.velocity.x,U.velocity.y)>0.8||Math.abs(U.angularVelocity)>0.02)mv.push(U);}
  if(!mv.length||!sl.length)return;
  for(const S of sl){const a=S.bounds;for(const M of mv){const b=M.bounds;if(a.min.x<b.max.x+6&&a.max.x>b.min.x-6&&a.min.y<b.max.y+6&&a.max.y>b.min.y-6){Sleeping.set(S,false);break;}}}
}
function jointCheck(){
  for(const j of joints.slice()){
    if(!j.cons.length)continue;
    let br=false,at=null;
    if(j.t==='rope'){const c=j.cons[0],d=vdist(wpA(c),wpB(c));if(!cfg.kids&&d>j.len*1.25+6){br=true;at=wpA(c);}}
    else{const lim=cfg.kids?40:10;for(const c of j.cons){const a=wpA(c);if(Math.abs(vdist(a,wpB(c))-c.length)>lim){br=true;at=a;}}}
    if(br){removeJoint(j);if(at)spark(at.x,at.y,'#262625');}
    else{const A=j.cons[0].bodyA,B=j.cons[0].bodyB;if(A.isSleeping!==B.isSleeping){Sleeping.set(A,false);Sleeping.set(B,false);}}
  }
}
function shatter(b){
  for(let i=0;i<12&&fx.length<MAXB;i++)fx.push({k:'s',x:b.position.x+(R()-.5)*30,y:b.position.y+(R()-.5)*20,vx:(R()-.5)*7+b.parent.velocity.x*.3,vy:-R()*5,life:1000,max:1000,r:R()*PI,sz:4+R()*7});

}
function spark(x,y,c){for(let i=0;i<6&&fx.length<MAXB;i++)fx.push({k:'p',x,y,vx:(R()-.5)*4,vy:-R()*3,life:500,max:500,c})}
function fxStep(){
  for(let i=fx.length-1;i>=0;i--){
    const p=fx[i];p.life-=DT;
    if(p.k==='w'){
      p.vy+=G;p.x+=p.vx;p.y+=p.vy;
      if(p.y>0)p.life=0;
      else{const hit=Query.point(parts,p)[0];if(hit){Body.applyForce(hit.parent,{x:p.x,y:p.y},{x:p.vx*WATER_F,y:p.vy*WATER_F});Sleeping.set(hit.parent,false);p.life=0;}}
    }else if(p.k==='s'||p.k==='p'){p.vy+=G;p.x+=p.vx;p.y+=p.vy;p.r=(p.r||0)+.12;if(p.y>0){p.y=0;p.vy*=-.3;p.vx*=.6;}}

  }
}
function projStep(){
  for(const p of projs.slice()){
    p.t+=DT;
    if(p.t>(p.kind==='birne'?9000:8000)||p.b.position.y>400||Math.abs(p.b.position.x)>9000){Composite.remove(world,p.b);if(p.c)Composite.remove(world,p.c);projs.splice(projs.indexOf(p),1);}
  }
}
function logicStep(){
  const h=curH();
  hHist.push(h);if(hHist.length>40)hHist.shift();
  if(!simOnly&&hHist.length===40&&hHist[0]>0.6&&h<0.8*hHist[0]&&performance.now()-lastSlow>3500&&(mode==='destroy'||ended||refH)){slowUntil=performance.now()+1500;lastSlow=performance.now();}
  if(++sampleN>=15){sampleN=0;sampleStill();}
  if(mode==='build'&&!cfg.kids&&!ended){
    if(sampleN===0){
      const calm=parts.length>0&&!test&&!parts.some(b=>b.plugin.m.prep)&&parts.every(b=>b.plugin.m.still);
      if(calm){calmT+=15*DT;if(calmT>=3000&&!standLogged){standLogged=true;logStand(h);freezeAll();}}
      else{calmT=0;if(!test)standLogged=false;}
    }
    if(refH&&!test&&h<0.8*refH)endGame('collapse');
  }
  if(mode==='build'&&cfg.kids){netStep();if(sampleN===0){if(parts.length&&!frozen.size&&parts.every(b=>b.plugin.m.still)){calmT+=15*DT;if(calmT>=3000)freezeAll();}else if(!frozen.size)calmT=0;}}

let sampleN=0;
function sampleStill(){
  for(const b of parts){const m=b.plugin.m,p=b.position;
    const an=pAng(b);m.still=!!m.pp&&(b.parent.isSleeping||(Math.hypot(p.x-m.pp.x,p.y-m.pp.y)<1.2&&Math.abs(an-m.pp.a)<0.008));

}
function logStand(h){
  const fp=curFP(),pts=points(h,fp);
  if(lastValid&&Math.abs(lastValid.h-h)<0.03&&Math.abs(lastValid.fp-fp)<0.03){refH=h;return;}
  lastValid={h,fp,pts,plan:snapshot(),wind:false,quake:false};refH=h;
  if(!best||pts>best.pts){best=lastValid;if(!simOnly)toast(`✓ Gültig: ${pts} Punkte`);}
}
const frozen=new Set();
function freezeAll(){for(const U of new Set(parts.filter(b=>!b.plugin.m.prep).map(b=>b.parent)))if(!U.isStatic){Body.setStatic(U,true);frozen.add(U);}}

function userEdit(){unfreezeAll();calmT=0;standLogged=false;hHist=[];}
function netStep(){
  for(const b of parts.slice()){
    const m=b.plugin.m;
    if(m.hi&&b.bounds.max.y>-4){m.fall=(m.fall||0)+DT;if(m.fall>220){fx.push({k:'n',x:b.position.x,y:b.position.y,life:700,max:700});removePart(b,true);}continue;}
    if(m.still)m.hi=b.bounds.max.y<-25;
  }
}

// ---------- Stabilitätstests
function startTest(kind,chain){
  if(!lastValid||!standLogged||test)return;
  unfreezeAll();
  test={kind,chain:!!chain,t:0,plan:lastValid.plan,h0:lastValid.h,n0:parts.length,lv:lastValid,cu:connUsed};
  ghost=null;tool=null;pendingRope=null;wakeAll();renderBar();
}
function testStep(){
  test.t+=DT;const T=test.t/1000;
  if(T<5){
    if(test.kind==='wind'){const f=T/5;for(const b of parts){Body.applyForce(b.parent,b.position,{x:WIND*(b.bounds.max.y-b.bounds.min.y)*f,y:0});Sleeping.set(b.parent,false);}}
    else{const amp=5*Math.min(1,T),x=amp*Math.sin(2*PI*1.1*T),dx=x-ground.position.x;Body.setPosition(ground,{x,y:50});Body.setVelocity(ground,{x:dx,y:0});wakeAll();}
  }else if(test.kind==='quake'&&ground.position.x!==0){Body.setPosition(ground,{x:0,y:50});Body.setVelocity(ground,{x:0,y:0});}
  if(T>=7)finishTest();
}
function finishTest(){
  const h=curH(),pass=h>=0.8*test.h0&&parts.length===test.n0,t=test;
  t.lv[t.kind]=pass;
  rebuild(t.plan);connUsed=t.cu;
  Body.setPosition(ground,{x:0,y:50});Body.setVelocity(ground,{x:0,y:0});
  test=null;calmT=0;standLogged=true;hHist=[];if(mode==='build')freezeAll();
  if(t.chain&&t.kind==='wind'){startTest('quake',false);test.windRes=pass;return;}
  const nm=t.kind==='wind'?'Wind':'Erdbeben';
  if(!simOnly)toast(t.lv.wind&&t.lv.quake?'🏅 Abzeichen „sturmfest“!':(t.windRes!=null?`Wind ${t.windRes?'✓':'✗'} · Erdbeben ${pass?'✓':'✗'}`:(pass?`${nm} bestanden ✓`:`${nm} nicht bestanden`)));
  renderBar();
}

// ---------- Zerstören
function aim(){
  const bb=towerBB(),Hh=Math.max(150,bb.h);
  Object.assign(dz,{cannon:{x:bb.minX-460,y:-24},cat:{x:bb.minX-340,y:0},bowl:{x:bb.minX-400,y:-30},nozzle:{x:bb.minX-300,y:-36},wreck:{ax:(bb.minX+bb.maxX)/2,ay:-Hh-170,L:0.55*Hh+170},left:bb.minX-540,right:bb.maxX+260,th:Hh});
  if(!dz.waterAim)dz.waterAim={x:bb.minX,y:-Hh/2};
}
function startDestroy(plan,entry,kids){
  ended=false;test=null;ghost=null;tool=null;pendingRope=null;
  if(!kids){cfg=adultCfg(6);applyPhys();variant='destroy';rebuild(plan);document.body.classList.remove('kids');}

function poly(vs){ctx.beginPath();for(let i=0;i<vs.length;i++){const x=(vs[i].x-cam.x)*cam.s+W/2,y=gy+vs[i].y*cam.s;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();}
const SX=x=>(x-cam.x)*cam.s+W/2,SY=y=>gy+y*cam.s;
function drawPart(b,alpha){
  const M=MATS[b.plugin.m.mat];poly(b.vertices);
  ctx.globalAlpha=alpha==null?1:alpha;ctx.fillStyle=M.fill;ctx.fill();ctx.strokeStyle=M.stroke;ctx.lineWidth=1.5;ctx.stroke();
  if(b.plugin.m.mat==='glass'){const v=b.vertices;ctx.beginPath();const a=v[0],c=v[1];ctx.moveTo(SX(a.x+(c.x-a.x)*.2),SY(a.y+(c.y-a.y)*.2)+4*cam.s);ctx.lineTo(SX(a.x+(c.x-a.x)*.45),SY(a.y+(c.y-a.y)*.45)+4*cam.s);ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;ctx.stroke();}
  ctx.globalAlpha=1;
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#F7F5F0';ctx.fillRect(0,0,W,H);
  const s=cam.s;
  // Lineal
  ctx.font='10px -apple-system,system-ui,sans-serif';ctx.fillStyle='#A9A59B';
  let stp=1;if(100*s<26)stp=2;if(100*s<12)stp=5;
  for(let m=stp;;m+=stp){const y=gy-m*100*s;if(y<70)break;ctx.fillRect(0,y,9,1);ctx.fillText(m+' m',12,y+3.5);}
  // Rekord
  if(mode==='build'&&!cfg.kids&&recordH>0){const y=gy-recordH*100*s;if(y>64){ctx.setLineDash([6,5]);ctx.strokeStyle='#C9A800';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(44,y);ctx.lineTo(W,y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#9C8300';ctx.font='600 11px -apple-system,system-ui,sans-serif';ctx.textAlign='right';ctx.fillText('Rekord '+fmt(recordH)+' m',W-12,y-5);ctx.textAlign='left';}}
  // Boden
  const gx=ground.position.x;
  ctx.fillStyle='#ECE7DC';ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='#D3CBB9';ctx.fillRect(0,gy-1,W,2);
  ctx.strokeStyle='#DED7C8';ctx.lineWidth=1;ctx.beginPath();
  const lw=s2w(0,0).x,rw=s2w(W,0).x;for(let x=Math.floor((lw-gx)/50)*50;x<rw-gx+50;x+=50){const sx=SX(x+gx);ctx.moveTo(sx,gy+4);ctx.lineTo(sx-6,gy+12);}ctx.stroke();
  if(cfg.kids&&mode==='build'){ctx.strokeStyle='rgba(253,214,2,.55)';ctx.lineWidth=1;ctx.beginPath();for(let x=Math.floor(lw/24)*24;x<rw+24;x+=24){const sx=SX(x);ctx.moveTo(sx,gy+3);ctx.lineTo(sx+12*s,gy+15);ctx.moveTo(sx+12*s,gy+3);ctx.lineTo(sx,gy+15);}ctx.stroke();}
  // Waffe
  if(mode==='destroy'&&dz)drawWeapon();
  // Teile
  for(const b of parts)drawPart(b);
  // Verbinder
  for(const j of joints){
    const A=byId(j.a),B=byId(j.b);if(!A||!B)continue;
    if(j.t==='rope'){const a=toWorld(A,j.la),b=toWorld(B,j.lb),d=vdist(a,b),sag=Math.max(0,j.len-d)*0.5;ctx.strokeStyle='#262625';ctx.lineWidth=Math.max(1.5,2*s);ctx.beginPath();ctx.moveTo(SX(a.x),SY(a.y));ctx.quadraticCurveTo(SX((a.x+b.x)/2),SY((a.y+b.y)/2+sag),SX(b.x),SY(b.y));ctx.stroke();ctx.lineWidth=1.5;for(const q of [a,b]){ctx.fillStyle='#FDD602';ctx.beginPath();ctx.arc(SX(q.x),SY(q.y),3.5,0,7);ctx.fill();ctx.stroke();}}
    else{const P=toWorld(A,j.la),x=P.x,y=P.y,an=pAng(A);
      if(j.t==='glue'){ctx.fillStyle='#FDD602';ctx.strokeStyle='#262625';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(SX(x),SY(y),Math.max(5,9*s),Math.max(4,6*s),an,0,7);ctx.fill();ctx.stroke();}
      else{ctx.fillStyle='#262625';ctx.beginPath();ctx.arc(SX(x),SY(y),Math.max(4,6*s),0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(SX(x),SY(y),Math.max(1.5,2.2*s),0,7);ctx.fill();}}
  }
  if(mode==='build'&&tool==='rope'){ctx.lineWidth=1.3;ctx.strokeStyle='#262625';for(const b of parts)for(const l of anchorsOf(b)){const p=toWorld(b,l);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(SX(p.x),SY(p.y),3.6,0,7);ctx.fill();ctx.stroke();}}
  const prb=pendingRope&&byId(pendingRope.id);
  if(prb){const p=toWorld(prb,pendingRope.l);ctx.fillStyle='#FDD602';ctx.strokeStyle='#262625';ctx.lineWidth=2;ctx.beginPath();ctx.arc(SX(p.x),SY(p.y),7,0,7);ctx.fill();ctx.stroke();}
  // Geschosse
  for(const p of projs){
    const b=p.b,x=SX(b.position.x),y=SY(b.position.y),r=b.circleRadius*s;
    if(p.c){ctx.strokeStyle='#262625';ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(SX(p.c.pointA.x),SY(p.c.pointA.y));ctx.lineTo(x,y);ctx.stroke();ctx.setLineDash([]);}
    ctx.fillStyle=p.kind==='katapult'?'#AEB3BA':'#262625';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    if(p.kind==='bowling'){ctx.fillStyle='#FDD602';for(let i=0;i<3;i++){const a=b.angle+i*0.55-0.5;ctx.beginPath();ctx.arc(x+Math.cos(a)*r*.45,y+Math.sin(a)*r*.45,r*.13,0,7);ctx.fill();}}
  }
  // Effekte
  for(const p of fx){
    const a=Math.max(0,p.life/p.max);
    if(p.k==='w'){ctx.fillStyle='rgba(110,175,220,.75)';ctx.beginPath();ctx.arc(SX(p.x),SY(p.y),Math.max(2,4*s),0,7);ctx.fill();}
    else if(p.k==='s'){ctx.globalAlpha=a;ctx.fillStyle='rgba(166,212,240,.9)';ctx.strokeStyle='#86BEDF';const x=SX(p.x),y=SY(p.y),z=p.sz*s;ctx.beginPath();ctx.moveTo(x+Math.cos(p.r)*z,y+Math.sin(p.r)*z);ctx.lineTo(x+Math.cos(p.r+2.2)*z*.7,y+Math.sin(p.r+2.2)*z*.7);ctx.lineTo(x+Math.cos(p.r+4)*z*.8,y+Math.sin(p.r+4)*z*.8);ctx.closePath();ctx.fill();ctx.stroke();ctx.globalAlpha=1;}
    else if(p.k==='p'){ctx.globalAlpha=a;ctx.fillStyle=p.c;ctx.fillRect(SX(p.x)-2,SY(p.y)-2,4,4);ctx.globalAlpha=1;}
    else if(p.k==='n'){ctx.globalAlpha=a;ctx.strokeStyle='#E0BC00';ctx.lineWidth=3;ctx.beginPath();ctx.arc(SX(p.x),SY(p.y),(1-a)*60*s+10,0,7);ctx.stroke();ctx.globalAlpha=1;}
  }
  // Geist
  drawCom();
  if(ghost){
    const b=ghost.body,bad=ghost.free?!ghost.ok:ghost.overBar;
    if(!ghost.overBar){const ly=landingY(b),x=SX(b.position.x);ctx.setLineDash([3,4]);ctx.strokeStyle='rgba(38,38,37,.45)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x,SY(b.bounds.max.y)+2);ctx.lineTo(x,SY(ly));ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-8,SY(ly));ctx.lineTo(x+8,SY(ly));ctx.stroke();}
    drawPart(b,ghost.overBar?0.25:0.6);poly(b.vertices);ctx.setLineDash([5,4]);ctx.strokeStyle=bad?'#C0392B':'#262625';ctx.lineWidth=bad?2.2:1.5;ctx.stroke();ctx.setLineDash([]);
    if(ghost.free){
      ctx.textAlign='center';ctx.textBaseline='middle';
      for(const [ax,ay,d] of arrowPos()){const act=rotHold&&rotHold.dir===d;ctx.fillStyle=act?'#FDD602':'#fff';ctx.strokeStyle='#262625';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(ax,ay,20,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#262625';ctx.font='700 20px -apple-system,system-ui,sans-serif';ctx.fillText(d<0?'↺':'↻',ax,ay+1);}
      let deg=Math.round(ghost.angle/D2R)%360;if(deg>180)deg-=360;if(deg<=-180)deg+=360;
      ctx.font='600 12px -apple-system,system-ui,sans-serif';ctx.fillStyle='#262625';ctx.fillText(deg+'°',SX(b.position.x),SY(b.bounds.min.y)-14);
      ctx.textBaseline='alphabetic';ctx.textAlign='left';
    }
  }
  for(const p of parts)if(p.plugin.m.prep){poly(p.vertices);ctx.setLineDash([4,3]);ctx.strokeStyle='#5E9DC4';ctx.lineWidth=1.5;ctx.stroke();ctx.setLineDash([]);}
  // Hinweise
  ctx.textAlign='center';ctx.fillStyle='#8A877F';
  if(mode==='build'&&!parts.length&&!ghost){ctx.font=cfg.kids?'44px system-ui':'600 15px -apple-system,system-ui,sans-serif';ctx.fillText(cfg.kids?'👇':'Teil unten in der Leiste antippen',W/2,gy-120);}
  if(mode==='build'&&ghost&&ghost.free&&!tool){ctx.font='600 12.5px -apple-system,system-ui,sans-serif';ctx.fillText('Wischen: verschieben · zwei Finger: fein · Pfeile gedrückt halten: drehen',W/2,112);}
  if(prepOn&&mode==='build'){ctx.font='700 13px -apple-system,system-ui,sans-serif';ctx.fillStyle='#5E9DC4';ctx.fillText('❄ Vorbereitung: Teile bleiben eingefroren bis „Start“',W/2,132);ctx.fillStyle='#8A877F';}
  if(mode==='build'&&tool&&!cfg.kids){ctx.font='600 13px -apple-system,system-ui,sans-serif';ctx.fillText({glue:'Kleber: auf eine Berührstelle zweier Teile tippen',pin:'Stift: auf die Stelle tippen, an der sich zwei Teile drehen sollen',rope:pendingRope?'Seil: jetzt den zweiten Ankerpunkt antippen':'Seil: ersten Ankerpunkt antippen'}[tool],W/2,112);}
  if(test){ctx.font='700 15px -apple-system,system-ui,sans-serif';ctx.fillStyle='#262625';ctx.fillText((test.kind==='wind'?'Windtest ':'Erdbebentest ')+Math.max(0,Math.ceil(7-test.t/1000))+' s',W/2,88);}
  if(mode==='destroy'&&dz&&!dz.kids&&dz.shots===0&&!shotG){ctx.font='600 14px -apple-system,system-ui,sans-serif';ctx.fillText({kanone:'Irgendwo hinziehen, zurückziehen und loslassen',katapult:'Zurückziehen und loslassen',bowling:'Zurückziehen und loslassen',birne:'Wischen – die Birne schwingt los',wasser:'Gedrückt halten und zielen'}[dz.weapon],W/2,88);}

function drawCom(){
  if(mode!=='build'||!(cfg.kids||showCom))return;
  let M=0,x=0,y=0,mn=Infinity,mx=-Infinity;
  for(const b of parts){if(b.plugin.m.prep)continue;M+=b.mass;x+=b.position.x*b.mass;y+=b.position.y*b.mass;if(b.bounds.max.y>-3)for(const v of b.vertices)if(v.y>-3){mn=Math.min(mn,v.x);mx=Math.max(mx,v.x);}}
  if(!M)return;x/=M;y/=M;
  const ok=x>=mn&&x<=mx,c=ok?'#5FA86A':'#D9534F';
  if(mn<Infinity){ctx.fillStyle=c;ctx.globalAlpha=.55;ctx.fillRect(SX(mn),gy-3,Math.max(2,(mx-mn)*cam.s),6);ctx.globalAlpha=1;}
  ctx.setLineDash([2,4]);ctx.strokeStyle=c;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(SX(x),SY(y));ctx.lineTo(SX(x),gy);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#FDD602';ctx.strokeStyle='#262625';ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(SX(x),SY(y),7,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(SX(x)-7,SY(y));ctx.lineTo(SX(x)+7,SY(y));ctx.moveTo(SX(x),SY(y)-7);ctx.lineTo(SX(x),SY(y)+7);ctx.stroke();
}
function drawWeapon(){
  const s=cam.s,w=dz.weapon;ctx.fillStyle='#262625';ctx.strokeStyle='#262625';
  if(w==='kanone'){
    let ang=dz.aimAng;if(shotG&&shotG.s){const v=dragVel('kanone');if(Math.hypot(v.x,v.y)>1)ang=Math.atan2(v.y,v.x);}
    const x=SX(dz.cannon.x),y=SY(dz.cannon.y);ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillRect(-6*s,-11*s,46*s,22*s);ctx.restore();
    ctx.beginPath();ctx.arc(x,y+6*s,17*s,0,7);ctx.fill();ctx.fillStyle='#FDD602';ctx.beginPath();ctx.arc(x,y+6*s,6*s,0,7);ctx.fill();
  }else if(w==='katapult'){
    const x=SX(dz.cat.x),y=SY(0);ctx.fillRect(x-40*s,y-10*s,80*s,10*s);
    const t=dz.catT?Math.min(1,(performance.now()-dz.catT)/250):1,a=-PI/2-0.6+(1-t)*1.0;
    ctx.lineWidth=7*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+20*s,y-10*s);ctx.lineTo(x+20*s+Math.cos(a)*80*s,y-10*s+Math.sin(a)*80*s);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+20*s,y-10*s);ctx.lineTo(x+40*s,y-40*s);ctx.stroke();ctx.lineCap='butt';
    if(t>=1){ctx.fillStyle='#AEB3BA';ctx.beginPath();ctx.arc(SX(dz.cat.x+14),SY(-78),22*s,0,7);ctx.fill();}
  }else if(w==='bowling'){
    if(!projs.some(p=>p.kind==='bowling'&&p.t<1500)){const x=SX(dz.bowl.x),y=SY(-30);ctx.beginPath();ctx.arc(x,y,30*s,0,7);ctx.fill();}

  }else if(w==='birne'){
    const {ax,ay,L}=dz.wreck;ctx.fillRect(SX(ax)-24*s,SY(ay)-8*s,48*s,8*s);
    if(!projs.some(p=>p.kind==='birne')){const a=65*D2R,bx=ax-L*Math.sin(a),by=ay+L*Math.cos(a);ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(SX(ax),SY(ay));ctx.lineTo(SX(bx),SY(by));ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(SX(bx),SY(by),34*s,0,7);ctx.fill();}
  }else if(w==='wasser'){

    ctx.save();ctx.translate(SX(n.x),SY(n.y));ctx.rotate(a);ctx.fillStyle='#5E9DC4';ctx.fillRect(-4*s,-7*s,30*s,14*s);ctx.restore();
  }

  }else if(mode==='build'&&cfg.kids){
    h+='<div class="grp">'+MAT_ORDER.map(m=>`<div class="mat ${sel.mat===m?'on':''}" data-mat="${m}"><i style="background:${MATS[m].fill};box-shadow:inset 0 0 0 1.5px ${MATS[m].stroke}"></i></div>`).join('')+'</div><div class="sep"></div>';
    h+='<div class="grp">'+KIDS_SHAPES.map(s=>`<div class="tile ${sel.shape===s&&!tool?'on':''}" data-shape="${s}">${shapeIcon(s,sel.mat)}</div>`).join('')+'</div><div class="sep"></div>';
    h+=`<button class="kbtn ${tool==='glue'?'on':''}" data-tool="glue">${ICON.glue}</button><button class="kbtn" id="kUndo">↶</button><div class="sep"></div>`;
    h+=`<button class="kbtn" id="kBoom">💥</button>`;
  }else if(mode==='destroy'&&dz){
    if(dz.kids)h+=`<button class="kbtn" id="kBack">🏗️</button><div class="sep"></div>`;
    h+='<div class="grp">'+WEAPONS.map(([k,n])=>`<div class="tile ${dz.weapon===k?'on':''}" data-weapon="${k}">${ICON[k]}${dz.kids?'':`<span>${n}</span>`}</div>`).join('')+'</div>';
    if(dz.kids)h+=`<div class="sep"></div><button class="kbtn" id="kUndo">↶</button>`;
  }
  barEl.innerHTML=h;layout();
  barEl.querySelectorAll('[data-mat]').forEach(el=>el.onclick=()=>{sel.mat=el.dataset.mat;tool=null;pendingRope=null;renderBar();});
  barEl.querySelectorAll('[data-shape]').forEach(el=>el.addEventListener('click',()=>{
    if(!cfg.kids&&!(ended||test||overlayOpen())){sel.shape=el.dataset.shape;tool=null;pendingRope=null;barEl.querySelectorAll('[data-shape],[data-tool]').forEach(x=>x.classList.toggle('on',x===el));newGhost({shape:sel.shape,mat:sel.mat});}
  }));
  barEl.querySelectorAll('[data-shape]').forEach(el=>el.addEventListener('pointerdown',e=>{
    if(!cfg.kids)return;
    e.preventDefault();if(ended||test||overlayOpen())return;
    sel.shape=el.dataset.shape;tool=null;pendingRope=null;
    barEl.querySelectorAll('[data-shape],[data-tool]').forEach(x=>x.classList.toggle('on',x===el));
    if(!cfg.kids){newGhost({shape:sel.shape,mat:sel.mat});return;}
    startGhost({shape:sel.shape,mat:sel.mat},e,{fromPalette:true});
  }));
  barEl.querySelectorAll('[data-g]').forEach(el=>el.addEventListener('click',e=>{
    if(ended||test||overlayOpen())return;
    const g=el.dataset.g,[s,m]=g.split('-');sel={shape:s,mat:m,d:g};tool=null;pendingRope=null;
    barEl.querySelectorAll('[data-g],[data-tool]').forEach(x=>x.classList.toggle('on',x===el));
    if(dailyLeft(g)<=0){toast('Davon ist nichts mehr übrig');return;}
    newGhost({shape:s,mat:m,d:g});
  }));
  barEl.querySelectorAll('[data-tool]').forEach(el=>el.onclick=()=>{if(test)return;tool=tool===el.dataset.tool?null:el.dataset.tool;pendingRope=null;renderBar();});
  barEl.querySelectorAll('[data-weapon]').forEach(el=>el.onclick=()=>{dz.weapon=el.dataset.weapon;dz.waterOn=false;renderBar();});
  const on=(id,f)=>{const el=$('#'+id);if(el)el.onclick=f;};
  on('bUndo',undo);on('bCom',()=>{showCom=!showCom;store.set('mrise.com',showCom);renderBar();});
  on('tWind',()=>startTest('wind',true));
  on('kUndo',undo);
  on('kBoom',()=>{if(!parts.length)return;startDestroy(snapshot(),null,true);});
  on('kBack',()=>{clearProjs();dz=null;mode='build';renderTop();renderBar();});
  const k=$('#knob');
  if(k)k.addEventListener('pointerdown',e=>{e.preventDefault();const r=k.getBoundingClientRect();knobG={pid:e.pointerId,c:[r.left+r.width/2,r.top+r.height/2],s0:[e.clientX,e.clientY],moved:false};});
  renderDailyCounts();updFab();
}
function setKidsLevel(l){
  kidsLevel=l;store.set('mrise.kids',l);cfg=kidsCfg(l);applyPhys();
  for(const b of parts){const M=MATS[b.plugin.m.mat];b.friction=Math.min(2,M.friction*cfg.fric);b.frictionStatic=Math.min(2.5,M.friction*cfg.fric*1.3);}
  for(const U of new Set(parts.map(b=>b.parent)))if(U.parts.length>1){let M=0,f=0;unitPieces(U).forEach(b=>{M+=b.mass;f+=b.friction*b.mass});U.friction=f/M;U.frictionStatic=Math.min(2.5,f/M*1.3);}
  renderTop();renderBar();
}
function updBudget(){const b=$('#bud');if(b)b.textContent=cfg.budget===Infinity?'∞':cfg.budget-connUsed;}
function renderDailyCounts(){if(variant!=='daily'||mode!=='build'||!daily)return;barEl.querySelectorAll('[data-c]').forEach(el=>{const n=dailyLeft(el.dataset.c);el.textContent=n;el.parentNode.classList.toggle('off',n<=0);});}
let uiLast=0;
function uiTick(t){
  if(t-uiLast<120)return;uiLast=t;
  const set=(id,v,cls)=>{const el=document.getElementById(id);if(el){if(el.textContent!==v)el.textContent=v;if(cls!=null)el.className=cls;}};
  if(mode==='build'&&!cfg.kids){
    const h=curH(),fp=curFP(),p=points(h,fp);
    set('sH',fmt(h)+' m');set('sF',fp?fmt(fp,2)+' m':'–');
    if(standLogged&&lastValid)set('sP',lastValid.pts+' ✓','');
    else if(parts.length&&calmT>0)set('sP',p+' · '+Math.ceil((3000-calmT)/1000)+' s','dim');
    else set('sP',parts.length?String(p):'–','dim');
    set('sB',best?best.pts+(best.wind&&best.quake?' 🏅':''):'–');
    const ok=!!(lastValid&&standLogged&&!test);
    const tw=$('#tWind');if(tw)tw.disabled=!ok;
    set('okW',lastValid?(lastValid.wind?'✓':'·')+(lastValid.quake?'✓':'·'):'');
    updBudget();renderDailyCounts();
    const fd=$('#fDrop');if(fd&&ghost&&ghost.free)fd.disabled=!ghost.ok;
  }else if(mode==='destroy'&&dz&&!dz.kids){
    set('sS',String(dz.shots));set('sH',fmt(curH())+' m');set('sZ',dz.h0?fmt(dz.h0*0.25)+' m':'–');
  }
}

// ---------- Overlays
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function showMenu(){
  const inGame=mode!=='menu';
  overlay(`<div class="card"><div class="mhead">${logoSvg()}<div><div class="mt">mRise</div><div class="ms">Bau hoch. Steh schmal.</div></div></div>
  ${inGame?'<button class="btn wide g" data-a="resume">Weiterspielen</button>':''}
  <button class="btn wide" data-a="free">Frei bauen</button>
  <button class="btn wide" data-a="daily">Tagesturm · ${dlabel()}</button>
  <button class="btn wide" data-a="destroy">Zerstören</button>
  <button class="btn wide y" data-a="kids">Kindermodus</button>
  <button class="btn wide g" data-a="board">Bestenliste</button>
  <p>Punkte = 10 · Höhe² ÷ Stellfläche. Ein Stand zählt, wenn alle Teile 3 Sekunden ruhig stehen. Drehen: Drehknopf, Mausrad, Taste R oder zweiter Finger.</p></div>`);
}
function boardLists(){return {all:store.get('mrise.board',[]),sturm:store.get('mrise.sturm',[]),today:store.get('mrise.daily.'+dkey(),[])}}
function showBoard(tab,pick){
  tab=tab||'all';const L=boardLists()[tab];
  const rows=L.length?L.map((e,i)=>`<div class="li"><div class="rk">${i+1}</div><div class="nm"><b>${esc(e.name)}${e.sturmfest?' 🏅':''}</b><span>${fmt(e.h)} m · ${fmt(e.fp,2)} m${e.shots?` · 💥 ${e.shots}`:''}</span></div><div class="pt">${e.pts}</div><button class="mini" data-a="kill" data-tab="${tab}" data-i="${i}" title="Zerstören">💥</button></div>`).join(''):`<div class="empty">${tab==='today'?'Heute noch kein Tagesturm.':tab==='sturm'?'Noch kein sturmfester Turm.':'Noch keine Türme gespeichert.'}</div>`;
  overlay(`<div class="card"><h2>${pick?'Turm zum Zerstören wählen':'Bestenliste'}</h2>
  <div class="tabs"><button class="${tab==='all'?'on':''}" data-a="tab" data-t="all">Alle</button><button class="${tab==='sturm'?'on':''}" data-a="tab" data-t="sturm">Sturmfest</button><button class="${tab==='today'?'on':''}" data-a="tab" data-t="today">Heute</button></div>
  <div class="list">${rows}</div>
  ${pick?'<button class="btn wide g" data-a="demo">Beispielturm zerstören</button>':''}
  <button class="btn wide g" data-a="menu">Zurück</button></div>`);
  ovEl.dataset.pick=pick?'1':'';
}
function showEnd(reason){
  const b=best;let h=`<div class="card"><h2>${reason==='collapse'?'Eingestürzt!':'Fertig!'}</h2>`;
  if(!b){
    h+=`<p>Noch kein gültiger Stand. Ein Stand zählt, wenn alle Teile 3 Sekunden ruhig stehen.</p>${reason==='done'?'<button class="btn wide y" data-a="resume2">Weiter bauen</button>':''}<div class="row2"><button class="btn g" data-a="again">Nochmal</button><button class="btn g" data-a="menu">Menü</button></div>`;
  }else{
    const st=b.wind&&b.quake;
    h+=`<p>Bester Stand${st?'<span class="badge">🏅 sturmfest</span>':''}</p><div class="big3"><div><span>Höhe</span><b>${fmt(b.h)} m</b></div><div><span>Stellfläche</span><b>${fmt(b.fp,2)} m</b></div><div><span>Punkte</span><b>${b.pts}</b></div></div>`;
    if(!b.saved)h+=`<input class="name" id="nm" maxlength="18" placeholder="Name für die Bestenliste" value="${esc(store.get('mrise.name',''))}"><button class="btn wide y" data-a="save">Speichern</button>`;
    else h+=`<p>${b.saved}</p>`;
    if(reason==='done')h+='<button class="btn wide g" data-a="resume2">Weiter bauen</button>';
    h+=`<div class="row2"><button class="btn g" data-a="again">Nochmal</button><button class="btn g" data-a="killbest">Zerstören</button><button class="btn g" data-a="menu">Menü</button></div>`;
  }
  overlay(h+'</div>');ovEl.dataset.reason=reason;
}
function saveBest(name){
  const b=best;if(!b||b.saved)return;
  name=(name||'').trim()||'Baumeister';store.set('mrise.name',name);
  const e={id:Date.now().toString(36)+Math.floor(R()*1e6).toString(36),name,pts:b.pts,h:+b.h.toFixed(3),fp:+b.fp.toFixed(3),sturmfest:!!(b.wind&&b.quake),date:new Date().toISOString(),mode:variant,plan:b.plan};
  b.entry=e;
  const key=variant==='daily'?'mrise.daily.'+dkey():'mrise.board';
  const ins=k=>{const l=store.get(k,[]);l.push(e);l.sort((x,y)=>y.pts-x.pts);const r=l.indexOf(e);store.set(k,l.slice(0,20));return r;};
  const r=ins(key);if(e.sturmfest)ins('mrise.sturm');
  b.saved=r<20?`Gespeichert – Platz ${r+1}${variant==='daily'?' im Tagesturm':''}.`:'Gespeichert, aber nicht in den Top 20.';
  recordH=calcRecord();
}
function showWin(){
  overlay(`<div class="card"><h2>Umgeworfen!</h2><div class="big3"><div><span>Schüsse</span><b>${dz.shots}</b></div><div><span>Turmhöhe vorher</span><b>${fmt(dz.h0)} m</b></div></div>
  ${dz.entry&&dz.entry.name?`<p>Turm von ${esc(dz.entry.name)}</p>`:''}
  <div class="row2"><button class="btn y" data-a="rekill">Nochmal</button><button class="btn g" data-a="board">Bestenliste</button><button class="btn g" data-a="menu">Menü</button></div></div>`);
}
ovEl.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a;
  if(a==='resume'){if(mode==='menu')return;hideOverlay();}
  else if(a==='resume2'){ended=false;hideOverlay();}
  else if(a==='free'||a==='daily'||a==='kids')startBuild(a);
  else if(a==='destroy'){const l=boardLists();if(l.all.length||l.today.length)showBoard('all',true);else{startDestroy(demoPlan(),null,false);toast('Beispielturm geladen');}}
  else if(a==='board')showBoard('all',false);
  else if(a==='tab')showBoard(t.dataset.t,ovEl.dataset.pick==='1');
  else if(a==='menu')showMenu();
  else if(a==='demo')startDestroy(demoPlan(),null,false);
  else if(a==='kill'){const e2=boardLists()[t.dataset.tab][+t.dataset.i];if(e2&&e2.plan)startDestroy(e2.plan,e2,false);}
  else if(a==='save'){saveBest($('#nm').value);showEnd(ovEl.dataset.reason);}
  else if(a==='again')startBuild(variant==='destroy'?'free':variant);
  else if(a==='killbest'){if(best)startDestroy(best.plan,best.entry||null,false);}
  else if(a==='rekill')startDestroy(dz.plan,dz.entry,false);
});
ovEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm'){saveBest(e.target.value);showEnd(ovEl.dataset.reason);}});

$('#fDrop').onclick=dropGhost;$('#fPrep').onclick=()=>{if(test||ended)return;if(prepOn)startPrep();else{prepOn=true;updFab();}};$('#fCancel').onclick=cancelGhost;

// ---------- Schleife
function layout(){gy=H-barEl.offsetHeight-18;}
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);layout();}
window.addEventListener('resize',resize);
let last=performance.now(),acc=0,raf=0;
function frame(t){
  raf=requestAnimationFrame(frame);
  const dt=Math.min(100,t-last);last=t;
  acc+=dt*(t<slowUntil?0.3:1);let n=0;
  while(acc>=DT&&n<4){step();acc-=DT;n++;}
  if(n>=4)acc=0;
  if(rotHold&&ghost&&ghost.free){rotHold.t+=dt;const sp=Math.min(160,6+150*rotHold.t/1000)*D2R*dt/1000*rotHold.dir;ghost.angle+=sp;rotHold.tot+=sp;ghostRefresh();}
  updCam();draw();uiTick(t);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;}else if(!raf){last=performance.now();acc=0;raf=requestAnimationFrame(frame);}});

// ---------- Test-Hook
window.mriseTest={
  buildStack(n=5,material='wood'){startBuild('free');for(let i=0;i<n;i++)addPart('sq',material,1,0,-30-60*i,0);userEdit();return parts.length;},
  simulate(sec){simOnly=true;const n=Math.round(sec*1000/DT);for(let i=0;i<n;i++)step();simOnly=false;return this.score();},
  score(){const h=curH(),fp=curFP();return {height:+h.toFixed(3),footprint:+fp.toFixed(3),points:points(h,fp),formula:fp?+(10*h*h/fp).toFixed(2):0,valid:!!(standLogged&&lastValid),best:best&&{h:+best.h.toFixed(3),fp:+best.fp.toFixed(3),pts:best.pts},parts:parts.length,mode,ended};},
  fire(weapon,angle,power=1){
    if(mode!=='destroy')startDestroy(snapshot(),null,false);
    if(dz.settling){dz.settling=false;dz.h0=Math.max(curH(),0.01);aim();}
    const sp=VMAX[weapon]*power;
    if(weapon==='wasser'){const a=(angle==null?15:angle)*D2R;dz.waterAim={x:dz.nozzle.x+Math.cos(a)*500,y:dz.nozzle.y-Math.sin(a)*500};dz.waterOn=true;dz.waterT=1500*power;dz.shots++;return {angle:angle};}
    let a=angle;if(a==null){const bb=towerBB();a=autoAngle(sp,launchOrigin(weapon),{x:(bb.minX+bb.maxX)/2,y:-bb.h*0.2});}
    fireWeapon(weapon,{x:Math.cos(a*D2R)*sp,y:-Math.sin(a*D2R)*sp});
    return {angle:+a.toFixed(2),shots:dz.shots,h0:dz.h0};
  },
  ghost:{newGhost,dropGhost,startPrep,get g(){return ghost},setPrep(v){prepOn=v}},
  frozen(){return frozen.size},
  w2s(x,y){return [SX(x),SY(y)]},
  state(){return {mode,variant,parts:parts.length,joints:joints.length,projs:projs.length,fx:fx.length,shots:dz&&dz.shots,done:dz&&dz.done}},
  api:{engine,startBuild,startDestroy,startTest,snapshot,rebuild,addPart,makeWeld,makeRope,curH,curFP,demoPlan,get parts(){return parts},get joints(){return joints},get lastValid(){return lastValid}}
};

// ---------- Start
resize();
rebuild(demoPlan());renderTop();renderBar();showMenu();
raf=requestAnimationFrame(frame);
})();
</script>
</body>
