<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141518">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>mHash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one-screen app, hub list -> game board; dark single-theme arcade look */
:root{
  --bg:#141518; --panel:#24262b; --tile:#34363c; --tile-edge:#232428;
  --fg:#f3f1ea; --muted:#9a9ca3;
  --green:#4c8a12; --green-edge:#2f5a08;
  --yellow:#e5a600; --yellow-edge:#9a6f00;
  --accent:#f0b429; --accent-edge:#a87a12;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-weight:800;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding-block:14px}
.ibtn{width:46px;height:44px;border-radius:9px;background:var(--panel);border:2px solid var(--accent);
  box-shadow:0 4px 0 var(--accent-edge);display:grid;place-items:center;font-size:22px;flex:none}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-edge)}
.logo{font-family:var(--display);font-size:30px;letter-spacing:.5px;line-height:1;flex:1;display:flex;align-items:center;gap:8px}
.logo b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--bg);font-size:24px;transform:rotate(-6deg)}
.coins{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:999px;padding:5px 14px 5px 5px;font-variant-numeric:tabular-nums;font-size:17px}
.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe27a,var(--accent) 60%,var(--accent-edge));border:2px solid #ffd54a}
[hidden]{display:none!important}

/* Hub */
.hub{flex:1;overflow:auto;padding-block:8px 24px;display:flex;flex-direction:column;gap:14px}
.hub h1{font-family:var(--display);font-weight:400;font-size:26px;margin:6px 0 2px}
.hub p{margin:0;color:var(--muted);font-weight:600}
.game{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:14px;padding:14px;border:0;text-align:left;width:100%}
.game .ic{width:62px;height:62px;border-radius:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:7px;background:var(--bg);flex:none}
.game .ic i{border-radius:3px;background:var(--tile)}
.game .ic i.g{background:var(--green)}.game .ic i.y{background:var(--yellow)}.game .ic i.e{background:transparent}
.game .t{flex:1;min-width:0}
.game .t strong{font-family:var(--display);font-weight:400;font-size:22px;display:block}
.game .t span{color:var(--muted);font-weight:600;font-size:14px}
.game .go{background:var(--accent);color:var(--bg);border-radius:10px;padding:8px 14px;font-weight:900}
.game.soon{opacity:.45;cursor:default}
.game.soon .go{background:var(--tile);color:var(--muted)}

/* Game */
.play{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0}
.level{color:var(--muted);font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.moves{font-family:var(--display);font-size:clamp(28px,7.5vw,38px);margin:8px 0 0;font-weight:400}
.moves span{color:#7bc11c}
.moves.low span{color:#ff6b4a}
.boardwrap{flex:1;display:grid;place-items:center;width:100%;min-height:0}
.board{--s:min(17vw,84px,11vh);display:grid;grid-template-columns:repeat(5,var(--s));grid-template-rows:repeat(5,var(--s));gap:calc(var(--s)*.12);touch-action:none}
.cell{position:relative}
.tile{position:absolute;inset:0;border-radius:calc(var(--s)*.1);background:var(--tile);box-shadow:0 calc(var(--s)*.1) 0 var(--tile-edge);
  display:grid;place-items:center;font-family:var(--body);font-weight:900;font-size:calc(var(--s)*.56);cursor:grab;transition:background .25s,box-shadow .25s}
.tile.g{background:var(--green);box-shadow:0 calc(var(--s)*.1) 0 var(--green-edge);cursor:default}
.tile.y{background:var(--yellow);box-shadow:0 calc(var(--s)*.1) 0 var(--yellow-edge)}
.tile.sel{outline:3px solid var(--fg);outline-offset:2px}
.tile.over{outline:3px dashed var(--fg);outline-offset:2px}
.tile.lifted{opacity:.25}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);box-shadow:0 12px 24px rgba(0,0,0,.5)!important;width:var(--s);height:var(--s);inset:auto}
.win .tile{animation:hop .5s ease both}
@keyframes hop{40%{transform:translateY(-14px)}}
.hint{width:100%;margin:10px 0 18px;padding:14px;border-radius:12px;background:var(--panel);border:2px solid var(--accent);box-shadow:0 5px 0 var(--accent-edge);
  font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px}
.hint small{font-weight:700;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:4px}
.hint small .coin{width:16px;height:16px}
.hint:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-edge)}

/* Overlays */
.ov{position:fixed;inset:0;background:rgba(10,10,12,.78);display:grid;place-items:center;z-index:60;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border-radius:18px;padding:22px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.card h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;text-wrap:balance}
.card p,.card li{font-weight:600;line-height:1.45;color:#d9d7d0;margin:0}
.card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.stars{font-size:38px;letter-spacing:6px;text-align:center;color:var(--accent)}
.stars .off{color:var(--tile)}
.words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.words span{background:var(--green);border-radius:8px;padding:6px 10px;letter-spacing:.12em;font-weight:900}
.words.lost span{background:var(--tile)}
.row{display:flex;gap:10px}
.btn{flex:1;padding:13px;border-radius:12px;border:0;background:var(--accent);color:var(--bg);font-weight:900;font-size:17px;box-shadow:0 4px 0 var(--accent-edge)}
.btn.alt{background:var(--tile);color:var(--fg);box-shadow:0 4px 0 var(--tile-edge)}
.menu .btn{flex:none;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:800;z-index:70;transition:opacity .3s;max-width:calc(100% - 32px);text-align:center}
.datebar{display:flex;align-items:center;gap:8px;width:100%;margin-top:2px}
.nav{width:40px;height:40px;border-radius:10px;border:0;background:var(--panel);font-size:22px;display:grid;place-items:center;flex:none}
.nav:disabled{opacity:.3;cursor:default}
.datebtn{flex:1;min-width:0;height:40px;border-radius:10px;border:0;background:var(--panel);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;white-space:nowrap;overflow:hidden}
.pill{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--bg)}
.pill.past{background:var(--tile);color:var(--fg)}.pill.future{background:#5b6bd6;color:#fff}
.status{min-height:22px;color:var(--muted);font-weight:700;font-size:14px;margin-top:4px;text-align:center}
.status .st{color:var(--accent);letter-spacing:2px}
.board.locked .tile{cursor:default}
.hint:disabled{opacity:.4}
.cal-head{display:flex;align-items:center;gap:8px}
.cal-head h2{flex:1;text-align:center;font-size:24px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;color:var(--muted);font-size:12px;font-weight:800;padding-bottom:2px}
.cal button{aspect-ratio:1;border-radius:9px;border:0;background:var(--tile);font-weight:900;font-size:15px;position:relative;display:grid;place-items:center;padding:0}
.cal button.won{background:var(--green)}
.cal button.play{background:var(--yellow);color:var(--bg)}
.cal button.lost{background:#5a2f2a}
.cal button.today{outline:3px solid var(--fg);outline-offset:1px}
.cal button.cur{box-shadow:inset 0 0 0 3px var(--accent)}
.cal button:disabled{background:transparent;color:#4a4c52;cursor:default}
.cal button small{position:absolute;bottom:2px;left:0;right:0;font-size:8px;color:#ffe27a;letter-spacing:1px;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);font-weight:700}
.prog{color:var(--muted)!important;font-size:14px;text-align:center}
.logo{min-width:0;overflow:hidden;white-space:nowrap}
@media (max-width:440px){header{gap:7px}.logo{font-size:24px}.coins{padding:4px 10px 4px 4px;font-size:15px}.coins .coin{width:20px;height:20px}.ibtn{width:40px;height:40px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

ATERFELGEKAMELFEIGE","HAFERWIESEBASISREISE","WESPEPAKETREGALOPFER","ZWERGSIRUPZWEIGBRAUT","BIBERSTALLKISTEKELLE","KLAUEERBSEALARMWURST","KOMETSTIELSORTESEGEL","SCHALKANTESCHAFSAITE","KANNESTADTPASTAGNADE","STIERGEISTOTTERFERSE","LINIEKERZEFIBELMINZE","RADIOAMSELPALMETIGER","NADELDECKEGABELHECKE","PILOTINSELBIENEHOBEL","PFOTEFIRMAPFEILSTAMM","SALATAPFELKAPPERASEN","RUINESPIELSUPPEENGEL","HUMORMEISENUDELTOAST","RATTEPFERDHARFESTURM","TRAUMKNOPFKRANZTULPE","BOGENDISCOKOPIETEICH","KABELSTROMPARTYBETON","HERDEBRIEFLEHREADLER","STERNFARBEATLASKREBS","HALLEFISCHMAGIEBLICK","NIEREMESSEVIDEOFRUST","FOLIEBLUSEWOLLEKIOSK","GLEISACKERFLUCHEIMER","LUCHSSPORTPUPPEAHORN","WELLESPATZTEMPOBLITZ","QUARKZIEGEMUSIKFRAGE","TINTESTAHLLISTESTUHL","TORTEMILCHNOTIZSTOCK","RUDERGEIGEPUDELMENGE","HOTELSTIFTMOTTESEIFE","RAUPETHRONDACHSSPION","KLANGAMPELBLUMEONKEL","BLECHRIESEKLEIDECHSE","DOHLEKETTEVOGELPLATZ","MIETEESSIGLINSESTEIN","LIEBELEINEBIBELEBENE","TRICKPFLUGKRAFTSCHUH","LAMPEKELCHDATENSPECK"];
const START = [2026, 10, 1]; // 1. November 2026 = Rätsel Nr. 1 (Monat 0-basiert)
const MOVES = 12, SCRAMBLE = 9, HINT_COST = 150;

/* Felder der #-Form: Zeilen 1,3 und Spalten 1,3 eines 5x5-Gitters */
const CELLS = [];
for (let r=0;r<5;r++) for (let c=0;c<5;c++) if (r===1||r===3||c===1||c===3) CELLS.push(r*5+c);
const LINES = [[5,6,7,8,9],[15,16,17,18,19],[1,6,11,16,21],[3,8,13,18,23]]; // H1,H2,V1,V2

const store = {
  get(k,d){try{const v=localStorage.getItem('mlogic.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('mlogic.'+k,JSON.stringify(v))}catch(e){}}
};
let coins = store.get('coins', 500);
let days = store.get('days', {});   // dayIdx -> {b, m, s:'play'|'won'|'lost', r:rewarded, st:stars}
let dayIdx = 0, state = null, selected = null, drag = null;

const $ = id => document.getElementById(id);
const DAY = 86400000;
const utc = (y,m,d) => Date.UTC(y,m,d);
const START_UTC = utc(...START);
function todayIdx(){const n=new Date();return Math.round((utc(n.getFullYear(),n.getMonth(),n.getDate())-START_UTC)/DAY)}
function dateOf(i){return new Date(START_UTC+i*DAY)}
const fmtLong = new Intl.DateTimeFormat('de-DE',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
const fmtMonth = new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric',timeZone:'UTC'});
const LAST = PUZZLES.length-1;

function setCoins(n){coins=n;store.set('coins',n);$('coins').textContent=n.toLocaleString('de-DE')}
function saveDays(){store.set('days',days)}

/* Seeded Zufall: jeder Tag hat immer dieselbe Startaufstellung */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function solutionOf(p){
  const s={};
  [0,5,10,15].forEach((o,i)=>LINES[i].forEach((cell,j)=>s[cell]=p[o+j]));
  return s;
}
function greens(b,s){return CELLS.filter(c=>b[c]===s[c]).length}
function scramble(sol,seed){
  const R=rng(seed*7919+13);
  for(let tries=0;tries<500;tries++){
    const b={...sol}; let n=0,guard=0;
    while(n<SCRAMBLE&&guard++<200){
      const a=CELLS[R()*16|0], d=CELLS[R()*16|0];
      if(a===d||b[a]===b[d]) continue;
      [b[a],b[d]]=[b[d],b[a]]; n++;
    }
    const g=greens(b,sol); if(g>=2&&g<=4) return b;
  }
  return {...sol};
}
const pack = b => CELLS.map(c=>b[c]).join('');
const unpack = s => {const b={};CELLS.forEach((c,i)=>b[c]=s[i]);return b};

function openDay(i){
  dayIdx=Math.max(0,Math.min(LAST,i)); selected=null;
  const p=PUZZLES[dayIdx], sol=solutionOf(p), start=scramble(sol,dayIdx+1);
  const d=days[dayIdx];
  state={p,sol,start,board:d?unpack(d.b):{...start},moves:d?d.m:MOVES,status:d?d.s:'new'};
  render();
}
function persist(){
  const prev=days[dayIdx]||{};
  days[dayIdx]={...prev,b:pack(state.board),m:state.moves,s:state.status==='new'?'play':state.status};
  saveDays();
}

function colors(){
  const {board,sol}=state, col={};
  CELLS.forEach(c=>{if(board[c]===sol[c]) col[c]='g'});
  const pools=LINES.map(line=>{const m={};line.forEach(c=>{if(col[c]!=='g')m[sol[c]]=(m[sol[c]]||0)+1});return m});
  CELLS.forEach(c=>{
    if(col[c]) return;
    for(let i=0;i<4;i++){
      if(!LINES[i].includes(c)) continue;
      if(pools[i][board[c]]>0){pools[i][board[c]]--;col[c]='y';break}
    }
  });
  return col;
}
const finished = () => state.status==='won'||state.status==='lost';

function render(){
  const b=$('board'); b.innerHTML=''; b.classList.remove('win'); b.classList.toggle('locked',finished());
  const col=colors();
  for(let i=0;i<25;i++){
    const cell=document.createElement('div'); cell.className='cell';
    if(CELLS.includes(i)){
      const t=document.createElement('div');
      t.className='tile '+(col[i]||''); t.dataset.i=i; t.textContent=state.board[i];
      t.setAttribute('role','button'); t.setAttribute('aria-label','Buchstabe '+state.board[i]);
      cell.appendChild(t);
    }
    b.appendChild(cell);
  }
  $('moves').innerHTML='<span>'+state.moves+'</span> '+(state.moves===1?'Zug':'Züge')+' übrig';
  $('moves').classList.toggle('low',state.moves<=3);
  const t=todayIdx();
  $('dateLbl').textContent=fmtLong.format(dateOf(dayIdx))+' · Nr. '+(dayIdx+1);
  const pill=$('pill');
  pill.textContent=dayIdx===t?'Heute':dayIdx<t?'Nachholen':'Vorziehen';
  pill.className='pill'+(dayIdx<t?' past':dayIdx>t?' future':'');
  $('prevDay').disabled=dayIdx<=0; $('nextDay').disabled=dayIdx>=LAST;
  const d=days[dayIdx];
  $('status').innerHTML = state.status==='won' ? 'Gelöst <span class="st">'+'★'.repeat(d?.st||0)+'</span> · Menü → neu starten zum Üben'
    : state.status==='lost' ? 'Nicht geschafft · Menü → neu starten'
    : '';
  $('hint').disabled=finished();
}

function tileEl(i){return document.querySelector('.tile[data-i="'+i+'"]')}
function swap(a,d,free){
  if(finished()||a===d) return;
  const ra=tileEl(a).getBoundingClientRect(), rd=tileEl(d).getBoundingClientRect();
  [state.board[a],state.board[d]]=[state.board[d],state.board[a]];
  if(!free) state.moves--;
  if(state.status==='new') state.status='play';
  const won=greens(state.board,state.sol)===16;
  if(won) state.status='won'; else if(state.moves<=0) state.status='lost';
  persist(); render();
  [[a,rd,ra],[d,ra,rd]].forEach(([i,from,to])=>{
    const el=tileEl(i); el.style.transition='none';
    el.style.transform='translate('+(from.left-to.left)+'px,'+(from.top-to.top)+'px)';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transition='transform .22s ease, background .25s, box-shadow .25s';el.style.transform=''}));
  });
  if(won) setTimeout(win,350); else if(state.status==='lost') setTimeout(lose,350);
}

/* Drag & Drop + Antippen */
$('board').addEventListener('pointerdown',e=>{
  const t=e.target.closest('.tile'); if(!t||t.classList.contains('g')||finished()) return;
  e.preventDefault();
  drag={i:+t.dataset.i,el:t,x:e.clientX,y:e.clientY,ghost:null,over:null};
});
window.addEventListener('pointermove',e=>{
  if(!drag) return;
  if(!drag.ghost&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){
    const g=drag.el.cloneNode(true); g.classList.add('ghost'); g.classList.remove('sel');
    $('board').appendChild(g); drag.ghost=g; drag.el.classList.add('lifted'); clearSel();
  }
  if(drag.ghost){
    drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px';
    const under=document.elementFromPoint(e.clientX,e.clientY)?.closest('.tile:not(.ghost)');
    if(drag.over&&drag.over!==under) drag.over.classList.remove('over');
    drag.over=under&&!under.classList.contains('g')&&under!==drag.el?under:null;
    drag.over?.classList.add('over');
  }
});
window.addEventListener('pointerup',()=>{
  if(!drag) return;
  const d=drag; drag=null;
  if(d.ghost){
    d.ghost.remove(); d.el.classList.remove('lifted'); d.over?.classList.remove('over');
    if(d.over) swap(d.i,+d.over.dataset.i);
  } else {
    if(selected===null){selected=d.i;d.el.classList.add('sel')}
    else if(selected===d.i) clearSel();
    else {const s=selected;selected=null;swap(s,d.i)}
  }
});
window.addEventListener('pointercancel',()=>{if(drag){drag.ghost?.remove();drag.el.classList.remove('lifted');drag.over?.classList.remove('over');drag=null}});
function clearSel(){selected=null;document.querySelectorAll('.tile.sel').forEach(t=>t.classList.remove('sel'))}

$('hint').addEventListener('click',()=>{
  if(finished()) return;
  if(coins<HINT_COST){toast('Nicht genug Münzen für einen Hinweis');return}
  const wrong=CELLS.filter(c=>state.board[c]!==state.sol[c]);
  const c=wrong[Math.random()*wrong.length|0];
  const from=wrong.find(d=>d!==c&&state.board[d]===state.sol[c]);
  if(from==null) return;
  setCoins(coins-HINT_COST); clearSel(); swap(c,from,true);
});

function words(){return [0,5,10,15].map(i=>state.p.slice(i,i+5))}
function win(){
  $('board').classList.add('win');
  const d=days[dayIdx], stars=Math.min(3,state.moves);
  let reward=0;
  if(!d.r){reward=100+state.moves*20;d.r=true;d.st=stars;setCoins(coins+reward)}
  else d.st=Math.max(d.st||0,stars);
  saveDays(); render();
  const next=nextOpen();
  setTimeout(()=>overlay(`<h2>Gelöst!</h2>
    <div class="stars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3-stars)}</span></div>
    <div class="words">${words().map(w=>'<span>'+w+'</span>').join('')}</div>
    <p style="text-align:center">${state.moves} Züge übrig${reward?' · +'+reward+' Münzen':' · Münzen gab es schon beim ersten Lösen'}</p>
    <div class="row"><a class="btn alt" href="../" style="text-decoration:none;text-align:center">Übersicht</a><button class="btn alt" data-act="cal">Kalender</button>${next!=null?'<button class="btn" data-act="open" data-day="'+next+'">Nächstes offenes</button>':''}</div>`),700);
}
function lose(){
  overlay(`<h2>Keine Züge mehr</h2><p>Die gesuchten Wörter waren:</p>
    <div class="words lost">${words().map(w=>'<span>'+w+'</span>').join('')}</div>
    <div class="row"><button class="btn alt" data-act="retry">Nochmal</button><button class="btn" data-act="cal">Kalender</button></div>`);
}
/* Nächstes ungelöstes Rätsel: zuerst heute und verpasste Tage, dann kommende */
function nextOpen(){
  const t=Math.min(todayIdx(),LAST), open=i=>!days[i]||(days[i].s!=='won'&&days[i].s!=='lost');
  if(open(t)&&t!==dayIdx) return t;
  for(let i=t;i>=0;i--) if(open(i)&&i!==dayIdx) return i;
  for(let i=t+1;i<=LAST;i++) if(open(i)&&i!==dayIdx) return i;
  return null;
}

let calMonth=null;
function calendar(){
  const d=dateOf(dayIdx);
  if(!calMonth) calMonth=[d.getUTCFullYear(),d.getUTCMonth()];
  const [y,m]=calMonth, first=new Date(utc(y,m,1)), dim=new Date(utc(y,m+1,0)).getUTCDate();
  const lead=(first.getUTCDay()+6)%7, t=todayIdx();
  let cells=['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>'<div class="wd">'+w+'</div>').join('');
  for(let i=0;i<lead;i++) cells+='<div></div>';
  for(let day=1;day<=dim;day++){
    const i=Math.round((utc(y,m,day)-START_UTC)/DAY), ok=i>=0&&i<=LAST, s=days[i];
    const cls=[s?.s==='won'?'won':s?.s==='lost'?'lost':s?'play':'', i===t?'today':'', i===dayIdx?'cur':''].join(' ');
    const stars=s?.s==='won'?'<small>'+'★'.repeat(s.st||0)+'</small>':'';
    cells+=`<button class="${cls}" ${ok?'data-act="open" data-day="'+i+'"':'disabled'} aria-label="${day}.">${day}${stars}</button>`;
  }
  const minM=[START[0],START[1]], maxD=dateOf(LAST), maxM=[maxD.getUTCFullYear(),maxD.getUTCMonth()];
  const before=y*12+m<=minM[0]*12+minM[1], after=y*12+m>=maxM[0]*12+maxM[1];
  const solved=Object.values(days).filter(x=>x.s==='won').length;
  overlay(`<div class="cal-head"><button class="nav" data-act="calPrev" ${before?'disabled':''} aria-label="Voriger Monat">‹</button>
    <h2>${fmtMonth.format(first)}</h2>
    <button class="nav" data-act="calNext" ${after?'disabled':''} aria-label="Nächster Monat">›</button></div>
    <div class="cal">${cells}</div>
    <div class="legend"><span><span class="sw" style="background:var(--green)"></span>gelöst</span><span><span class="sw" style="background:var(--yellow)"></span>angefangen</span><span><span class="sw" style="background:#5a2f2a"></span>nicht geschafft</span><span><span class="sw" style="outline:2px solid var(--fg)"></span>heute</span></div>
    <p class="prog">${solved} von ${PUZZLES.length} Rätseln gelöst</p>
    <div class="row"><button class="btn alt" data-act="close">Schließen</button><button class="btn" data-act="open" data-day="${Math.min(t,LAST)}">Zu heute</button></div>`);
}

function rules(){
  overlay(`<h2>So spielst du mHash</h2><ul>
    <li>Im Gitter stecken vier deutsche Wörter: zwei waagerecht (von links nach rechts) und zwei senkrecht (von oben nach unten).</li>
    <li>Tausche zwei Buchstaben, indem du einen auf den anderen ziehst. Oder tippe nacheinander auf beide.</li>
    <li><span class="sw" style="background:var(--green)"></span>Grün: Der Buchstabe steht richtig und bleibt fest.</li>
    <li><span class="sw" style="background:var(--yellow)"></span>Gelb: Der Buchstabe gehört in ein Wort seiner Reihe oder Spalte, aber an eine andere Stelle.</li>
    <li><span class="sw" style="background:var(--tile)"></span>Grau: Der Buchstabe gehört in keines dieser Wörter.</li>
    <li>Jeder Tausch kostet einen Zug. Übrige Züge bringen Sterne und Münzen.</li>
    <li>Jeden Tag gibt es ein neues Rätsel. Über den Kalender kannst du verpasste Tage nachholen und kommende vorziehen.</li>
    <li>Ein Hinweis setzt einen Buchstaben richtig und kostet 150 Münzen, aber keinen Zug.</li></ul>
    <button class="btn" data-act="close">Los geht's</button>`);
}
function menu(){
  overlay(`<h2>Menü</h2><div class="menu" style="display:flex;flex-direction:column;gap:10px">
    <button class="btn alt" data-act="cal">Kalender</button>
    <button class="btn alt" data-act="retry">Rätsel neu starten</button>
    <button class="btn alt" data-act="rules">Regeln</button>
    <button class="btn" data-act="close">Weiterspielen</button></div>`);
}
function overlay(html){$('card').innerHTML=html;$('ov').hidden=false}
$('ov').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'), act=el?.dataset.act;
  if(!act){if(e.target.id==='ov')$('ov').hidden=true;return}
  if(act==='calPrev'||act==='calNext'){calMonth=[calMonth[0],calMonth[1]+(act==='calNext'?1:-1)];
    const d=new Date(utc(calMonth[0],calMonth[1],1));calMonth=[d.getUTCFullYear(),d.getUTCMonth()];calendar();return}
  $('ov').hidden=true;
  if(act==='open'){showGame(+el.dataset.day)}
  if(act==='retry'){state.board={...state.start};state.moves=MOVES;state.status='play';persist();render()}
  if(act==='rules') rules();
  if(act==='cal'){calMonth=null;calendar()}
});
let tt;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800)}

function showGame(i){
  openDay(i);
  if(!store.get('seenRules',false)){store.set('seenRules',true);rules()}
}
$('help').addEventListener('click',rules);
$('menuBtn').addEventListener('click',menu);
$('prevDay').addEventListener('click',()=>openDay(dayIdx-1));
$('nextDay').addEventListener('click',()=>openDay(dayIdx+1));
$('dateBtn').addEventListener('click',()=>{calMonth=null;calendar()});
setCoins(coins);
const qd=parseInt(new URLSearchParams(location.search).get('tag'),10);
showGame(Number.isFinite(qd)?qd:Math.min(todayIdx(),LAST));
if("serviceWorker" in navigator){navigator.serviceWorker.register("../sw.js",{updateViaCache:"none"}).catch(()=>{})}
</script>
</body>
</html>
