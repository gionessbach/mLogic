<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>mAtom</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="mAtom">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#262625">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
:root{--bg:#262625;--s1:#31312F;--s2:#1D1D1C;--l1:#3A3A38;--l2:#5A5955;--y:#FDD602;--fg:#F2F1EC;--mut:#B9B8B2;--warn:#FF7A6B;--warn2:#FF9B8F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Space Grotesk",system-ui,sans-serif;overflow:hidden;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
.scr{position:fixed;inset:0;display:none;padding:max(16px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.scr.on{display:flex}
.logo{width:52px;height:52px;border-radius:14px;background:var(--y);display:grid;place-items:center;flex:none}
.btn{min-height:52px;padding:12px 26px;border-radius:999px;border:2px solid var(--l2);background:transparent;font-size:18px;font-weight:700}
.btn.pri{background:var(--y);border-color:var(--y);color:var(--bg)}
.btn:active{transform:scale(.97)}
/* Start */
#start{flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#start .back{position:absolute;top:max(16px,env(safe-area-inset-top));left:max(20px,env(safe-area-inset-left));color:var(--mut);text-decoration:none;font-size:17px;padding:10px 4px}
#start .logo{width:104px;height:104px;border-radius:28px}
#start h1{margin:0;font-size:46px}
#start .sub{color:var(--mut);font-size:18px;margin-top:-10px}
.xp{border:2px solid var(--y);color:var(--y);border-radius:999px;padding:6px 16px;font-weight:700}
#start .col{display:flex;flex-direction:column;gap:12px;width:min(320px,100%)}
/* Arena */
#arena{padding:0}
#acv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.atop{position:absolute;left:0;right:0;top:0;padding:max(16px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.atop header,.atop button{pointer-events:auto}
.mass.en .bar i{background:#FFA552}.mass.en.leer .lb b{color:var(--warn2)}
.achips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(29,29,28,.85);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--mut)}
.chip.ok{color:var(--bg)}
#aBanner{position:static;transform:none;align-self:center;white-space:normal;text-align:center;max-width:90%}
#joy{position:absolute;left:max(28px,env(safe-area-inset-left));bottom:max(28px,env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;border:3px solid var(--l2);touch-action:none;background:rgba(29,29,28,.4)}
#joy i{position:absolute;left:42px;top:42px;width:60px;height:60px;border-radius:50%;background:var(--l2);pointer-events:none}
.aauf{position:absolute;left:200px;bottom:max(50px,env(safe-area-inset-bottom));height:64px;padding:0 22px;border-radius:32px;border:none;background:var(--fg);color:var(--bg);font-weight:700;font-size:17px;touch-action:none}
.aauf{display:none}
#aFrage{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(38,38,37,.35);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:20;padding:20px}
#aFrage.on{display:flex}
.fk{background:var(--s1);border-radius:22px;padding:22px;width:min(640px,100%);display:flex;flex-direction:column;gap:12px}
.fk h2{margin:0;font-size:24px}.fk #afZ{color:var(--mut);font-size:14px}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fbt{background:var(--s2);border:2px solid var(--l2);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.4}
.fbt b{font-size:20px}.fbt.pri{border-color:var(--y)}.fbt small{color:var(--mut)}.fbt:active{transform:scale(.98)}
@media (orientation:portrait){.fb{grid-template-columns:1fr}}
#amap{position:absolute;right:max(24px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));width:180px;height:130px;background:var(--s2);border-radius:14px;border:1px solid var(--l1)}
.wk.zu{opacity:.45;filter:grayscale(1)}
#lxDet .card{background:var(--s2);margin-top:12px;width:100%}
.lx div{cursor:pointer}
@media (orientation:portrait){
 #joy{width:120px;height:120px}#joy i{left:30px;top:30px;width:54px;height:54px}
 .aauf{left:auto;right:max(20px,env(safe-area-inset-right));height:56px;font-size:15px;padding:0 18px;bottom:calc(max(24px,env(safe-area-inset-bottom)) + 92px)}
 #amap{width:110px;height:80px}.chip{font-size:12px;padding:4px 10px}
 .atop .mass{width:130px}
}
/* Montage der Protozelle */
#montage{align-items:center;justify-content:center;overflow:auto}
.mo{display:flex;gap:24px;align-items:center;justify-content:center;flex-wrap:wrap}
#moSvg{width:min(260px,62vw);height:auto;background:var(--s2);border-radius:20px}
#moSvg.plopp{animation:plopp .6s}@keyframes plopp{40%{transform:scale(1.08)}}
.mochips{display:flex;flex-direction:column;gap:10px}
.mochip{display:flex;align-items:center;gap:10px;background:var(--s2);border-radius:16px;padding:6px 16px 6px 6px;font-weight:700;touch-action:none;border:2px solid transparent;min-width:190px}
.mochip.dran{border-color:var(--y);animation:puls 1.2s infinite;cursor:grab}.mochip.fertig{opacity:.35}
.mochip .at{position:relative;top:auto;left:auto;margin:0!important;transform:none;pointer-events:none}
.moboni{display:flex;flex-wrap:wrap;gap:8px}.moboni span{background:var(--s2);border-radius:999px;padding:6px 14px;font-size:15px}
#moW{display:none}#moW.on{display:block}
/* Testmodus */
.test{display:none;flex-direction:column;align-items:center;gap:8px;border:2px dashed var(--l2);border-radius:18px;padding:12px 16px;color:var(--mut);font-size:14px}
.test.on{display:flex}.test .r{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.test .btn{min-height:44px;padding:8px 16px;font-size:15px}
/* Dialog / Ende */
#dialog,#ende{align-items:center;justify-content:center}
#ende{overflow:auto}#ende .card{margin:auto}
.card{background:var(--s1);border-radius:22px;padding:28px;width:min(560px,100%);display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-size:28px}
.card p{margin:0;font-size:18px;line-height:1.45;color:#DAD9D3}
.card .sk{display:flex;justify-content:center;background:var(--s2);border-radius:16px;padding:12px}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.dots{display:flex;gap:7px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--l2)}.dots i.on{background:var(--y)}
.kl{color:var(--mut);font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.xpl{display:flex;flex-direction:column;gap:8px;font-size:18px}
.xpl div{display:flex;justify-content:space-between;border-bottom:1px solid var(--l1);padding-bottom:8px}
.xpl .sum{color:var(--y);font-weight:700;border:0}
/* Merge */
#merge{flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header .tt{display:flex;flex-direction:column}
header .tt b{font-size:24px}header .tt span{font-size:14px;color:var(--mut)}
.sp{flex:1}
.stab{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mut)}
.stab .pp{display:flex;gap:5px}.stab i{width:16px;height:16px;border-radius:50%;background:var(--fg);transition:background .3s}.stab i.off{background:transparent;border:2px solid var(--l2)}
.mass{display:flex;flex-direction:column;gap:6px;width:220px}
.mass .lb{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}.mass .lb b{color:var(--fg)}
.bar{height:10px;background:var(--l1);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--y);border-radius:5px;transition:width .4s}
.time{border:2px solid var(--y);color:var(--y);padding:8px 16px;border-radius:999px;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.time.over{border-color:var(--l2);color:var(--mut)}
.ib{width:48px;height:48px;border-radius:12px;border:2px solid var(--l2);background:transparent;display:grid;place-items:center}
.reactors{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.re{position:relative;background:var(--s1);border-radius:22px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;padding:14px 10px 12px;min-height:0;transition:border-color .2s}
.re .h{font-size:15px;color:var(--mut);text-align:center}
.re .nm{font-size:13px;color:var(--mut);opacity:.8}
.re svg{flex:1;width:100%;min-height:0}
.re .need{font-size:14px;color:var(--mut);min-height:20px}
.re .cd{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:#3a2a28;color:var(--warn2);font-weight:700;padding:8px 18px;border-radius:999px;font-size:16px;display:none;white-space:nowrap}
.re.inst{border:2px dashed var(--warn)}.re.inst .h{color:var(--warn2)}.re.inst .cd{display:block}
.re.ok{border:2px solid rgba(253,214,2,.45)}.re.hov{border:2px solid var(--y)}
.re.done{animation:done .5s}.re.dec{animation:dec .45s}
@keyframes done{0%{box-shadow:0 0 0 0 rgba(253,214,2,.7)}100%{box-shadow:0 0 0 18px rgba(253,214,2,0)}}
@keyframes dec{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{position:absolute;left:50%;top:40%;transform:translate(-50%,0);font-weight:700;font-size:22px;pointer-events:none;animation:pop 1s forwards}
@keyframes pop{to{transform:translate(-50%,-50px);opacity:0}}
.belt{position:relative;height:118px;flex:none;background:var(--s2);border-radius:22px;overflow:hidden;
 background-image:repeating-linear-gradient(100deg,transparent 0 117px,var(--l1) 117px 120px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--mut);justify-content:center}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:14px;height:14px;border-radius:50%}
.at{position:absolute;top:50%;left:0;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--bg);touch-action:none;cursor:grab}
.at.drag{position:fixed;top:0;z-index:50;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.45);transition:none}
.at.back{transition:transform .25s ease-in}
.hint{color:var(--mut);font-size:14px;text-align:center;margin-top:-6px}
/* Lexikon */
#lex{position:fixed;inset:0;background:rgba(20,20,19,.85);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
#lex.on{display:flex}
#lex .card{max-height:90vh;overflow:auto}
.lx{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.lx div{background:var(--s2);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:15px}
.lx small{color:var(--mut)}
.feld{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.gebaut{display:flex;flex-wrap:wrap;gap:8px}
.gebaut div{background:var(--s2);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:16px}
.gebaut .k{display:flex;gap:2px}.gebaut .k i{width:12px;height:12px;border-radius:50%}
.gebaut b{color:var(--y)}
/* E2: Molekül-Teilchen, Vorrat, Ereignis-Banner */
.at.mol{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;background:var(--s1);border:2px solid var(--l2);color:var(--fg)}
.at.mol svg{width:88%;height:auto;pointer-events:none}.at.mol span{font-size:11px;line-height:1;margin-top:-1px;pointer-events:none}
.lager{display:none;gap:10px;align-items:center;justify-content:center;font-size:14px;color:var(--mut);flex-wrap:wrap}
.lager.on{display:flex}
.lchip{display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:16px;padding:4px 12px 4px 4px;color:var(--fg);font-weight:700;font-size:16px}
.lchip.leer{opacity:.4}.lchip.need{box-shadow:0 0 0 3px var(--y);animation:puls 1.2s infinite}
@keyframes puls{50%{box-shadow:0 0 0 6px rgba(253,214,2,.25)}}
#weiche{align-items:center;justify-content:center;overflow:auto}.card.wide{width:min(920px,100%);margin:auto}
.wahl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.wk{background:var(--s2);border:2px solid var(--l1);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:15px;color:#DAD9D3}
.wk:active,.wk:hover{border-color:var(--y)}.wk b{font-size:21px;color:var(--fg)}.wk small{color:var(--mut)}
@media (orientation:portrait){.wahl{grid-template-columns:1fr}}.lchip .at{position:relative;top:auto;left:auto;margin:0!important;transform:none}
.feld{position:relative}
.bn{position:absolute;left:50%;transform:translateX(-50%);top:6px;z-index:5;display:none;background:var(--y);color:var(--bg);font-weight:700;padding:8px 18px;border-radius:999px;font-size:16px;pointer-events:none;white-space:nowrap}
.bn.uv{background:#A98BF0;top:50px}.feld.ueber .bn:not(.ms){margin-top:44px}.bn.ms{top:6px;background:var(--s2);color:var(--y);border:2px solid var(--y)}
#bFertig{display:none;min-height:48px;padding:8px 18px;font-size:16px}#bFertig.on{display:block}.bn.on{display:block}
.re.wartet{border:2px dashed var(--y)}.re.wartet .need{color:var(--y)}
/* Hochformat (Smartphone): Band links von oben nach unten, Reaktoren rechts */
@media (orientation:portrait){
 #merge{gap:10px}
 header{gap:10px 14px}header .logo{width:40px;height:40px;border-radius:11px}header .logo svg{width:28px;height:28px}
 header .tt b{font-size:20px}.mass{width:150px}.time{font-size:15px;padding:6px 12px}.ib{width:44px;height:44px}
 .feld{flex-direction:row-reverse;gap:10px}
 .reactors{flex:1;grid-template-columns:1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:10px}
 .re{padding:8px 8px 6px;border-radius:18px}.re .h{font-size:13px}.re .need{font-size:12px;min-height:16px}
 .re .cd{bottom:30px;font-size:14px;padding:6px 14px}
 .belt{width:92px;height:auto;background-image:repeating-linear-gradient(10deg,transparent 0 117px,var(--l1) 117px 120px)}
 .belt .at{top:0;left:50%;margin-top:0!important}
 .bn{font-size:13px;padding:6px 12px;top:4px}.bn.ms{white-space:normal;width:90%;text-align:center}.feld.ueber .bn:not(.ms){margin-top:52px}.bn.uv{top:38px}
 .hint{display:none}.legend{font-size:12px;gap:4px 12px}
}
</style>
</head>
<body>

<section id="start" class="scr on">
  <a class="back" href="../" aria-label="Zurück zu mLogic">← mLogic</a>
  <div class="logo" id="bigLogo"></div>
  <h1>mAtom</h1>
  <div class="sub">Vom Atom zur Zelle</div>
  <div class="xp" id="xpStand">0 XP</div>
  <div class="col">
    <button class="btn pri" id="bWeiter" style="display:none">Lauf fortsetzen</button>
    <button class="btn" id="bNeu">Neuer Lauf</button>
    <button class="btn" id="bLex">Lexikon</button>
  </div>
  <div class="test" id="testBox"></div>
</section>

<section id="dialog" class="scr">
  <div class="card">
    <div class="kl" id="dKl"></div>
    <h2 id="dT"></h2>
    <div class="sk" id="dSk"></div>
    <p id="dP"></p>
    <div class="row"><div class="dots" id="dDots"></div><button class="btn pri" id="dW">Weiter</button></div>
  </div>
</section>

<section id="merge" class="scr">
  <header>
    <div class="logo" id="hLogo"></div>
    <div class="tt"><b>mAtom</b><span id="eTitel">Ebene 1 · Atom → Molekül</span></div>
    <div class="sp"></div>
    <div class="stab"><span>Stabilität</span><div class="pp" id="stab"></div></div>
    <div class="mass"><div class="lb"><span>Kritische Masse</span><b id="massT">0 / 30</b></div><div class="bar"><i id="massB"></i></div></div>
    <span class="time" id="zeit">00:00 / Ziel 05:00</span>
    <button class="btn pri" id="bFertig">Abschließen</button>
    <button class="ib" id="bPause" aria-label="Pause und speichern"><svg width="20" height="20" viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" fill="#F2F1EC"/><rect x="12" y="3" width="4" height="14" fill="#F2F1EC"/></svg></button>
  </header>
  <div class="feld"><div class="reactors" id="reactors"></div>
  <div class="belt" id="belt"></div><div class="bn" id="bnBlitz"></div><div class="bn uv" id="bnUV"></div><div class="bn ms" id="bnMasse"></div></div>
  <div class="lager" id="lager"></div>
  <div class="hint" id="hint"></div>
  <div class="legend" id="legend"></div>
</section>

<section id="weiche" class="scr">
  <div class="card wide">
    <div class="kl" id="wKl"></div>
    <h2 id="wT"></h2>
    <p id="wP"></p>
    <div class="wahl" id="wahl"></div>
  </div>
</section>

<section id="montage" class="scr">
  <div class="card wide">
    <div class="kl">Übergang · Protozelle</div>
    <h2 id="moT"></h2>
    <p id="moP"></p>
    <div class="mo"><svg id="moSvg" viewBox="0 0 240 240"></svg><div class="mochips" id="moChips"></div></div>
    <div class="moboni" id="moBoni"></div>
    <div class="row"><span></span><button class="btn pri" id="moW">Weiter zu Ebene 4</button></div>
  </div>
</section>

<section id="arena" class="scr">
  <canvas id="acv"></canvas>
  <div class="atop">
    <header>
      <div class="logo" id="aLogo"></div>
      <div class="tt"><b>mAtom</b><span id="aTitel"></span></div>
      <div class="sp"></div>
      <div class="mass"><div class="lb"><span>Biomasse</span><b id="aMT"></b></div><div class="bar"><i id="aMB"></i></div></div>
      <div class="mass en"><div class="lb"><span>Energie</span><b id="aET"></b></div><div class="bar"><i id="aEB"></i></div></div>
      <span class="time" id="aZeit"></span>
      <button class="ib" id="aPause" aria-label="Pause und speichern"><svg width="20" height="20" viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" fill="#F2F1EC"/><rect x="12" y="3" width="4" height="14" fill="#F2F1EC"/></svg></button>
    </header>
    <div class="achips" id="aChips"></div>
    <div class="bn" id="aBanner"></div>
  </div>
  <div id="joy" aria-label="Steuer-Joystick"><i></i></div>
  <button id="aAuf" class="aauf">Aufnehmen</button>
  <canvas id="amap" aria-label="Übersichtskarte"></canvas>
  <div id="aFrage"><div class="fk"><div class="kl" id="afKl">Zeitlupe</div><h2 id="afT"></h2>
    <div class="fb"><button class="fbt" id="afFr"></button><button class="fbt pri" id="afAuf"></button></div><small id="afZ"></small></div></div>
</section>

<section id="ende" class="scr">
  <div class="card">
    <div class="kl" id="eKl">Lauf-Ende</div>
    <h2 id="eT"></h2>
    <p id="eP"></p>
    <div id="eExtra" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="xpl" id="eXp"></div>
    <div class="row"><button class="btn" id="eStart">Zum Start</button><button class="btn pri" id="eNeu">Neuer Lauf</button></div>
  </div>
</section>

<div id="lex"><div class="card"><h2>Lexikon</h2><p>Geschöpfe, die du am Ende eines Laufs freischaltest.</p><div class="lx" id="lxList"></div><div id="lxDet"></div><div class="row"><span></span><button class="btn pri" id="lexZu">Schließen</button></div></div></div>

<script>
'use strict';
// ---------- Daten ----------
const EL={H:{c:'#6EC1F0',n:'Wasserstoff',r:24},C:{c:'#A98BF0',n:'Kohlenstoff',r:28},N:{c:'#5DD39E',n:'Stickstoff',r:28},O:{c:'#FF7A6B',n:'Sauerstoff',r:28},P:{c:'#FFA552',n:'Phosphor',r:30},S:{c:'#F2E36B',n:'Schwefel',r:30}};

  for(const[a,b] of bild.b){const A=P(bild.a[a]),B=P(bild.a[b]);s+=`<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#5A5955" stroke-width="${Math.max(2,8*sc)}" stroke-linecap="round"/>`}
  for(const at of bild.a){const[x,y]=P(at),r=EL[at[0]].r*sc*ar;s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${EL[at[0]].c}"/>`+(r>=9?`<text x="${x}" y="${y+r*.36}" font-size="${r}" font-weight="700" text-anchor="middle" fill="#262625" font-family="Space Grotesk, sans-serif">${at[0]}</text>`:'')}
  return s}

function moMalen(){const i=MO.i,e3=MO.b.e3;
  $('moT').textContent=i<3?MO_SCHRITTE[i].t:'Deine Protozelle ist entstanden!';
  $('moP').textContent=(i?MO_SCHRITTE[i-1].p+' ':'')+(i<3?'Ziehen oder antippen.':'Mit dieser Zelle schwimmst du in Ebene 4.');
  let s='';
  if(!i)s+='<circle cx="120" cy="120" r="80" fill="none" stroke="#5A5955" stroke-width="3" stroke-dasharray="8 8"/>';
  else{s+=`<circle cx="120" cy="120" r="80" fill="#31312F" stroke="${i>=3?'#FDD602':'#FF7A6B'}" stroke-width="${i>=3?7:5}"/>`;
    if(i<3)for(let k=0;k<28;k++){const a=k/28*6.283;s+=`<line x1="${120+Math.cos(a)*84}" y1="${120+Math.sin(a)*84}" x2="${120+Math.cos(a)*92}" y2="${120+Math.sin(a)*92}" stroke="#A98BF0" stroke-width="2"/>`}}
  if(i>=2){let d='';for(let k=0;k<=24;k++){const u=k/24;d+=(k?'L':'M')+(70+u*100)+' '+(135+Math.sin(u*14)*10)}s+=`<path d="${d}" stroke="#FFA552" stroke-width="4" fill="none" stroke-linecap="round"/>`}
  if(i>=3)[[90,95],[150,90],[125,165],[165,140],[85,150],[120,100]].forEach(([x,y],k)=>{s+=`<circle cx="${x}" cy="${y}" r="${k%2?6:4}" fill="${k%2?'#5DD39E':'#B9B8B2'}"/>`});
  $('moSvg').innerHTML=s;
  const C=$('moChips');C.innerHTML='';
  MO_SCHRITTE.forEach((st,k)=>{const c=document.createElement('div');c.className='mochip'+(k===i?' dran':k<i?' fertig':'');
    c.appendChild(teilEl(st.id,52));c.append(TEIL[st.id].name+' × '+e3[st.id]);C.appendChild(c);
    if(k===i)c.addEventListener('pointerdown',ev=>moGreife(ev,st.id))});
  $('moBoni').innerHTML=i>=3?boniText(MO.b).map(t=>'<span>'+t+'</span>').join(''):'';
  $('moW').classList.toggle('on',i>=3)}
function moGreife(ev,id){ev.preventDefault();const g=teilEl(id,60);g.classList.add('drag');g.style.marginTop='0';document.body.appendChild(g);
  const x0=ev.clientX,y0=ev.clientY,pid=ev.pointerId;let moved=false;
  const mv=e=>{if(e.pointerId!==pid)return;if(Math.hypot(e.clientX-x0,e.clientY-y0)>12)moved=true;g.style.transform=`translate(${e.clientX-30}px,${e.clientY-30}px)`};
  const up=e=>{if(e.pointerId!==pid)return;removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);g.remove();
    const r=$('moSvg').getBoundingClientRect(),drin=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
    if(e.type==='pointerup'&&(!moved||drin)){MO.i++;moMalen();if(MO.i>=3){const v=$('moSvg');v.classList.remove('plopp');void v.offsetWidth;v.classList.add('plopp')}}};
  mv(ev);addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)}

// Fließband
const hoch=()=>matchMedia('(orientation:portrait)').matches;
function bandBreite(){const b=$('belt');return (hoch()?b.clientHeight:b.clientWidth)||1000}
// kurzes Band (Handy): langsamer, damit jedes Atom lange genug sichtbar bleibt
function bandTempo(){return G.cfg.tempo*Math.min(1,Math.max(0.75,bandBreite()/1000))}
// Nachschub: nur Teilchen, die ein Reaktor braucht; jeder Reaktor bekommt gleich viel, nichts doppelt.
function waehleAtom(){
  // Teilchen, die schon auf dem Band sind, werden den Reaktoren zugeteilt (angefangene, älteste zuerst)
  const rest={};G.band.forEach(it=>{if(it.x>60)rest[it.el]=(rest[it.el]||0)+1});
  for(const k in G.lager)if(!TEIL[k].lager)rest[k]=(rest[k]||0)+G.lager[k]; // Vorrat zählt als schon vorhanden
  const order=G.re.slice().sort((a,b)=>(b.t===null?-1:b.t)-(a.t===null?-1:a.t));const offen=[];
  for(const R of order){if(R.wartet)continue;const fehlt=[];
    R.rez.a.forEach((a,k)=>{const el=a[0];if(R.voll[k]||TEIL[el].lager)return;if(rest[el]>0)rest[el]--;else fehlt.push(el)});
    if(!fehlt.length)continue;if(R.t!==null)return fehlt[0]; // angefangener Reaktor: garantiert zuerst
    offen.push(fehlt)}
  if(!offen.length)return null; // alles Nötige ist schon unterwegs

// Drag & Drop

  if(typeof nx==='number'&&nx){const teile=new Set(REZEPTE[EBENEN[nx].pool].flatMap(r=>r.a.map(a=>a[0])));
    const f=o=>Object.fromEntries(Object.entries(o).filter(([k,v])=>teile.has(k)&&v>0));
    run.mix={[nx]:f(G.gebaut)};run.vorrat={[nx]:f(G.extra)};
    const v=run.vorrat[nx];
    mit=`<div class="kl" style="margin-top:6px">Mitnahme in Ebene ${nx}</div><div>Kommt öfter vor: <b>${topListe(run.mix[nx],3)}</b></div><div>Startvorrat: <b>${Object.keys(v).length?Object.entries(v).map(([k,n])=>n+' × '+TEIL[k].label).join(', '):'leer'}</b>${Object.keys(v).length?'':' <small style="color:var(--mut)">(nach der kritischen Masse weiterbauen füllt ihn)</small>'}</div>`}
  if(nx){run.ebene=nx;sichere('run',run)}else sichere('run',null);
  const pool=REZEPTE[cfg.pool];
  const liste=pool.filter(r=>G.gebaut[r.id]).sort((a,b)=>G.gebaut[b.id]-G.gebaut[a.id]).map(r=>`<div><span class="k">${r.a.map(x=>`<i style="background:${TEIL[x[0]].c}"></i>`).join('')}</span>${r.formel}${r.name!==r.formel?' <small style="color:var(--mut)">'+r.name+'</small>':''} <b>× ${G.gebaut[r.id]}</b></div>`).join('');
  $('eExtra').innerHTML='<div class="kl">Gebaute '+cfg.wort[1]+' · '+G.masse+'</div><div class="gebaut">'+liste+'</div>'+mit;
  endeZeigen(true,run,'Ebene '+G.e+' geschafft!',nx==='weiche'?'Alle Makromoleküle sind fertig. Jetzt entscheidest du, welche Hülle deine Zelle bekommt.':nx?'Die kritische Masse ist erreicht. Weiter geht es mit Ebene '+nx+': '+EBENEN[nx].titel+'.':'Die kritische Masse ist erreicht. In diesem Prototyp endet der Lauf hier – Ebene '+(G.e+1)+' folgt im nächsten Bauschritt.',nx)}
function gescheitert(){G.laeuft=false;const run=G.run;sichere('run',null);const fehl=G.cfg.masse-G.masse;
  $('eExtra').innerHTML=`<div class="kl">Kritische Masse</div><div style="font-size:20px"><b>${G.masse} / ${G.cfg.masse}</b> ${G.cfg.wort[1]} · <b style="color:#FF9B8F">es fehlten ${fehl} ${fehl===1?G.cfg.wort[0]:G.cfg.wort[1]}</b></div><div class="bar"><i style="width:${G.masse/G.cfg.masse*100}%"></i></div>`;
